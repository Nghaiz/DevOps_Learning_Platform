# Loki cho lab 1-node. Chart grafana/loki mặc định dựng kiến trúc PHÂN TÁN
# (read/write/backend + memcached) — hợp lý ở quy mô thật, nhưng trên 11 GB RAM
# nó chiếm phần lớn ngân sách còn lại chỉ để phục vụ log của 5 pod.
#
# SingleBinary + filesystem là hình thái đúng ở đây, và phải TẮT TƯỜNG MINH các
# thành phần phân tán: để mặc định thì chart dựng CẢ HAI, và triệu chứng là pod
# Pending vì hết RAM chứ không phải một thông báo cấu hình.

deploymentMode: SingleBinary

loki:
  auth_enabled: false

  commonConfig:
    # 1, không phải 3 mặc định. Trên một node thì replication_factor 3 nghĩa là
    # Loki chờ 3 bản ghi mà chỉ có 1 ingester ⇒ mọi lượt ghi lỗi, và log lỗi
    # nằm trong chính hệ đang hỏng.
    replication_factor: 1

  storage:
    type: filesystem

  schemaConfig:
    configs:
      - from: '2024-04-01'
        store: tsdb
        object_store: filesystem
        schema: v13
        index:
          prefix: index_
          period: 24h

  limits_config:
    retention_period: 72h
    # Cùng con số 3 ngày với Prometheus: hai nguồn lệch retention thì đúng lúc
    # điều tra sự cố sẽ có metric mà không có log (hoặc ngược lại), và khoảng
    # lệch ấy chỉ lộ ra khi đang cần nhất.
    reject_old_samples: true
    reject_old_samples_max_age: 72h

  # Chart 7.x đòi khai; để trống thì sinh cấu hình thiếu và Loki crash-loop.
  useTestSchema: false

singleBinary:
  replicas: 1
  resources:
    requests:
      cpu: 50m
      memory: 192Mi
    limits:
      memory: 512Mi
  persistence:
    enabled: true
    storageClass: local-path
    size: 5Gi

# ⛔ Tắt tường minh toàn bộ nhánh phân tán.
read:
  replicas: 0
write:
  replicas: 0
backend:
  replicas: 0

chunksCache:
  enabled: false
resultsCache:
  enabled: false

# Canary của Loki tự sinh log để tự kiểm — hữu ích ở production, nhưng ở đây nó
# thêm một Deployment và làm nhiễu đúng phép đo AC-D3 (ta muốn thấy log của
# web/gateway/orchestrator, không phải log do chính Loki bịa ra).
lokiCanary:
  enabled: false

test:
  enabled: false

# Không cần nhiều bản gateway trên 1 node.
gateway:
  replicas: 1
  # nginx-unprivileged: mặc định của chart 7.3.0 là tag trôi `1.29-alpine`, mà nhánh
  # 1.29 không còn được build (đứng ở 1.29.8). Theo nginx.org/en/security_advisories,
  # 1.29.8 dính 17/20 advisory gần nhất (có CVE-2026-42533 mức major); 1.30.6 không
  # dính cái nào. Ghim patch, đổi lên khi có 1.30.x mới. (2026-10-28)
  image:
    tag: 1.30.6-alpine
  # Chart ép podAntiAffinity BẮT BUỘC theo hostname cho gateway. Trên cụm MỘT node,
  # pod mới không lập lịch được khi pod cũ còn sống, nên mọi rolling update treo
  # Pending vĩnh viễn mà `helm upgrade` vẫn báo deployed (đo 2026-10-28, lượt đổi
  # image ở trên — lần rollout đầu tiên của gateway kể từ khi cài).
  # ⚠ Phải là `null` cho đúng key: helm TRỘN SÂU map, nên `affinity: {}` không xoá
  # được mặc định của chart — đã thử, render vẫn ra podAntiAffinity.
  affinity:
    podAntiAffinity: null
  # Recreate thay RollingUpdate: anti-affinity BẮT BUỘC được áp HAI CHIỀU, nên pod
  # cũ (còn mang ràng buộc) chặn pod mới dù pod mới đã bỏ nó; RollingUpdate với 1
  # replica (maxUnavailable làm tròn về 0) không chịu tắt pod cũ trước ⇒ kẹt. Cái
  # giá là vài giây gateway vắng mặt mỗi lần rollout; promtail tự thử lại.
  deploymentStrategy:
    type: Recreate
  resources:
    requests:
      cpu: 10m
      memory: 32Mi
    limits:
      memory: 128Mi
