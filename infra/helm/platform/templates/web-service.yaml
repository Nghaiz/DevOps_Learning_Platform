{{- if .Values.web.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "platform.fullname" . }}-web
  labels:
    {{- include "platform.componentLabels" (dict "context" . "component" "web") | nindent 4 }}
spec:
  type: {{ .Values.web.service.type | default "ClusterIP" }}
  ports:
    - name: http
      port: {{ .Values.web.service.port }}
      targetPort: http
  selector:
    {{- include "platform.selectorLabels" (dict "context" . "component" "web") | nindent 4 }}
{{- end }}
