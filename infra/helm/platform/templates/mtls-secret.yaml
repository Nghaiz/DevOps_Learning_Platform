{{- if ne .Values.platform.grpcMtlsMode "off" }}
{{- /*
  CA nội bộ + ba cert cho mTLS gRPC (1.C-4, đóng R25/B0′/R13/D13).

  ⛔ VÌ SAO KHÔNG DÙNG cert-manager: cụm lab không có nó, và cài thêm nghĩa là
  side-load ba image nữa qua mạng VM ~52 KiB/s CỘNG một operator phải bảo trì —
  và nó là thành phần của CỤM, không của chart, nên ai dựng lại lab phải nhớ cài
  trước. Chart tự sinh giữ được tính chất "một `helm install` là đủ". Đổi ý ở P3
  khi có multi-node thì thay đúng file này; ba service không phải biết.

  ⛔ `lookup` LÀ THỨ GIỮ CA KHÔNG ĐỔI QUA MỖI `helm upgrade`, VÀ NÓ CÓ MỘT BẪY.
  `genCA` sinh khoá MỚI mỗi lần render. Không có nhánh lookup thì mỗi upgrade
  phát một CA khác, ba pod cuốn không đồng thời, và trong cửa sổ đó pod mang cert
  CA cũ nói chuyện với server tin CA mới ⇒ bắt tay hỏng. Triệu chứng là
  `Unauthenticated` rải rác tự khỏi sau vài chục giây — đúng loại lỗi bị đổ cho
  "mạng chập".

  Bẫy: `lookup` LUÔN trả rỗng khi `helm template` / `--dry-run` (không có kết nối
  API server). Nên `helm diff`/`template` sẽ LUÔN hiện cert đổi dù thực tế không
  đổi. Đó là hiện vật của công cụ, KHÔNG phải tín hiệu — đừng đi "sửa" nó bằng
  cách bỏ lookup.
*/}}
{{- $secretName := printf "%s-mtls" (include "platform.fullname" .) }}
{{- $prev := lookup "v1" "Secret" .Release.Namespace $secretName }}
{{- if $prev }}
{{- /* Đã có: giữ NGUYÊN byte cũ. Không render lại gì cả. */}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $secretName }}
  labels:
    {{- include "platform.labels" . | nindent 4 }}
type: Opaque
data:
  {{- toYaml $prev.data | nindent 2 }}
{{- else }}
{{- /*
  SAN phải phủ MỌI dạng tên mà client dùng để dial, vì crypto/tls đối chiếu
  ServerName với SAN chứ không với CN (CN đã bị bỏ từ Go 1.15). Ba dạng đang
  thật sự được dùng trong repo này:
    - `platform-orchestrator`                        (Helm dựng ORCHESTRATOR_GRPC_ADDR)
    - `platform-orchestrator.<ns>.svc`               (dạng rút gọn của DNS cụm)
    - `platform-orchestrator.<ns>.svc.cluster.local` (FQDN đầy đủ)
  Kèm `localhost` cho port-forward khi chẩn đoán bằng grpcurl — thiếu nó thì mọi
  lượt debug qua port-forward đều đỏ vì SAN, và người debug sẽ đi tìm lỗi ở chỗ khác.
*/}}
{{- $svc := printf "%s-orchestrator" (include "platform.fullname" .) }}
{{- $altNames := list
      $svc
      (printf "%s.%s.svc" $svc .Release.Namespace)
      (printf "%s.%s.svc.cluster.local" $svc .Release.Namespace)
      "localhost" }}
{{- $ca := genCA (printf "%s-grpc-ca" (include "platform.fullname" .)) 3650 }}
{{- $server := genSignedCert $svc (list "127.0.0.1") $altNames 3650 $ca }}
{{- /*
  CN của cert client là thứ orchestrator ghim ở GRPC_MTLS_SYSTEM_CNS. Hai CN
  KHÁC NHAU có chủ ý: chỉ gateway được dùng nhánh actor.system_component. Cùng
  một CN cho cả hai thì mTLS chặn được kẻ ngoài nhưng apps/web reap được session
  của bất kỳ ai — xem comment ở internal/grpcserver/session_service.go.
*/}}
{{- $gateway := genSignedCert (printf "%s-gateway" (include "platform.fullname" .)) nil nil 3650 $ca }}
{{- $web := genSignedCert (printf "%s-web" (include "platform.fullname" .)) nil nil 3650 $ca }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $secretName }}
  labels:
    {{- include "platform.labels" . | nindent 4 }}
type: Opaque
data:
  ca.crt: {{ $ca.Cert | b64enc }}
  server.crt: {{ $server.Cert | b64enc }}
  server.key: {{ $server.Key | b64enc }}
  gateway.crt: {{ $gateway.Cert | b64enc }}
  gateway.key: {{ $gateway.Key | b64enc }}
  web.crt: {{ $web.Cert | b64enc }}
  web.key: {{ $web.Key | b64enc }}
{{- end }}
{{- end }}
