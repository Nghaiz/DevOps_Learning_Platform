{{- if .Values.orchestrator.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "platform.fullname" . }}-orchestrator
  labels:
    {{- include "platform.componentLabels" (dict "context" . "component" "orchestrator") | nindent 4 }}
spec:
  replicas: {{ .Values.orchestrator.replicaCount }}
  selector:
    matchLabels:
      {{- include "platform.selectorLabels" (dict "context" . "component" "orchestrator") | nindent 6 }}
  template:
    metadata:
      {{- if and .Values.datastore.enabled (not .Values.datastore.existingSecret) }}
      annotations:
        # Đổi mật khẩu trong Secret mà orchestrator không rollout thì pod cũ giữ
        # URL cũ (env đọc một lần lúc container start) — Redis đỏ NOAUTH trong
        # khi `helm upgrade` báo thành công. Checksum buộc pod template đổi theo
        # nội dung Secret.
        #
        # ⚠ CHÚ Ý VỚI POSTGRES — checksum KHÔNG cứu được, và có thể làm hỏng:
        # `POSTGRES_PASSWORD` chỉ có tác dụng lúc `initdb` chạy trên PGDATA rỗng.
        # PVC có `helm.sh/resource-policy: keep`, nên từ lần thứ hai trở đi DB
        # giữ NGUYÊN mật khẩu cũ. Truyền `--set datastore.postgres.password=$(openssl
        # rand ...)` ở mỗi lần upgrade sẽ sinh mật khẩu mới → Secret đổi → checksum
        # đổi → mọi consumer rollout với URL SAI → 28P01 toàn hệ thống, `helm
        # upgrade` vẫn báo thành công. Mật khẩu Postgres phải CỐ ĐỊNH sau lần init
        # đầu; xoay thật thì `ALTER ROLE` trước rồi mới đổi Secret. Xem
        # infra/helm/README.md § "Xoay mật khẩu".
        checksum/datastore-secret: {{ include (print $.Template.BasePath "/datastore-secret.yaml") . | sha256sum }}
      {{- end }}
      labels:
        {{- include "platform.selectorLabels" (dict "context" . "component" "orchestrator") | nindent 8 }}
    spec:
      serviceAccountName: {{ include "platform.fullname" . }}-orchestrator
      {{- if .Values.platform.priorityClassEnabled }}
      priorityClassName: {{ .Values.platform.priorityClassName }}
      {{- end }}
      {{- with .Values.orchestrator.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.orchestrator.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: orchestrator
          image: '{{ .Values.image.registry }}/{{ .Values.orchestrator.image.repository }}:{{ .Values.orchestrator.image.tag | default .Values.image.tag }}'
          imagePullPolicy: {{ .Values.orchestrator.image.pullPolicy | default .Values.global.imagePullPolicy }}
          ports:
            - name: http
              containerPort: 8081
            - name: grpc
              containerPort: 9090
          env:
            - name: GRPC_ADDR
              value: {{ .Values.orchestrator.env.grpcAddr | quote }}
            - name: HTTP_ADDR
              value: {{ .Values.orchestrator.env.httpAddr | quote }}
            - name: LOG_LEVEL
              value: {{ .Values.orchestrator.env.logLevel | quote }}
            - name: GRPC_REFLECTION
              value: {{ .Values.orchestrator.env.grpcReflection | quote }}
            {{- /*
            Hai URL này CHỨA MẬT KHẨU. Khi datastore in-cluster bật, chúng đến
            từ Secret (templates/datastore-secret.yaml) chứ KHÔNG phải env.value:
            `kubectl get deploy -o yaml` là quyền phổ thông, và mật khẩu Redis
            đọc được nghĩa là ghi đè được `session:{id}:pod` — SSOT ánh xạ
            session→pod, tức là đường nối user A vào shell của user B.

            Giá trị trong values (managed DB trên cloud) vẫn là đường hợp lệ và
            được giữ nguyên: nó THẮNG datastore in-cluster khi được đặt tường
            minh, để trỏ sang RDS/ElastiCache không cần tắt datastore trước.
            */}}
            {{- if and .Values.datastore.enabled .Values.datastore.postgres.enabled (not .Values.orchestrator.env.databaseUrl) }}
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: {{ include "platform.datastoreSecretName" . }}
                  key: DATABASE_URL
            {{- else }}
            - name: DATABASE_URL
              value: {{ .Values.orchestrator.env.databaseUrl | quote }}
            {{- end }}
            {{- if and .Values.datastore.enabled .Values.datastore.redis.enabled (not .Values.orchestrator.env.redisUrl) }}
            - name: REDIS_URL
              valueFrom:
                secretKeyRef:
                  name: {{ include "platform.datastoreSecretName" . }}
                  key: REDIS_URL
            {{- else }}
            - name: REDIS_URL
              value: {{ .Values.orchestrator.env.redisUrl | quote }}
            {{- end }}
            - name: SESSION_TTL
              value: {{ .Values.orchestrator.env.sessionTtl | quote }}
            - name: SHUTDOWN_GRACE
              value: {{ .Values.orchestrator.env.shutdownGrace | quote }}
            - name: SANDBOX_NAMESPACE
              value: {{ .Values.orchestrator.env.sandboxNamespace | quote }}
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 15
            periodSeconds: 20
          resources:
            {{- toYaml .Values.orchestrator.resources | nindent 12 }}
{{- end }}
