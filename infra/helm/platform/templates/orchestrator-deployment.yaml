{{- if .Values.orchestrator.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "platform.fullname" . }}-orchestrator
  labels:
    {{- include "platform.componentLabels" (dict "context" . "component" "orchestrator") | nindent 4 }}
spec:
  replicas: {{ .Values.orchestrator.replicaCount }}
  # ⛔ maxSurge: 0 — KHÔNG bao giờ để hai orchestrator cùng sống.
  #
  # Orchestrator là manager của warm pool: nó dựng pod sandbox từ `SANDBOX_IMAGE`
  # rồi đẩy vào `pool:free`. Mặc định của Deployment là `maxSurge: 25%`, mà 25%
  # của `replicas: 1` LÀM TRÒN LÊN thành 1 — nên trong lúc `helm upgrade`, replica
  # CŨ (mang SANDBOX_IMAGE cũ) và replica MỚI cùng sống và cùng ghi vào MỘT pool.
  #
  # Đã đo trên cụm lab 2026-09-08, log orchestrator sau khi đổi p10a → p13ide:
  # ba pod ảnh cũ bị rút lúc 07:37:35, rồi một pod ảnh cũ THỨ TƯ xuất hiện lúc
  # 07:38:34 — tức +59s, SAU vòng sweep khởi động của replica mới. Nguồn của nó
  # chỉ có thể là replica cũ còn sống. Ai claim trong cửa sổ đó nhận pod ảnh cũ,
  # và triệu chứng là `/ide` trả 503 chứ không phải một lỗi rollout.
  #
  # ⚠ Bảo đảm "không bao giờ hai SANDBOX_IMAGE" chỉ đúng ở `replicas: 1`. Với
  # replicas > 1, maxSurge 0 vẫn cuộn từng pod nên hai đời VẪN cùng sống, chỉ ít
  # hơn. Muốn nhiều replica thì phải khoá việc dựng pod về một leader, không phải
  # chỉnh chiến lược rollout.
  #
  # Cái giá: orchestrator ngưng vài chục giây giữa lượt nâng cấp (pod cũ tắt trước
  # khi pod mới Ready). Đổi một khoảng hỏng NGẮN và ỒN (start phiên trả lỗi ngay)
  # lấy một pod sai ảnh nằm im trong pool tới khi có người trúng nó.
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 0
      maxUnavailable: 1
  selector:
    matchLabels:
      {{- include "platform.selectorLabels" (dict "context" . "component" "orchestrator") | nindent 6 }}
  template:
    metadata:
      {{- if or (and .Values.datastore.enabled (not .Values.datastore.existingSecret)) (ne .Values.platform.grpcMtlsMode "off") }}
      annotations:
      {{- end }}
      {{- if ne .Values.platform.grpcMtlsMode "off" }}
        {{- /* Xem giải thích ở gateway-deployment.yaml — cùng lý do. */}}
        checksum/mtls-secret: {{ include (print $.Template.BasePath "/mtls-secret.yaml") . | sha256sum }}
      {{- end }}
      {{- if and .Values.datastore.enabled (not .Values.datastore.existingSecret) }}
        # Đổi mật khẩu trong Secret mà orchestrator không rollout thì pod cũ giữ
        # URL cũ (env đọc một lần lúc container start) — Redis đỏ NOAUTH trong
        # khi `helm upgrade` báo thành công. Checksum buộc pod template đổi theo
        # nội dung Secret.
        #
        # ⚠ CHÚ Ý VỚI POSTGRES — checksum KHÔNG cứu được, và có thể làm hỏng:
        # `POSTGRES_PASSWORD` chỉ có tác dụng lúc `initdb` chạy trên PGDATA rỗng.
        # PVC có `helm.sh/resource-policy: keep`, nên từ lần thứ hai trở đi DB
        # giữ NGUYÊN mật khẩu cũ. Truyền `--set datastore.postgres.password=$(openssl
        # rand ...)` ở mỗi lần upgrade sẽ sinh mật khẩu mới → Secret đổi → checksum
        # đổi → mọi consumer rollout với URL SAI → 28P01 toàn hệ thống, `helm
        # upgrade` vẫn báo thành công. Mật khẩu Postgres phải CỐ ĐỊNH sau lần init
        # đầu; xoay thật thì `ALTER ROLE` trước rồi mới đổi Secret. Xem
        # infra/helm/README.md § "Xoay mật khẩu".
        checksum/datastore-secret: {{ include (print $.Template.BasePath "/datastore-secret.yaml") . | sha256sum }}
      {{- end }}
      labels:
        {{- include "platform.selectorLabels" (dict "context" . "component" "orchestrator") | nindent 8 }}
    spec:
      {{- include "platform.mtlsPodSecurityContext" . | nindent 6 }}
      serviceAccountName: {{ include "platform.fullname" . }}-orchestrator
      {{- if .Values.platform.priorityClassEnabled }}
      priorityClassName: {{ .Values.platform.priorityClassName }}
      {{- end }}
      {{- with .Values.orchestrator.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.orchestrator.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: orchestrator
          image: '{{ .Values.image.registry }}/{{ .Values.orchestrator.image.repository }}:{{ .Values.orchestrator.image.tag | default .Values.image.tag }}'
          imagePullPolicy: {{ .Values.orchestrator.image.pullPolicy | default .Values.global.imagePullPolicy }}
          ports:
            - name: http
              containerPort: 8081
            - name: grpc
              containerPort: 9090
          env:
            - name: GRPC_ADDR
              value: {{ .Values.orchestrator.env.grpcAddr | quote }}
            - name: HTTP_ADDR
              value: {{ .Values.orchestrator.env.httpAddr | quote }}
            - name: LOG_LEVEL
              value: {{ .Values.orchestrator.env.logLevel | quote }}
            - name: GRPC_REFLECTION
              value: {{ .Values.orchestrator.env.grpcReflection | quote }}
            {{- /*
            Hai URL này CHỨA MẬT KHẨU. Khi datastore in-cluster bật, chúng đến
            từ Secret (templates/datastore-secret.yaml) chứ KHÔNG phải env.value:
            `kubectl get deploy -o yaml` là quyền phổ thông, và mật khẩu Redis
            đọc được nghĩa là ghi đè được `session:{id}:pod` — SSOT ánh xạ
            session→pod, tức là đường nối user A vào shell của user B.

            Giá trị trong values (managed DB trên cloud) vẫn là đường hợp lệ và
            được giữ nguyên: nó THẮNG datastore in-cluster khi được đặt tường
            minh, để trỏ sang RDS/ElastiCache không cần tắt datastore trước.
            */}}
            {{- if and .Values.datastore.enabled .Values.datastore.postgres.enabled (not .Values.orchestrator.env.databaseUrl) }}
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: {{ include "platform.datastoreSecretName" . }}
                  key: DATABASE_URL
            {{- else }}
            - name: DATABASE_URL
              value: {{ .Values.orchestrator.env.databaseUrl | quote }}
            {{- end }}
            {{- if and .Values.datastore.enabled .Values.datastore.redis.enabled (not .Values.orchestrator.env.redisUrl) }}
            - name: REDIS_URL
              valueFrom:
                secretKeyRef:
                  name: {{ include "platform.datastoreSecretName" . }}
                  key: REDIS_URL
            {{- else }}
            - name: REDIS_URL
              value: {{ .Values.orchestrator.env.redisUrl | quote }}
            {{- end }}
            - name: SESSION_TTL
              value: {{ .Values.orchestrator.env.sessionTtl | quote }}
            - name: SHUTDOWN_GRACE
              value: {{ .Values.orchestrator.env.shutdownGrace | quote }}
            - name: SANDBOX_NAMESPACE
              value: {{ .Values.orchestrator.env.sandboxNamespace | quote }}
            - name: HARD_CAP
              value: {{ .Values.orchestrator.env.hardCap | quote }}
            - name: POOL_TARGET
              value: {{ .Values.orchestrator.env.poolTarget | quote }}
            {{- /*
            Image pod lab kế thừa `image.registry` + `image.tag` y như mọi image
            khác của chart. Hardcode `ghcr.io/nghaiz` + `dev` ở values là tạo
            bản sao thứ hai của hai giá trị đó, và triệu chứng khi nó trôi rất
            khó lần: `helm upgrade` đổi tag cho web/orchestrator/gateway, còn
            pod sinh viên vẫn dựng từ image đời trước mà không log nào nói vì sao.
            */}}
            - name: SANDBOX_IMAGE
              value: {{ .Values.orchestrator.env.sandboxImage | default (printf "%s/dlp-sandbox-base:%s" .Values.image.registry .Values.image.tag) | quote }}
            {{- /*
            RuntimeClass kế thừa `sandbox.runtimeClassName` — đó là SSOT, vì
            chính giá trị đó nằm trong CEL #1 của ValidatingAdmissionPolicy.
            Nhân bản hằng số này vào hai chỗ nghĩa là một ngày nào đó đổi một
            chỗ, và triệu chứng KHÔNG trỏ về nguyên nhân: mọi pod bị admission
            từ chối, còn log chỉ nói "warm-pool không bao giờ đầy".
            */}}
            - name: SANDBOX_RUNTIME_CLASS
              value: {{ .Values.orchestrator.env.sandboxRuntimeClass | default .Values.sandbox.runtimeClassName | quote }}
            {{- /*
            SSOT là `sandbox.profiles` (P7 7.C) — CÙNG lý lẽ với SANDBOX_IMAGE/
            SANDBOX_RUNTIME_CLASS ở trên: hai bản chép rời của cùng số sẽ trôi
            khỏi nhau. `toJson` trên một map RỖNG ({}) ra đúng "{}", và
            `config.parseSandboxProfiles("{}")` trả map rỗng — KHÔNG đổi hành vi
            so với hôm nay. `default dict` chỉ để an toàn khi một values đè
            (values-selfhost.yaml, …) quên khai hẳn khối `sandbox.profiles`.
            */}}
            - name: SANDBOX_PROFILES
              value: {{ .Values.sandbox.profiles | default dict | toJson | quote }}
            {{- if .Values.registryMirror.enabled }}
            {{- /*
            URL mirror docker.io mà pod sandbox trỏ dockerd tới (P3/3.I). CHỈ set
            khi mirror bật — tắt mirror ⇒ không có env ⇒ podspec.go không thêm
            DLP_REGISTRY_MIRROR ⇒ sandbox chạy y hệt hôm nay (không hồi quy).
            Mặc định tự ghép từ tên Service mirror (SSOT), y như SANDBOX_IMAGE tự
            ghép từ image.registry+tag; override qua orchestrator.env.registryMirror
            chỉ khi ghim một mirror ngoài chart.
            */}}
            - name: SANDBOX_REGISTRY_MIRROR
              value: {{ .Values.orchestrator.env.registryMirror | default (printf "http://%s-registry-mirror.%s.svc.cluster.local:%v" (include "platform.fullname" .) .Values.registryMirror.namespace .Values.registryMirror.service.port) | quote }}
            {{- end }}
            - name: EXTEND_DEFAULT
              value: {{ .Values.orchestrator.env.extendDefault | quote }}
            - name: REAP_INTERVAL
              value: {{ .Values.orchestrator.env.reapInterval | quote }}
            {{- /*
              ⛔ BẪY KHOÁ CŨ — PHẢI NỔ, KHÔNG ĐƯỢC BỎ QUA.

              `capacitySoftLimit` đã ĐỔI THÀNH `capacityHardLimit` (P13: trần mềm
              nay được orchestrator TÍNH = hard − poolTarget, xem values.yaml).
              Helm KHÔNG cảnh báo về key lạ trong `-f` hay `--set`: một values
              file cũ, hay một `--set orchestrator.env.capacitySoftLimit=25` gõ
              theo trí nhớ, sẽ được nhận và LẶNG LẼ không có tác dụng gì — đúng
              bẫy `helm-accepts-unknown-set-keys`, nơi `helm get values` in lại
              chính khoá sai đó nên mọi lệnh đều đọc ra như đã xác nhận.

              Ở đây thì hậu quả còn tệ hơn im lặng: `helm upgrade` vẫn thành
              công, orchestrator vẫn lên xanh, và trần FE hiện là giá trị của
              `capacityHardLimit` — có thể là mặc định cloud-shaped 8 của
              values.yaml — trong khi người vận hành tin mình vừa đặt 25.
            */}}
            {{- if hasKey .Values.orchestrator.env "capacitySoftLimit" }}
            {{- fail "[orchestrator:E-CAPACITY-KEY-RENAMED] `orchestrator.env.capacitySoftLimit` KHÔNG CÒN ĐƯỢC ĐỌC — đổi tên thành `orchestrator.env.capacityHardLimit` (P13). Trần mềm mà FE hiện (\"còn N chỗ\") nay được orchestrator TÍNH = capacityHardLimit − poolTarget, nên KHÔNG khai nó nữa: khai cả hai là hai nguồn cho một sự thật và chúng sẽ trôi khỏi nhau khi poolTarget đổi. Đặt `capacityHardLimit` = TRẦN VẬT LÝ đã đo của cụm (lab: 23 — xem values-selfhost.yaml § sandbox.quota) rồi BỎ HẲN capacitySoftLimit. Nếu bạn tới đây qua `helm upgrade --reuse-values`, key cũ đến từ values ĐÃ TÍNH của release trước: dùng --reset-then-reuse-values." }}
            {{- end }}
            # BẮT BUỘC — internal/config.Load() từ chối khởi động nếu thiếu
            # (P13 D5). Không `| default`: một mặc định ở tầng template sẽ che
            # mất chính cổng fail-fast mà config.go dựng lên.
            - name: CAPACITY_HARD_LIMIT
              value: {{ required "orchestrator.env.capacityHardLimit là bắt buộc — orchestrator sẽ CrashLoopBackOff ngay lúc khởi động nếu thiếu (internal/config.Load fail-fast). Đây là TRẦN VẬT LÝ đã ĐO của quota sandbox; trần mềm FE hiện được TÍNH = giá trị này − poolTarget. Xem values.yaml § capacityHardLimit." .Values.orchestrator.env.capacityHardLimit | quote }}
            {{- include "platform.mtlsEnv" (dict "context" . "cert" "server") | nindent 12 }}
            {{- if ne .Values.platform.grpcMtlsMode "off" }}
            {{- /*
            Allowlist CN được dùng nhánh actor.system_component. CHỈ gateway —
            apps/web có cert hợp lệ nhưng KHÔNG được phong system_component, vì
            việc của nó là reap phiên của chính người đang đăng nhập (nhánh
            user_id). Xem internal/grpcserver/session_service.go.
            */}}
            - name: GRPC_MTLS_SYSTEM_CNS
              value: {{ printf "%s-gateway" (include "platform.fullname" .) | quote }}
            {{- end }}
          {{- if ne .Values.platform.grpcMtlsMode "off" }}
          volumeMounts:
            {{- include "platform.mtlsVolumeMount" . | nindent 12 }}
          {{- end }}
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 15
            periodSeconds: 20
          resources:
            {{- toYaml .Values.orchestrator.resources | nindent 12 }}
      {{- if ne .Values.platform.grpcMtlsMode "off" }}
      volumes:
        {{- include "platform.mtlsVolume" (dict "context" . "cert" "server") | nindent 8 }}
      {{- end }}
{{- end }}
