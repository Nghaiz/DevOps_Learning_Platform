{{- if .Values.web.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "platform.fullname" . }}-web
  labels:
    {{- include "platform.componentLabels" (dict "context" . "component" "web") | nindent 4 }}
spec:
  replicas: {{ .Values.web.replicaCount }}
  selector:
    matchLabels:
      {{- include "platform.selectorLabels" (dict "context" . "component" "web") | nindent 6 }}
  template:
    metadata:
      {{- if not .Values.web.env.existingSecret }}
      annotations:
        # Đổi giá trị trong Secret KHÔNG tự rollout pod đang chạy (env đọc một
        # lần lúc container start). Checksum làm pod template đổi theo nội dung
        # Secret ⇒ `helm upgrade` xoay pod. Thiếu dòng này thì xoay
        # BETTER_AUTH_SECRET xong pod cũ vẫn ký bằng khoá cũ, và "đã xoay secret"
        # là niềm tin sai.
        checksum/web-secret: {{ include (print $.Template.BasePath "/web-secret.yaml") . | sha256sum }}
      {{- end }}
      labels:
        {{- include "platform.selectorLabels" (dict "context" . "component" "web") | nindent 8 }}
    spec:
      serviceAccountName: {{ include "platform.fullname" . }}-web
      # web đứng trước internet, chỉ gọi orchestrator qua gRPC — không có lý
      # do gì cầm token API server. Lặp lại false ở đây dù ServiceAccount
      # (templates/rbac.yaml) đã set — 2 lớp phòng thủ.
      automountServiceAccountToken: false
      {{- if .Values.platform.priorityClassEnabled }}
      priorityClassName: {{ .Values.platform.priorityClassName }}
      {{- end }}
      {{- with .Values.web.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.web.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: web
          image: '{{ .Values.image.registry }}/{{ .Values.web.image.repository }}:{{ .Values.web.image.tag | default .Values.image.tag }}'
          imagePullPolicy: {{ .Values.web.image.pullPolicy | default .Values.global.imagePullPolicy }}
          ports:
            - name: http
              containerPort: {{ .Values.web.service.port }}
          env:
            # DATABASE_URL/REDIS_URL: OMIT khi rỗng thay vì set chuỗi rỗng —
            # env.ts coi '' y như thiếu (throw). P0 chưa có Postgres/Redis
            # in-cluster nên các route đụng DB sẽ 500 cho tới P1; /api/health cố
            # ý không đụng DB nên probe vẫn phản ánh đúng "process sống".
            {{- with .Values.web.env.databaseUrl }}
            - name: DATABASE_URL
              value: {{ . | quote }}
            {{- end }}
            {{- with .Values.web.env.redisUrl }}
            - name: REDIS_URL
              value: {{ . | quote }}
            {{- end }}
            # 3 credential dưới đây đi qua secretKeyRef, KHÔNG phải env.value:
            # `kubectl get deploy -o yaml` là quyền đọc phổ thông, và secret ký
            # session/JWT lộ ra đó nghĩa là giả mạo được session mọi user. Xem
            # templates/web-secret.yaml.
            - name: BETTER_AUTH_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ include "platform.webSecretName" . }}
                  key: BETTER_AUTH_SECRET
            - name: BETTER_AUTH_URL
              value: {{ .Values.web.env.betterAuthUrl | quote }}
            {{- with .Values.web.env.appUrl }}
            # Origin công khai (metadataBase — canonical + Open Graph). OMIT khi
            # rỗng: env.ts trả undefined và layout bỏ hẳn metadataBase, thay vì
            # nướng một origin đoán bừa vào mọi thẻ og:image.
            - name: APP_URL
              value: {{ . | quote }}
            {{- end }}
            - name: ORCHESTRATOR_GRPC_ADDR
              # Web (BFF) là caller gRPC DUY NHẤT ở P0 — thiếu biến này thì
              # env.ts default localhost:9090 = web pod tự gọi chính nó.
              value: {{ .Values.web.env.orchestratorGrpcAddr | default (printf "%s-orchestrator:%v" (include "platform.fullname" .) .Values.orchestrator.service.grpcPort) | quote }}
            {{- with .Values.web.env.rateLimitTrustProxy }}
            - name: RATE_LIMIT_TRUST_PROXY
              value: {{ . | quote }}
            {{- end }}
            - name: GOOGLE_CLIENT_ID
              value: {{ .Values.web.env.googleClientId | quote }}
            - name: GOOGLE_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ include "platform.webSecretName" . }}
                  key: GOOGLE_CLIENT_SECRET
            - name: MICROSOFT_CLIENT_ID
              value: {{ .Values.web.env.microsoftClientId | quote }}
            - name: MICROSOFT_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ include "platform.webSecretName" . }}
                  key: MICROSOFT_CLIENT_SECRET
            - name: CORS_ALLOWED_ORIGINS
              value: {{ .Values.web.env.corsAllowedOrigins | quote }}
          # /api/health cố ý không đụng DB (xem contract pin trong brief) — an
          # toàn dùng chung cho cả readiness lẫn liveness.
          readinessProbe:
            httpGet:
              path: /api/health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /api/health
              port: http
            initialDelaySeconds: 15
            periodSeconds: 20
          resources:
            {{- toYaml .Values.web.resources | nindent 12 }}
{{- end }}
