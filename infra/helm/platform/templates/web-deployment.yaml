{{- if .Values.web.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "platform.fullname" . }}-web
  labels:
    {{- include "platform.componentLabels" (dict "context" . "component" "web") | nindent 4 }}
spec:
  replicas: {{ .Values.web.replicaCount }}
  selector:
    matchLabels:
      {{- include "platform.selectorLabels" (dict "context" . "component" "web") | nindent 6 }}
  template:
    metadata:
      {{- if or (not .Values.web.env.existingSecret) (and .Values.datastore.enabled (not .Values.datastore.existingSecret)) (ne .Values.platform.grpcMtlsMode "off") }}
      annotations:
        {{- if ne .Values.platform.grpcMtlsMode "off" }}
        {{- /* Xem giải thích ở gateway-deployment.yaml — cùng lý do. */}}
        checksum/mtls-secret: {{ include (print $.Template.BasePath "/mtls-secret.yaml") . | sha256sum }}
        {{- end }}
        # Đổi giá trị trong Secret KHÔNG tự rollout pod đang chạy (env đọc một
        # lần lúc container start). Checksum làm pod template đổi theo nội dung
        # Secret ⇒ `helm upgrade` xoay pod. Thiếu dòng này thì xoay
        # BETTER_AUTH_SECRET xong pod cũ vẫn ký bằng khoá cũ, và "đã xoay secret"
        # là niềm tin sai.
        {{- if not .Values.web.env.existingSecret }}
        checksum/web-secret: {{ include (print $.Template.BasePath "/web-secret.yaml") . | sha256sum }}
        {{- end }}
        {{- if and .Values.datastore.enabled (not .Values.datastore.existingSecret) }}
        # Cùng lý do, cho DATABASE_URL/REDIS_URL: xoay mật khẩu Postgres mà web
        # không rollout thì pod cũ giữ URL cũ và mọi truy vấn đỏ 28P01 — trong
        # khi `helm upgrade` báo thành công.
        checksum/datastore-secret: {{ include (print $.Template.BasePath "/datastore-secret.yaml") . | sha256sum }}
        {{- end }}
      {{- end }}
      labels:
        {{- include "platform.selectorLabels" (dict "context" . "component" "web") | nindent 8 }}
    spec:
      {{- include "platform.mtlsPodSecurityContext" . | nindent 6 }}
      serviceAccountName: {{ include "platform.fullname" . }}-web
      # web đứng trước internet, chỉ gọi orchestrator qua gRPC — không có lý
      # do gì cầm token API server. Lặp lại false ở đây dù ServiceAccount
      # (templates/rbac.yaml) đã set — 2 lớp phòng thủ.
      automountServiceAccountToken: false
      {{- if .Values.platform.priorityClassEnabled }}
      priorityClassName: {{ .Values.platform.priorityClassName }}
      {{- end }}
      {{- with .Values.web.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.web.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: web
          image: '{{ .Values.image.registry }}/{{ .Values.web.image.repository }}:{{ .Values.web.image.tag | default .Values.image.tag }}'
          imagePullPolicy: {{ .Values.web.image.pullPolicy | default .Values.global.imagePullPolicy }}
          ports:
            - name: http
              containerPort: {{ .Values.web.service.port }}
          env:
            # DATABASE_URL/REDIS_URL: OMIT khi rỗng thay vì set chuỗi rỗng —
            # env.ts coi '' y như thiếu (throw). /api/health cố ý không đụng DB
            # nên probe vẫn phản ánh đúng "process sống".
            #
            # Từ P1 (1.B0.2), datastore in-cluster cấp hai URL này qua Secret.
            # Web BẮT BUỘC phải có DATABASE_URL kể từ đây, không chỉ vì các route
            # đụng DB: Better Auth lưu khoá ký JWKS trong bảng `jwks`, nên không
            # có DB thì `/api/auth/jwks` không trả được khoá nào — mà đó chính là
            # thứ terminal-gateway verify sandbox token qua đó (phase-1 D15).
            {{- if and .Values.datastore.enabled .Values.datastore.postgres.enabled (not .Values.web.env.databaseUrl) }}
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: {{ include "platform.datastoreSecretName" . }}
                  key: DATABASE_URL
            {{- else }}
            {{- with .Values.web.env.databaseUrl }}
            - name: DATABASE_URL
              value: {{ . | quote }}
            {{- end }}
            {{- end }}
            {{- if and .Values.datastore.enabled .Values.datastore.redis.enabled (not .Values.web.env.redisUrl) }}
            - name: REDIS_URL
              valueFrom:
                secretKeyRef:
                  name: {{ include "platform.datastoreSecretName" . }}
                  key: REDIS_URL
            {{- else }}
            {{- with .Values.web.env.redisUrl }}
            - name: REDIS_URL
              value: {{ . | quote }}
            {{- end }}
            {{- end }}
            # 3 credential dưới đây đi qua secretKeyRef, KHÔNG phải env.value:
            # `kubectl get deploy -o yaml` là quyền đọc phổ thông, và secret ký
            # session/JWT lộ ra đó nghĩa là giả mạo được session mọi user. Xem
            # templates/web-secret.yaml.
            - name: BETTER_AUTH_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ include "platform.webSecretName" . }}
                  key: BETTER_AUTH_SECRET
            - name: BETTER_AUTH_URL
              value: {{ .Values.web.env.betterAuthUrl | quote }}
            {{- with .Values.web.env.appUrl }}
            # Origin công khai (metadataBase — canonical + Open Graph). OMIT khi
            # rỗng: env.ts trả undefined và layout bỏ hẳn metadataBase, thay vì
            # nướng một origin đoán bừa vào mọi thẻ og:image.
            - name: APP_URL
              value: {{ . | quote }}
            {{- end }}
            - name: ORCHESTRATOR_GRPC_ADDR
              # Web (BFF) là caller gRPC DUY NHẤT ở P0 — thiếu biến này thì
              # env.ts default localhost:9090 = web pod tự gọi chính nó.
              value: {{ .Values.web.env.orchestratorGrpcAddr | default (printf "%s-orchestrator:%v" (include "platform.fullname" .) .Values.orchestrator.service.grpcPort) | quote }}
            - name: GATEWAY_INTERNAL_URL
              # Đường BFF → gateway cho `lessons.checkStep` (P2 / 2.C). Là Service
              # in-cluster, KHÔNG phải origin công khai: trình duyệt đi qua reverse
              # proxy gộp origin (D1), BFF thì gọi thẳng. Thiếu biến này thì env.ts
              # default localhost:8082 = web pod tự gọi chính nó và mọi lượt "Check"
              # trả ECONNREFUSED.
              value: {{ .Values.web.env.gatewayInternalUrl | default (printf "http://%s-gateway:%v" (include "platform.fullname" .) .Values.gateway.service.publicPort) | quote }}
            - name: SCENARIOS_DIR
              # Nội dung bài học nướng sẵn trong image (apps/web/Dockerfile COPY
              # content). Đường TUYỆT ĐỐI vì cwd runtime là /repo, khác cwd của
              # `next dev` mà default trong env.ts tính theo.
              value: {{ .Values.web.env.scenariosDir | quote }}
            - name: ORCHESTRATOR_METRICS_URL
              # `admin.health` (P13 C4). Rỗng = template tự suy DNS in-cluster —
              # cổng HTTP orchestrator (8081) ĐÃ lên Service. Xem comment đầy đủ
              # (kể cả cảnh báo NetworkPolicy khối 9 chặn chiều này khi
              # networkPolicy.platform.enabled=true) tại values.yaml §
              # web.env.orchestratorMetricsUrl.
              value: {{ .Values.web.env.orchestratorMetricsUrl | default (printf "http://%s-orchestrator:%v/metrics" (include "platform.fullname" .) .Values.orchestrator.service.httpPort) | quote }}
            {{- /*
              GATEWAY_METRICS_URL — nhánh "tự ghép DNS" CÓ ĐIỀU KIỆN, khác mọi
              field khác trong file này.

              Tên `<release>-gateway:8083` chỉ TỒN TẠI khi cổng admin lên Service,
              và điều đó do `platform.gatewayAdminOnService` quyết định (_helpers.tpl):
              mặc định `exposeAdminPort: auto` ⇒ theo `networkPolicy.platform.enabled`.
              Suy ra URL vô điều kiện là hứa một tên DNS có thể không tồn tại.

              Ba nhánh, và cả ba đều là trạng thái hợp lệ:
                · cổng admin lên Service, không đặt tay → tự ghép DNS in-cluster
                · đặt tay (bất kể vị từ trên)           → dùng đúng giá trị đó
                    (dành cho nguồn NGOÀI Service của chart: sidecar, proxy, cụm khác;
                     nếu đích nằm TRONG cụm này thì vẫn cần netpol khối 12b, nếu không
                     chiều mạng đóng và `admin.health` báo `reached:false`)
                · không nhánh nào                       → OMIT hẳn biến
                    ⇒ `resolveUrl` trả null ⇒ nguồn gateway `reached:false, ok:false,
                      error:"chưa cấu hình URL"`. Một trạng thái NÓI RA, không phải
                      một dấu xanh cho thứ chưa ai đo, và KHÔNG giết cả admin.health
                      (health.ts bọc `requireEnv`).
            */}}
            {{- $gatewayMetricsUrl := .Values.web.env.gatewayMetricsUrl }}
            {{- if and (not $gatewayMetricsUrl) (include "platform.gatewayAdminOnService" .) }}
            {{- $gatewayMetricsUrl = printf "http://%s-gateway:%s/metrics" (include "platform.fullname" .) (include "platform.gatewayAdminContainerPort" .) }}
            {{- end }}
            {{- with $gatewayMetricsUrl }}
            - name: GATEWAY_METRICS_URL
              value: {{ . | quote }}
            {{- end }}
            {{- include "platform.mtlsEnv" (dict "context" . "cert" "web") | nindent 12 }}
            {{- if ne .Values.platform.grpcMtlsMode "off" }}
            - name: GRPC_TLS_SERVER_NAME
              value: {{ printf "%s-orchestrator" (include "platform.fullname" .) | quote }}
            {{- end }}
            {{- if eq (.Values.web.env.rateLimitTrustProxy | toString) "1" }}
            {{- /*
              ⛔ CỔNG CHẶN CỨNG (P3 / 3.A), HAI VẾ. Tin `x-forwarded-for` chỉ đúng
              khi (a) có proxy đứng trước GHI ĐÈ header đó, VÀ (b) KHÔNG còn đường
              nào khác vào web. Thiếu vế (b) thì vế (a) vô nghĩa: kẻ tấn công chỉ
              cần đi vòng qua proxy.

              `eq … "1"` chứ KHÔNG phải `with`: `with` coi mọi chuỗi khác rỗng là
              đúng, nên `rateLimitTrustProxy: '0'` — một lệnh TẮT tường minh, và
              env.ts đọc đúng là tắt — vẫn lọt vào đây và kích `fail`.
            */}}
            {{- if not $.Values.ingress.enabled }}
            {{- fail "web.env.rateLimitTrustProxy=1 nhưng ingress.enabled=false — không có proxy nào đứng trước web, nên `x-forwarded-for` là header client TỰ ĐẶT ĐƯỢC và trần rate-limit theo IP trở thành vô nghĩa (xoay XFF mỗi request = mỗi request một bucket). Hoặc bật ingress, hoặc bỏ cờ này. Nếu bạn dùng một proxy NGOÀI chart, hãy tự khẳng định nó ghi đè XFF rồi đặt ingress.enabled=true." }}
            {{- end }}
            {{- if ne $.Values.web.service.type "ClusterIP" }}
            {{- fail "web.env.rateLimitTrustProxy=1 nhưng web.service.type KHÔNG phải ClusterIP — Service kiểu NodePort/LoadBalancer là một CỬA THỨ HAI vào web không đi qua ingress, và trên đường đó không ai ghi đè `x-forwarded-for`. Hậu quả đo được trên cụm 2026-08-14: (1) né sạch trần theo IP lẫn trần body ở biên; (2) KHOÁ NGƯỜI KHÁC — bắn 130 request vào NodePort kèm XFF của nạn nhân thì nạn nhân nhận 429 trên đường HỢP LỆ qua ingress, vì `buckets` là Map toàn cục của process. Đặt web.service.type=ClusterIP (chẩn đoán bằng `kubectl port-forward`), hoặc bỏ cờ trust-proxy." }}
            {{- end }}
            - name: RATE_LIMIT_TRUST_PROXY
              value: {{ .Values.web.env.rateLimitTrustProxy | quote }}
            {{- else }}
            {{- with .Values.web.env.rateLimitTrustProxy }}
            - name: RATE_LIMIT_TRUST_PROXY
              value: {{ . | quote }}
            {{- end }}
            {{- end }}
            - name: GOOGLE_CLIENT_ID
              value: {{ .Values.web.env.googleClientId | quote }}
            - name: GOOGLE_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ include "platform.webSecretName" . }}
                  key: GOOGLE_CLIENT_SECRET
            - name: MICROSOFT_CLIENT_ID
              value: {{ .Values.web.env.microsoftClientId | quote }}
            - name: MICROSOFT_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ include "platform.webSecretName" . }}
                  key: MICROSOFT_CLIENT_SECRET
            - name: CORS_ALLOWED_ORIGINS
              value: {{ .Values.web.env.corsAllowedOrigins | quote }}
          # /api/health cố ý không đụng DB (xem contract pin trong brief) — an
          # toàn dùng chung cho cả readiness lẫn liveness.
          readinessProbe:
            httpGet:
              path: /api/health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
            # ⚠ `timeoutSeconds` mặc định của Kubernetes là 1 GIÂY, và một giây
            # là quá chặt cho một ứng dụng SSR Node bị giới hạn 250m CPU trên
            # một node chạy CẢ control-plane LẪN cụm quan sát.
            #
            # Đo được 2026-09-09: node ở load average 82 (12 vCPU, 1.4% idle,
            # riêng prometheus+loki+promtail+grafana+node_exporter đã ~140% CPU),
            # `/api/health` quá 1s, readiness đỏ, rồi liveness giết container —
            # trong khi `next-server` chỉ dùng 12.5% CPU và ứng dụng hoàn toàn
            # khoẻ. Triệu chứng phía người dùng là 502 Bad Gateway từ Traefik,
            # tức nó đọc ra như "web hỏng" chứ không đọc ra như "node hết CPU".
            #
            # 5 giây vẫn phát hiện được một tiến trình CHẾT (nó từ chối kết nối
            # ngay, không đợi hết giờ) — thứ nới ra là dung sai với một node
            # đang bận, không phải dung sai với một app hỏng.
            timeoutSeconds: 5
          livenessProbe:
            httpGet:
              path: /api/health
              port: http
            initialDelaySeconds: 15
            periodSeconds: 20
            timeoutSeconds: 5
            # Giết một container vì ba lần chậm liên tiếp là quá vội khi node có
            # thể bận vài chục giây liền; readiness đã gỡ pod khỏi Service trong
            # lúc đó nên không ai bị phục vụ bởi một pod đang ngộp.
            failureThreshold: 6
          resources:
            {{- toYaml .Values.web.resources | nindent 12 }}
          {{- if ne .Values.platform.grpcMtlsMode "off" }}
          volumeMounts:
            {{- include "platform.mtlsVolumeMount" . | nindent 12 }}
          {{- end }}
      {{- if ne .Values.platform.grpcMtlsMode "off" }}
      volumes:
        {{- include "platform.mtlsVolume" (dict "context" . "cert" "web") | nindent 8 }}
      {{- end }}
{{- end }}
