{{- if and .Values.datastore.enabled (not .Values.datastore.existingSecret) }}
{{/*
Secret cho Postgres + Redis in-cluster.

VÌ SAO CẢ URL ĐẦY ĐỦ NẰM TRONG SECRET, KHÔNG PHẢI env.value ghép ở Deployment:
DATABASE_URL và REDIS_URL CHỨA MẬT KHẨU. `kubectl get deploy -o yaml` là quyền
gần như mọi role đọc-được-cluster đều có, và Redis là SSOT ánh xạ session→pod —
đọc được mật khẩu Redis nghĩa là ghi đè được `session:{id}:pod`, tức là nối user
A vào shell của user B (phase-1 luật 10). Nên URL được ghép Ở ĐÂY, một lần, và
tới pod qua secretKeyRef.

VẪN CÒN GIỚI HẠN, nói thẳng — giống hệt web-secret.yaml: Secret của k8s là
base64 chứ không phải mã hoá, và `--set` làm giá trị hiện trong `helm get
values`. Đường prod là `datastore.existingSecret` trỏ tới Secret tạo ngoài băng
(hoặc bỏ hẳn datastore in-cluster mà dùng managed DB).
*/}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "platform.fullname" . }}-datastore
  labels:
    {{- include "platform.componentLabels" (dict "context" . "component" "datastore") | nindent 4 }}
type: Opaque
stringData:
  {{/*
  Mỗi component được gate RIÊNG bởi cờ con của nó. Bản trước `required` cả hai
  mật khẩu bất kể `postgres.enabled`/`redis.enabled`, nên cấu hình hợp lệ "managed
  Postgres + Redis in-cluster" (postgres.enabled=false) làm `helm upgrade` fail
  vì đòi mật khẩu cho một component đã tắt — và nếu người vận hành chữa bằng một
  mật khẩu rác thì Secret vẫn cấp DATABASE_URL trỏ tới Service không tồn tại.
  */}}
  {{- if .Values.datastore.postgres.enabled }}
  {{- $pgPass := required "datastore.postgres.password là bắt buộc khi datastore.postgres.enabled — truyền qua --set datastore.postgres.password=<random>, hoặc dùng datastore.existingSecret; KHÔNG commit vào values" .Values.datastore.postgres.password }}
  {{- $pgHost := printf "%s-postgres" (include "platform.fullname" .) }}
  POSTGRES_PASSWORD: {{ $pgPass | quote }}
  {{/*
  urlquery trên mật khẩu, không phải nối chuỗi trần: mật khẩu sinh bằng
  `openssl rand -base64 32` chứa `+` và `/`, và một `@` hay `:` lọt vào sẽ cắt
  URL ở sai chỗ — lúc đó client nối tới một host khác với một lỗi khó hiểu thay
  vì báo sai mật khẩu. (urlquery mã hoá dấu cách thành `+`, mà `+` trong userinfo
  là ký tự `+` thật — nên đừng dùng mật khẩu có dấu cách; cách sinh được document
  (`openssl rand -hex`) không tạo ra dấu cách.)
  */}}
  DATABASE_URL: {{ printf "postgresql://%s:%s@%s:5432/%s?sslmode=disable" .Values.datastore.postgres.user (urlquery $pgPass) $pgHost .Values.datastore.postgres.database | quote }}
  {{- end }}
  {{- if .Values.datastore.redis.enabled }}
  {{- $redisPass := required "datastore.redis.password là bắt buộc khi datastore.redis.enabled — truyền qua --set datastore.redis.password=<random>, hoặc dùng datastore.existingSecret" .Values.datastore.redis.password }}
  {{- $redisHost := printf "%s-redis" (include "platform.fullname" .) }}
  REDIS_PASSWORD: {{ $redisPass | quote }}
  {{/* `/0` tường minh: reaper subscribe `__keyevent@0__:expired`, và để URL khớp
  đúng chuỗi trong bộ verify command của phase-1. Cùng kết quả với dạng không có
  `/0` (db mặc định là 0), nhưng lệch âm thầm giữa hai tài liệu chính là thứ
  1.B0.3 tồn tại để chặn. */}}
  REDIS_URL: {{ printf "redis://:%s@%s:6379/0" (urlquery $redisPass) $redisHost | quote }}
  {{- end }}
{{- end }}
