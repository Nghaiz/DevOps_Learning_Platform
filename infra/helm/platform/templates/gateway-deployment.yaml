{{- if .Values.gateway.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "platform.fullname" . }}-gateway
  labels:
    {{- include "platform.componentLabels" (dict "context" . "component" "gateway") | nindent 4 }}
spec:
  replicas: {{ .Values.gateway.replicaCount }}
  selector:
    matchLabels:
      {{- include "platform.selectorLabels" (dict "context" . "component" "gateway") | nindent 6 }}
  template:
    metadata:
      {{- if ne .Values.platform.grpcMtlsMode "off" }}
      annotations:
        {{- /*
        CA đổi mà pod không cuốn = pod giữ cert do CA CŨ ký, còn server tin CA
        MỚI ⇒ bắt tay hỏng vĩnh viễn, và `helm upgrade` vẫn báo thành công.

        ⚠ CHECKSUM NÀY KHÔNG "ĐỨNG YÊN" NHƯ BẢN NHÁP VIẾT. Đo được 2026-08-12:
        một lần `helm template` sinh BA giá trị KHÁC NHAU cho ba deployment, vì
        mỗi `include` render lại `genCA` với randomness mới. Hệ quả thật: lần
        `helm upgrade` ĐẦU TIÊN sau install luôn cuốn cả ba pod dù cert không
        đổi (từ lần đó trở đi `lookup` có giá trị nên nó ổn định). Vô hại — cùng
        một CA — nhưng đừng dùng "checksum không đổi" làm căn cứ chẩn đoán.
        */}}
        checksum/mtls-secret: {{ include (print $.Template.BasePath "/mtls-secret.yaml") . | sha256sum }}
      {{- end }}
      labels:
        {{- include "platform.selectorLabels" (dict "context" . "component" "gateway") | nindent 8 }}
    spec:
      {{- include "platform.mtlsPodSecurityContext" . | nindent 6 }}
      serviceAccountName: {{ include "platform.fullname" . }}-gateway
      {{- if .Values.platform.priorityClassEnabled }}
      priorityClassName: {{ .Values.platform.priorityClassName }}
      {{- end }}
      {{- with .Values.gateway.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.gateway.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: gateway
          image: '{{ .Values.image.registry }}/{{ .Values.gateway.image.repository }}:{{ .Values.gateway.image.tag | default .Values.image.tag }}'
          imagePullPolicy: {{ .Values.gateway.image.pullPolicy | default .Values.global.imagePullPolicy }}
          ports:
            - name: public
              containerPort: 8082
            - name: admin
              containerPort: 8083
          env:
            - name: PUBLIC_ADDR
              value: {{ .Values.gateway.env.publicAddr | quote }}
            - name: ADMIN_ADDR
              value: {{ .Values.gateway.env.adminAddr | quote }}
            - name: LOG_LEVEL
              value: {{ .Values.gateway.env.logLevel | quote }}
            - name: SHUTDOWN_GRACE
              value: {{ .Values.gateway.env.shutdownGrace | quote }}
            - name: ORCHESTRATOR_GRPC_ADDR
              value: {{ .Values.gateway.env.orchestratorGrpcAddr | default (printf "%s-orchestrator:%v" (include "platform.fullname" .) .Values.orchestrator.service.grpcPort) | quote }}
            {{- include "platform.mtlsEnv" (dict "context" . "cert" "gateway") | nindent 12 }}
            {{- if ne .Values.platform.grpcMtlsMode "off" }}
            {{/*
            Tên trên cert server, KHÔNG cắt ra từ ORCHESTRATOR_GRPC_ADDR ở trên.
            Hai giá trị trùng nhau hôm nay nhưng không buộc phải trùng: ngày ai
            đó trỏ gateway qua port-forward hay một Service mesh, địa chỉ dial
            đổi mà tên trên cert thì không — và lỗi khi đó là "bad certificate"
            trỏ về TLS, không trỏ về chỗ đã suy hộ.
            */}}
            - name: GRPC_TLS_SERVER_NAME
              value: {{ printf "%s-orchestrator" (include "platform.fullname" .) | quote }}
            {{- end }}
            # Endpoint JWKS của Better Auth. KHÔNG phải secret — nó phơi khoá
            # CÔNG KHAI, nên env.value là đúng chỗ, không phải secretKeyRef.
            # 404 ở URL này nghĩa là plugin jwt() chưa mount và mọi verify token
            # của gateway đều vô nghĩa (phase-1 1.B0.5).
            - name: GATEWAY_JWKS_URL
              value: {{ .Values.gateway.env.jwksUrl | default (printf "http://%s-web:%v/api/auth/jwks" (include "platform.fullname" .) .Values.web.service.port) | quote }}
            {{/*
            `iss` của sandbox token. Rỗng ⇒ lấy ĐÚNG web.env.betterAuthUrl —
            KHÔNG suy ra từ jwksUrl ở trên: cái đó là DNS in-cluster, còn `iss`
            là URL công khai trình duyệt thấy. Hai chuỗi khác nhau về bản chất,
            và ghép nhầm thì gateway 401 toàn bộ ở prod trong khi dev xanh.
            */}}
            - name: GATEWAY_TOKEN_ISSUER
              value: {{ .Values.gateway.env.tokenIssuer | default .Values.web.env.betterAuthUrl | quote }}
            {{/*
            Allowlist Origin — lớp DUY NHẤT đóng CSWSH (handshake WS không chịu
            CORS). Rỗng ⇒ appUrl, rơi về betterAuthUrl khi appUrl trống: cookie
            dlp_sandbox là SameSite=Strict + host-only, nên gateway BUỘC phải
            cùng origin với web và hai giá trị này vốn bằng nhau.
            */}}
            - name: GATEWAY_ALLOWED_ORIGINS
              value: {{ .Values.gateway.env.allowedOrigins | default .Values.web.env.appUrl | default .Values.web.env.betterAuthUrl | quote }}
            - name: GATEWAY_MAX_WS_PER_SESSION
              value: {{ .Values.gateway.env.maxWsPerSession | quote }}
            {{/*
            Lệnh exec là HẰNG SỐ PHÍA SERVER (contract §3c) — client không bao
            giờ chọn được nó. `required` ở đây là đúng chỗ, khác hẳn REDIS_URL ở
            dưới: values.yaml LUÔN có giá trị mặc định cho nó, nên nhánh này chỉ
            đỏ khi ai đó cố tình xoá trắng — và một chuỗi rỗng nghĩa là exec chạy
            CMD của image (`sleep infinity`) rồi terminal treo câm.
            */}}
            - name: GATEWAY_EXEC_COMMAND
              value: {{ required "gateway.env.execCommand không được rỗng — exec sẽ chạy CMD của image (sleep infinity) và terminal treo câm" .Values.gateway.env.execCommand | quote }}
            {{/*
            Exec ONE-SHOT (P2 / 2.C) — nút "Check" của Lessons. Ba biến RIÊNG,
            không dùng lại execCommand: attach vào tmux của người học để chấm sẽ
            gõ lệnh giữa màn hình họ đang làm bài và trả exit code của tmux.
            Cùng lý lẽ `required` với execCommand: values.yaml luôn có default,
            nên nhánh này chỉ đỏ khi ai đó cố tình xoá trắng.
            */}}
            - name: GATEWAY_EXEC_SHELL
              value: {{ required "gateway.env.execShell không được rỗng — script chấm sẽ không được đọc và mọi lượt Check treo tới khi hết hạn" .Values.gateway.env.execShell | quote }}
            - name: GATEWAY_EXEC_TIMEOUT
              value: {{ .Values.gateway.env.execTimeout | quote }}
            - name: GATEWAY_EXEC_MAX_OUTPUT
              value: {{ .Values.gateway.env.execMaxOutput | quote }}
            {{/*
            Gateway ĐỌC hash session:{id} cho authz per-session (phase-1 D2).
            secretKeyRef chứ không phải env.value: REDIS_URL CHỨA MẬT KHẨU, và
            `kubectl get deploy -o yaml` là quyền gần như mọi role đọc-được-cluster
            đều có. Đọc được mật khẩu Redis nghĩa là ghi đè được session:{id} —
            tức nối user A vào shell của user B, đúng thứ luật 10 tồn tại để chặn.
            Cùng khuôn CHÍNH XÁC với orchestrator-deployment.yaml.

            ⛔ CỐ Ý KHÔNG DÙNG `required` Ở NHÁNH else, dù gateway BẮT BUỘC có
            biến này. Bản đầu của 1.C-1 có, và nó làm cổng infra đỏ: `values.yaml`
            và `values-cloud.yaml` để `datastore.enabled: false` (bản
            "cloud-shaped" — managed DB thắng một pod tự dựng), nên `helm template`
            trên hai bộ values đó ABORT ngay cả khi người vận hành hoàn toàn định
            điền `gateway.env.redisUrl` lúc deploy thật.

            Cổng thật nằm ở Go (`internal/config`: REDIS_URL không có default,
            service từ chối khởi động), có test + kiểm đột biến. Đặt cổng thứ hai
            ở tầng template không thêm an toàn nào — nó chỉ đổi "pod CrashLoop với
            thông báo rõ" thành "không render nổi manifest", và làm chart lệch khỏi
            chính khuôn orchestrator đang dùng cho cùng một biến.
            */}}
            {{- if and .Values.datastore.enabled .Values.datastore.redis.enabled (not .Values.gateway.env.redisUrl) }}
            - name: REDIS_URL
              valueFrom:
                secretKeyRef:
                  name: {{ include "platform.datastoreSecretName" . }}
                  key: REDIS_URL
            {{- else }}
            - name: REDIS_URL
              value: {{ .Values.gateway.env.redisUrl | quote }}
            {{- end }}
          # Probe nhắm PORT ADMIN (8083, /healthz + /metrics) — KHÔNG phải port
          # public (8082, chỉ có /ws/session/{id}). kubelet gọi thẳng pod IP nên
          # không cần admin lên Service để probe hoạt động.
          readinessProbe:
            httpGet:
              path: /healthz
              port: admin
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /healthz
              port: admin
            initialDelaySeconds: 15
            periodSeconds: 20
          resources:
            {{- toYaml .Values.gateway.resources | nindent 12 }}
          {{- if ne .Values.platform.grpcMtlsMode "off" }}
          volumeMounts:
            {{- include "platform.mtlsVolumeMount" . | nindent 12 }}
          {{- end }}
      {{- if ne .Values.platform.grpcMtlsMode "off" }}
      volumes:
        {{- include "platform.mtlsVolume" (dict "context" . "cert" "gateway") | nindent 8 }}
      {{- end }}
{{- end }}
