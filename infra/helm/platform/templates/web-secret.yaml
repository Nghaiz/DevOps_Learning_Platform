{{- if and .Values.web.enabled (not .Values.web.env.existingSecret) }}
{{/*
Secret cho credential của web.

VÌ SAO TỒN TẠI: bản trước nhét BETTER_AUTH_SECRET (và 2 client secret OAuth)
thẳng vào `env.value` của Deployment. Deployment KHÔNG phải resource bí mật —
`kubectl get deploy -o yaml` là quyền mà gần như mọi role đọc-được-cluster đều
có, và secret ký session/JWT đọc được nghĩa là giả mạo được session của bất kỳ
user nào. Secret là resource riêng, RBAC riêng, và không lọt vào `kubectl
describe deploy` hay log của controller.

VẪN CÒN GIỚI HẠN, nói thẳng: Secret của k8s là base64 chứ không phải mã hoá, và
`--set` làm giá trị hiện trong `helm get values`. Đường đi đúng cho prod là
`web.env.existingSecret` trỏ tới Secret tạo ngoài băng — lúc đó chart không bao
giờ chạm vào giá trị thật.
*/}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "platform.fullname" . }}-web
  labels:
    {{- include "platform.componentLabels" (dict "context" . "component" "web") | nindent 4 }}
type: Opaque
stringData:
  # required: KHÔNG có default trong values — secret ký session/JWT mà nằm sẵn
  # trong git là secret đã lộ. Truyền lúc deploy:
  #   --set web.env.betterAuthSecret="$(openssl rand -hex 32)"
  BETTER_AUTH_SECRET: {{ required "web.env.betterAuthSecret là bắt buộc — truyền qua --set web.env.betterAuthSecret=<random>, hoặc dùng web.env.existingSecret; KHÔNG commit vào values" .Values.web.env.betterAuthSecret | quote }}
  # OAuth: giá trị mặc định là 'placeholder' (P0 chưa có client thật). Vẫn để
  # trong Secret chứ không phải env.value — đổi sang client thật ở P1 là đổi
  # giá trị, không phải đổi lại chỗ chứa.
  GOOGLE_CLIENT_SECRET: {{ .Values.web.env.googleClientSecret | quote }}
  MICROSOFT_CLIENT_SECRET: {{ .Values.web.env.microsoftClientSecret | quote }}
{{- end }}
