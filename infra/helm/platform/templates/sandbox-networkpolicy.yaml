{{- if .Values.sandbox.enabled }}
---
# 1. Default-deny toàn bộ ingress + egress trong namespace sandbox (Calico đã
# bật NetworkPolicy enforcement trên cluster đích). Zero-trust: mọi traffic
# khác PHẢI đi qua 1 policy allow riêng bên dưới, không có allow nào ở đây thì
# NetworkPolicy rỗng == deny hết (đúng semantics Kubernetes NetworkPolicy).
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "platform.fullname" . }}-sandbox-default-deny
  namespace: {{ .Values.sandbox.namespace }}
  labels:
    {{- include "platform.componentLabels" (dict "context" . "component" "sandbox-networkpolicy") | nindent 4 }}
spec:
  podSelector: {}
  policyTypes:
    - Ingress
    - Egress
---
# 2. Egress DNS tới CoreDNS (kube-system) — thiếu rule này thì pod sandbox
# không resolve được tên miền nào, kể cả khi allowInternetEgress bật ở dưới.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "platform.fullname" . }}-sandbox-allow-egress-dns
  namespace: {{ .Values.sandbox.namespace }}
  labels:
    {{- include "platform.componentLabels" (dict "context" . "component" "sandbox-networkpolicy") | nindent 4 }}
spec:
  podSelector: {}
  policyTypes:
    - Egress
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              k8s-app: kube-dns
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
---
# 3. Ingress từ gateway (release "{{ .Release.Name }}", namespace
# {{ .Release.Namespace }}) vào pod sandbox. LƯU Ý QUAN TRỌNG: kubectl-style
# pods/exec (dùng cho terminal streaming ở P1, xem RBAC bên dưới) đi qua
# API server → kubelet, KHÔNG đi qua pod network trực tiếp — rule này KHÔNG
# phải điều kiện cần để exec hoạt động hôm nay. Giữ lại có chủ đích cho hướng
# tương lai (gateway nối trực tiếp TCP/WS vào pod sandbox thay vì qua kubelet
# exec-proxy) — đừng xoá nghĩ là dead code, và đừng hiểu nhầm "thiếu rule này
# thì exec hỏng" khi debug.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "platform.fullname" . }}-sandbox-allow-ingress-gateway
  namespace: {{ .Values.sandbox.namespace }}
  labels:
    {{- include "platform.componentLabels" (dict "context" . "component" "sandbox-networkpolicy") | nindent 4 }}
spec:
  podSelector: {}
  policyTypes:
    - Ingress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ .Release.Namespace }}
          podSelector:
            matchLabels:
              {{- include "platform.selectorLabels" (dict "context" . "component" "gateway") | nindent 14 }}
      # Không giới hạn port: chưa có convention cố định cho port pod sandbox
      # (tuỳ bài lab sinh viên chạy gì) — nguồn đã bị khoá chặt đúng vào pod
      # gateway của release này, thu hẹp thêm port không tăng cô lập thật sự.
      #
      # ⚠ 2026-09-04 — TIỀN ĐỀ CỦA ĐOẠN TRÊN ĐÃ ĐỔI. Khi nó được viết, pod
      # sandbox KHÔNG nghe cổng nào; "thu hẹp port không tăng cô lập" đúng vì
      # chẳng có gì để chạm. Từ 6.B, pod biến thể IDE nghe podIP:4000 và Theia
      # ở đó KHÔNG xác thực. Thứ chặn pod-sandbox-này chạm IDE của
      # pod-sandbox-kia là policy default-deny ở mục 1, KHÔNG phải mục này —
      # nên mục 1 từ nay là hạ tầng thiết yếu chứ không phải phòng thủ chiều sâu.
      # Vẫn giữ "không giới hạn port" vì nguồn đã khoá đúng một pod; nhưng đừng
      # đọc đoạn comment cũ như một khẳng định còn nguyên hiệu lực.
{{- if .Values.registryMirror.enabled }}
---
# 3b. Egress sandbox → registry mirror (P3/3.I mắt 1). CHỈ render khi mirror bật.
#
# Đây là DUY NHẤT một chiều được mở thêm cho sandbox, và nó KHÔNG mở internet:
# đích ghim theo POD mirror trong ns `dlp-registry` (NetworkPolicy đánh giá sau
# DNAT nên ghim pod là ghim đúng đích cuối). default-deny giữ nguyên; IMDS,
# apiserver, và mọi host internet ngoài mirror VẪN bị chặn — đó là điều AC-I4
# đo lại luật 10 với đối chứng dương.
#
# ⚠ Rule này một mình KHÔNG đủ để pull chạy: phải có CẢ rule ingress phía mirror
# (registry-mirror-networkpolicy.yaml khối 2). Mở một chiều mà quên chiều kia là
# "kết nối treo tới hết timeout" — đúng lớp lỗi netpol khó lần nhất.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "platform.fullname" . }}-sandbox-allow-egress-mirror
  namespace: {{ .Values.sandbox.namespace }}
  labels:
    {{- include "platform.componentLabels" (dict "context" . "component" "sandbox-networkpolicy") | nindent 4 }}
spec:
  podSelector: {}
  policyTypes:
    - Egress
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ .Values.registryMirror.namespace }}
          podSelector:
            {{- include "platform.netpolComponent" (dict "context" . "component" "registry-mirror") | nindent 12 }}
      ports:
        - protocol: TCP
          port: {{ .Values.registryMirror.service.port }}
{{- end }}
{{- if .Values.sandbox.allowInternetEgress }}
---
# 4. Egress internet CÓ ĐIỀU KIỆN — CHỈ render khi allowInternetEgress=true.
# Nhiều bài lab (kiểu KillerCoda) cần internet thật (vd apt-get) nên P1 nhiều
# khả năng phải bật cờ này. Mặc định TẮT để buộc bật có ý thức, không phải vô
# tình mở toang egress vì quên default-deny.
#
# `except` LUÔN LUÔN phải giữ 169.254.0.0/16 (link-local — trên cloud đây là
# đường IMDS, sinh viên đọc được credential của node/VM nếu không chặn) cộng
# CIDR pod/service/node của chính cluster này — thiếu 3 dải sau sẽ vô tình mở
# lại đường egress "internet" này tới toàn bộ workload/API khác trong cluster.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "platform.fullname" . }}-sandbox-allow-egress-internet
  namespace: {{ .Values.sandbox.namespace }}
  labels:
    {{- include "platform.componentLabels" (dict "context" . "component" "sandbox-networkpolicy") | nindent 4 }}
spec:
  podSelector: {}
  policyTypes:
    - Egress
  egress:
    - to:
        - ipBlock:
            cidr: 0.0.0.0/0
            except:
              {{- toYaml .Values.sandbox.egressExcept | nindent 14 }}
{{- end }}
{{- end }}
