{{- /*
⛔ VỊ TỪ PHẢI GIỐNG HỆT NHÁNH env BÊN DƯỚI.
Bản đầu dùng `.Values.datastore.postgres.enabled` ở đây (mặc định TRUE) nhưng
`.Values.datastore.enabled` ở nhánh env (mặc định FALSE) ⇒ với values MẶC ĐỊNH,
Job được render nhưng rơi vào nhánh else và nhận `DATABASE_URL=""`;
drizzle.config.ts throw, container exit 1, `pre-install` hook fail, `helm install`
ABORT. Trước bản này install mặc định chạy được — đó là một regression, và nó chỉ
lộ ở install MỚI nên rất dễ qua mặt mọi lần thử thông thường.
`hasDatabase` được tính MỘT LẦN và dùng ở cả hai chỗ.
*/}}
{{- $hasDatabase := or (and .Values.datastore.enabled .Values.datastore.postgres.enabled) .Values.web.env.databaseUrl }}
{{- if and .Values.migrate.enabled $hasDatabase }}
{{/*
Job chạy migration Drizzle TRƯỚC khi web/orchestrator khởi động.

VÌ SAO LÀ HOOK `pre-install,pre-upgrade` CHỨ KHÔNG PHẢI initContainer:
- initContainer nằm trên Deployment nên nó chạy MỖI LẦN pod restart, và với
  replicaCount > 1 thì nhiều bản chạy song song trên cùng một database. Drizzle
  có bảng `__drizzle_migrations` nên không hỏng, nhưng đó là may mắn chứ không
  phải thiết kế — và mỗi lần rollout là thêm một cuộc đua không cần thiết.
- Hook chạy ĐÚNG MỘT LẦN cho mỗi lần install/upgrade, và Helm CHỜ nó xong trước
  khi apply phần còn lại. Đó chính là thứ tự ta cần: schema có trước, app sau.

VÌ SAO TỒN TẠI: tới trước bản này migration phải chạy TAY qua `kubectl
port-forward` sau mỗi lần dựng lại DB (§"Còn để ngỏ" của phase-1). Hệ quả đã
được cảnh báo trước: dựng lại cluster ⇒ bảng `jwks` chưa có ⇒ `/api/auth/jwks`
trả 500 ⇒ toàn bộ G2 sập, và không dấu hiệu nào chỉ về nguyên nhân.
*/}}
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ include "platform.fullname" . }}-migrate
  labels:
    {{- include "platform.componentLabels" (dict "context" . "component" "migrate") | nindent 4 }}
  annotations:
    # ⛔ `post-install` chứ KHÔNG phải `pre-install` — SỬA 2026-08-10 SAU KHI ĐO.
    #
    # Bản trước dùng `pre-install,pre-upgrade`. Nó KHÔNG THỂ chạy được ở lần
    # install đầu tiên khi chart tự sở hữu Postgres: hook `pre-install` chạy
    # trước TOÀN BỘ pha apply thường, nên lúc Job khởi động thì
    # `datastore-postgres.yaml` (resource thường) **chưa tồn tại** — không phải
    # "chưa Ready", mà là chưa có Deployment lẫn Service nào. Job treo tới hết
    # `activeDeadlineSeconds`, backoffLimit cháy, `helm install` ABORT.
    #
    # Đo được 2026-08-10 trên cluster thật (`helm install` vào namespace nháp):
    # `kubectl get deploy,svc` → "No resources found" đúng lúc hook đang chạy;
    # cả 3 lượt thử của Job dừng ở "applying migrations…" rồi treo. Chi tiết:
    # plans/reports/2026-08-10-audit-p0-p1.md.
    #
    # Vì sao lỗi này sống sót qua mọi lần deploy: từ trước tới nay chỉ có
    # `helm upgrade` lên một Postgres đã chạy sẵn từ chart đời trước. Đường
    # DUY NHẤT hỏng cũng là đường DUY NHẤT chưa ai đi — và `helm template`
    # không thể phát hiện, vì nó render đúng y hệt trong cả hai ca.
    #
    # `post-install` cho fresh install (Postgres đã apply xong), `pre-upgrade`
    # giữ nguyên cho upgrade (schema phải đi trước code mới). Đánh đổi đã biết:
    # ở lần install ĐẦU TIÊN, web có thể lên trước khi migration xong và trả 500
    # ở route đụng DB (gồm `/api/auth/jwks`) trong vài chục giây. Chấp nhận được
    # vì nó TỰ KHỎI, còn `helm install` abort thì không.
    helm.sh/hook: post-install,pre-upgrade
    # hook-weight CHỈ sắp thứ tự GIỮA CÁC HOOK cùng pha. Giữ 5 để Job vẫn chạy
    # sau `datastore-secret` (weight -5) ở pha `pre-upgrade`.
    helm.sh/hook-weight: '5'
    # before-hook-creation: xoá Job của lần trước trước khi tạo lần này (Job có
    # spec bất biến, không xoá thì upgrade thứ hai lỗi "field is immutable").
    # hook-succeeded: xoá khi xong, để không tích một Job mỗi lần upgrade.
    # CỐ Ý KHÔNG có hook-failed — Job thất bại phải NẰM LẠI để đọc log; xoá nó
    # đi là vứt bỏ đúng thứ cần cho việc chẩn đoán.
    helm.sh/hook-delete-policy: before-hook-creation,hook-succeeded
spec:
  # Migration không tự chữa được bằng cách thử lại vô hạn: lỗi thường là SQL sai
  # hoặc DB không tới được, và cả hai cần người xem. 2 lần thử đủ để vượt qua
  # một ca DB chưa sẵn sàng.
  backoffLimit: 2
  # Trần cứng để `helm upgrade` không treo vô thời hạn khi DB không tới được.
  activeDeadlineSeconds: {{ .Values.migrate.activeDeadlineSeconds }}
  template:
    metadata:
      labels:
        {{- include "platform.selectorLabels" (dict "context" . "component" "migrate") | nindent 8 }}
    spec:
      restartPolicy: Never
      {{- if .Values.platform.priorityClassEnabled }}
      priorityClassName: {{ .Values.platform.priorityClassName }}
      {{- end }}
      # Job này chỉ nói chuyện với Postgres — không có lý do gì cầm token API server.
      automountServiceAccountToken: false
      containers:
        - name: migrate
          image: '{{ .Values.image.registry }}/{{ .Values.migrate.image.repository }}:{{ .Values.migrate.image.tag | default .Values.image.tag }}'
          imagePullPolicy: {{ .Values.migrate.image.pullPolicy | default .Values.global.imagePullPolicy }}
          env:
            {{- /*
            DATABASE_URL chứa mật khẩu ⇒ đến từ Secret, không phải env.value.
            `kubectl get job -o yaml` là quyền phổ thông.
            */}}
            {{- if and .Values.datastore.enabled .Values.datastore.postgres.enabled (not .Values.web.env.databaseUrl) }}
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: {{ include "platform.datastoreSecretName" . }}
                  key: DATABASE_URL
            {{- else }}
            {{- /*
            Đường managed-DB (RDS/Cloud SQL). Giá trị này CHỨA MẬT KHẨU và hiện
            nguyên trong `kubectl get job -o yaml` — đó là hạn chế đã biết của
            nhánh này, giống hệt web/orchestrator deployment. Đường prod nên
            dùng datastore.existingSecret thay vì đặt URL trực tiếp ở values.
            */}}
            - name: DATABASE_URL
              value: {{ .Values.web.env.databaseUrl | quote }}
            {{- end }}
          resources:
            {{- toYaml .Values.migrate.resources | nindent 12 }}
{{- end }}
