# values-selfhost.yaml — cluster kubeadm 1-node trên VM Debian lab (infra/host/).
#
# Dùng:
#   helm upgrade --install platform infra/helm/platform -f infra/helm/platform/values-selfhost.yaml
#
# imagePullPolicy Never: image import thẳng vào containerd trên node bằng
#   ctr -n k8s.io images import <tarball đã docker save>
# — không có registry push/pull ở self-host, kubelet PHẢI thấy image đã có sẵn
# trên node, `Never` là cách duy nhất buộc nó không thử pull.

global:
  imagePullPolicy: Never

# --- tag image, GHIM Ở ĐÂY CÓ CHỦ Ý (3.H, trả nợ 3.C + 3.F) -----------------
#
# Trước chặng này, tag chỉ tồn tại trong các `--set` gõ tay lúc deploy. Hệ quả đo
# được: cụm chạy `dlp-web:3f-quota429` + `dlp-orchestrator:3c3-9e35e97`, và BẤT KỲ
# `helm upgrade` nào quên `--set` sẽ lặng lẽ kéo hai service về tag cũ — với web
# thì lỗi 500 lúc chạm trần quota QUAY LẠI, và không có gì đỏ lên để báo.
#
# ⛔ TAG Ở ĐÂY LÀ HỢP ĐỒNG "PHẢI SIDE-LOAD ĐÚNG TAG NÀY", không phải một gợi ý.
# Cụm dùng `imagePullPolicy: Never` (ghi chú ngay trên): kubelet KHÔNG kéo được
# từ registry, nên image phải có sẵn trên node. `infra/host/11-sideload-images.sh`
# đọc CHÍNH giá trị này làm nguồn sự thật rồi pull→save→scp→ctr import — nên đổi
# tag ở đây là đủ, và chạy script là cách duy nhất giữ hai bên khớp nhau.
#
# Đổi tag khi nào: sau mỗi lần merge vào `main` mà CI đã publish `sha-<short>`.
#
# ⚠ Lịch sử ngắn, giữ lại vì nó giải thích một tag lạ trong git log: ngày
# 2026-08-15 GitHub Actions bị chặn vì billing (mọi job đỏ TRƯỚC khi chạy bước
# nào kể từ `e90ce8f`), nên `sha-94d1670` của lượt 3.I mắt 2 là image XÂY TAY,
# không phải CI publish. Repo được chuyển PUBLIC ngày 2026-08-16 ⇒ Actions chạy
# lại, và tag hiện tại `sha-0941471` là do CI publish như thường lệ. Nếu gặp lại
# ca "CI chết", xây tay ở đúng commit rồi side-load vẫn là đường lùi hợp lệ —
# nhưng phải KHAI ra, vì `sha-` tự nó trông y hệt tag của CI.
image:
  tag: sha-2b79fd3

# ⛔ TAG THEO TỪNG THÀNH PHẦN — SỬA Ở P12/12.A (2026-09-04) SAU MỘT SỰ CỐ THẬT.
#
# `image.tag` ở trên là tag CHUNG, lần cuối đổi ở P5 (`5575e09`, 2026-09-03).
# Nhưng P7 / P9 / P10 sau đó xây và deploy `p7`, `p9`, `p10a` mà KHÔNG cập nhật
# file này — chúng vào cụm bằng đường ngoài helm. Hậu quả đo được hôm nay:
#
#   repo nói (image.tag)        cụm chạy thật        có trên node?
#   ─────────────────────       ──────────────       ─────────────
#   dlp-web:sha-2b79fd3         dlp-web:p10a         KHÔNG
#   dlp-orchestrator:sha-…      dlp-orchestrator:p7  KHÔNG
#   dlp-migrator:sha-2b79fd3    (hook)               KHÔNG (chỉ có :p9)
#   dlp-sandbox-base:sha-…      …:p10a               KHÔNG
#   dlp-terminal-gateway:sha-2b79fd3  ← khớp         có
#
# Cụm này chạy `imagePullPolicy: Never` + side-load (`cluster-image-sideload`),
# nên "tag không có trên node" KHÔNG rơi về pull — nó là `ErrImageNeverPull`.
# Một `helm upgrade` thẳng từ repo sẽ hạ web + orchestrator + mọi pod sandbox
# mới xuống một tag không tồn tại. Điều DUY NHẤT chặn được điều đó hôm nay là
# pre-upgrade hook `platform-migrate` chết trước (`ErrImageNeverPull`,
# `DeadlineExceeded`) và làm `helm upgrade` bỏ dở — tức nền tảng còn sống nhờ
# một Job hỏng, không nhờ một cổng nào cả.
#
# ⚠ Vì sao `helm get values` KHÔNG lộ ra chuyện này: nó in đúng những gì `-f`
# đưa vào (`image.tag: sha-2b79fd3`) — trùng khớp với repo, nên mọi lệnh helm
# đều "xanh". Thứ lệch nằm ở `spec.template…image` của Deployment, chỗ không
# lệnh helm nào so sánh. Cùng lớp bẫy với `helm-accepts-unknown-set-keys`:
# công cụ in lại chính giả định của bạn và điều đó đọc ra như một xác nhận.
#
# Đặt tag TƯỜNG MINH cho từng thành phần ⇒ repo mô tả lại đúng cụm, và lần
# deploy tới không gỡ mất P7/P9/P10. Đổi tag là bước BẮT BUỘC của mọi lượt build
# image mới — cùng commit với image, không phải "sửa sau".
#
# ⛔ CHÚNG NẰM TRONG CÁC KHỐI `web:` / `orchestrator:` / `gateway:` CÓ SẴN Ở
# DƯỚI, KHÔNG phải trong một khối mới ở đây. File này ĐÃ có `web:` hai lần
# (dòng ~70 và ~103) và YAML lấy khối CUỐI — thêm một khối thứ ba ở trên sẽ bị
# nuốt trong im lặng, không lỗi, không cảnh báo. `migrate:` ở ngay dưới là khối
# DUY NHẤT của nó nên đặt được tại chỗ.
migrate:
  image:
    # Bản duy nhất có trên node. Migrator chạy như pre-upgrade hook nên tag sai
    # ở đây làm HỎNG CẢ LƯỢT UPGRADE, không chỉ hỏng một pod.
    tag: p13

# Ingress + TLS KHÔNG đặt ở đây, có chủ ý: `ingress.host`, `corsAllowedOrigins`
# và `betterAuthUrl` đều chứa IP của node, mà IP đó khác nhau ở mỗi máy lab —
# ghim một IP vào file commit trong git là đẻ ra một giá trị sai cho mọi người
# trừ đúng một người. `infra/host/08-tls-entrypoint.sh` đọc IP lúc chạy, sinh
# chứng chỉ khớp, rồi IN RA nguyên văn lệnh `helm upgrade` kèm đủ `--set`.

# LƯU Ý: betterAuthSecret KHÔNG nằm trong file này (file này commit vào git).
# Deploy self-host truyền secret lúc chạy:
#   helm upgrade --install platform infra/helm/platform \
#     -f infra/helm/platform/values-selfhost.yaml \
#     --set web.env.betterAuthSecret="$(openssl rand -hex 32)"

web:
  # Tag tường minh — xem khối "TAG THEO TỪNG THÀNH PHẦN" ở đầu file.
  #
  # p13b (2026-09-07): p13a + hai bản vá a11y tìm được SAU khi deploy p13a —
  # `/author` bọc danh sách vào `TabsContent` (trước đó tablist không có panel
  # nào ⇒ axe critical), và gỡ `outline-none` khỏi `TabsContent` (nó vô hiệu hoá
  # chính dấu focus vừa thêm ở p13a — Tailwind v4 `outline-none` đặt
  # `--tw-outline-style: none`).
  #
  # p13a (2026-09-07): bốn bản vá chỉ ở tầng web — dấu focus cho `TabsContent`,
  # markdown hạ một bậc heading, đường polling của trang soạn bài, và tắt phép dò
  # JIT của Zod. KHÔNG đụng proto nên KHÔNG có ràng buộc "web và orchestrator lên
  # cùng lượt" của §3bis; orchestrator/gateway/migrator giữ nguyên `p13`.
  image:
    tag: p13b
  replicaCount: 1
  # ⛔ `rateLimitTrustProxy` CỐ Ý KHÔNG nằm ở đây — xem web-deployment.yaml.
  # Bản đầu của chặng 3.A đặt nó `'1'` ngay trong hồ sơ này, và đó là một lỗ
  # hổng: các lệnh deploy self-host ghi trong docs/env/05-helm-secrets-deploy.md
  # và infra/helm/README.md dùng ĐÚNG file này mà KHÔNG bật ingress. Ở trạng thái
  # đó không có proxy nào đứng trước web, nên tin `x-forwarded-for` nghĩa là tin
  # một header client tự đặt được — kẻ tấn công xoay giá trị mỗi request là né
  # sạch trần theo IP. Cờ này chỉ được bật ở nơi biên Traefik thật sự được dựng
  # (infra/host/08-tls-entrypoint.sh in ra lệnh kèm nó).
  service:
    # ⛔ ClusterIP, KHÔNG PHẢI NodePort — đổi ở P3/3.A, và lý do cũ ĐÃ HẾT HIỆU LỰC.
    #
    # NodePort có ở đây để "poke thủ công khi chưa có ingress controller (Traefik
    # tới ở P3)". Traefik đã tới, nên tiền đề đó không còn. Giữ NodePort sau khi
    # bật `RATE_LIMIT_TRUST_PROXY=1` là mở một CỬA THỨ HAI vào web KHÔNG đi qua
    # Traefik, tức không có ai ghi đè `x-forwarded-for` trên đường đó.
    #
    # Đo trên cụm 2026-08-14 — hai hậu quả, hậu quả thứ hai nặng hơn:
    #   1. Né trần: xoay XFF mỗi request ⇒ mỗi request một bucket mới. Trần body ở
    #      biên cũng mất, nên lỗ chunked mà AC-A2 vừa bịt lại mở ra trên đường này.
    #   2. KHOÁ NGƯỜI KHÁC: bắn 130 request vào NodePort kèm
    #      `X-Forwarded-For: 192.168.94.1` ⇒ máy Windows (đúng là IP đó) sau đó
    #      nhận 429 trên đường HTTPS HỢP LỆ qua Traefik. `buckets` trong
    #      rate-limit.ts là Map toàn cục của process, nên nó là CÙNG một map phục
    #      vụ lưu lượng thật. Lặp lại vô hạn được.
    #
    # Vector (2) là do chính chặng 3.A tạo ra: trước đó `clientKey()` luôn trả null
    # nên không bucket nào từng tồn tại để mà đầu độc.
    #
    # Cần vào thẳng web để chẩn đoán ⇒ `kubectl port-forward svc/platform-web 3000:3000`
    # (đường của người có quyền cluster), đừng mở lại cổng cho cả LAN.
    type: ClusterIP
  resources:
    requests:
      cpu: 50m
      memory: 128Mi
    limits:
      cpu: 250m
      # 384Mi (không phải 256Mi): Next standalone SSR vài request đồng thời đã
      # chạm 256Mi — OOMKill lặp làm pod flap trên VM 1-node.
      memory: 384Mi

orchestrator:
  # Tag tường minh — xem khối "TAG THEO TỪNG THÀNH PHẦN" ở đầu file.
  #
  # p12fix (2026-09-06): pod sandbox mang `hostAliases` trỏ bốn host Docker Hub
  # về loopback khi cụm có registry-mirror. Vá "docker run treo vì OCI referrers"
  # — xem k8s.hostAliasesDockerHub. Bản này xây TAY ở máy dev rồi side-load, KHÔNG
  # phải CI publish; nói ra vì `p12fix` tự nó không phân biệt được hai đường ấy.
  image:
    tag: p13
  replicaCount: 1
  env:
    # Image pod lab: mặc định của template là `image.registry`+`image.tag`, tức
    # nó SẼ trỏ sang sha-2b79fd3 nếu không ghim ⇒ mọi pod sandbox MỚI chết bằng
    # ErrImageNeverPull trong khi web/gateway vẫn xanh. Ghim khớp bản side-load.
    # p13ide (2026-09-07): CÙNG nội dung `p10a` nhưng build với `INCLUDE_IDE=1`.
    #
    # Ảnh `p10a` build mặc định `INCLUDE_IDE=0`, nên trong pod KHÔNG có
    # `/opt/theia` và không ai nghe cổng 4000. Đo trên cụm: gateway định tuyến
    # `/ide` đúng và đủ ba header an ninh, nhưng upstream trả
    # `connect: connection refused` ⇒ mọi request `/ide` là 503. Tức đường IDE
    # chưa từng phục vụ được gì trên cụm này, và ô AC 6 (layout `ide`) lẫn phép
    # đo CSP cho `/ide` đều bị chặn ở đó chứ không ở mã.
    sandboxImage: ghcr.io/nghaiz/dlp-sandbox-base:p13ide
    # 3 pod ấm, không 1 — đóng nợ của 3.I mắt 3–5 và 2026-08-16-concurrent-build-load.
    #
    # Số đo làm cơ sở (18 người vào cùng lúc, POOL_TARGET=1): 17/18 đi cold path,
    # `claim` 23–45s, phần lớn là CHỜ POD MỚI chứ không phải chờ CPU. Với trần
    # quota 21 pod, giữ 3 pod ấm tốn 3 khe (trần phiên 20 → 18) và ~3×163Mi
    # workingSet lúc rảnh, đổi lấy 3 người đầu của mỗi đợt vào nhận pod <1s và
    # replenish chạy trước khi người thứ 4 tới. Đây là ĐÁNH ĐỔI ĐÃ ĐO ở một điểm
    # (N=18), không phải tối ưu: đo `dlp_claim_total{path="cold"}` /
    # `dlp_claim_total` sau vài buổi học thật rồi mới chỉnh tiếp.
    poolTarget: '3'
    # Trần VẬT LÝ đã ĐO của cụm này — khớp ĐÚNG phép tính ở khối `sandbox.quota`
    # cuối file (P12/12.A, 2026-09-04) và ĐÚNG số `ceiling.js` đo được: giữ 23
    # phiên đồng thời, lượt từ chối đầu tiên ở #24.
    #
    # ⛔ KHÔNG PHẢI con số FE hiện. FE hiện TRẦN MỀM = 23 − poolTarget 3 = 20,
    # và orchestrator TÍNH nó (không có env riêng nữa). Đổi `poolTarget` ở trên
    # thì trần mềm tự đổi theo — đó chính là điểm của bản này: bản trước ghim
    # `capacitySoftLimit: '20'` nên hai vế trôi khỏi nhau trong im lặng, đúng ca
    # `no-derived-fields` mà báo cáo P12 §2.4 ghi lại.
    #
    # Đo lại con số này mỗi lần đổi `sandbox.quota` hoặc `sandbox.limitRange`.
    capacityHardLimit: '23'
  resources:
    requests:
      cpu: 25m
      memory: 32Mi
    limits:
      cpu: 150m
      memory: 128Mi

gateway:
  # Tag tường minh — ghim để lần đổi `image.tag` chung kế tiếp không lặng lẽ kéo
  # gateway theo.
  #
  # p12fix (2026-09-06): trên đường đóng, exit ∈ {137,143} + Redis nói phiên còn
  # sống thì hỏi THÊM apiserver xem pod còn không, rồi mới chọn 1000 hay 4404.
  # Vá cuộc đua "Redis đi sau" của P12 §8 — xem podexec.PodGoneFunc. Xây TAY ở
  # máy dev rồi side-load, KHÔNG phải CI publish.
  #
  # ⛔ TAG NÀY ĐÃ CŨ SO VỚI NHÁNH (P13 S1, 2026-09-06) — ĐỢT 3 PHẢI XÂY LẠI.
  # `internal/ideroute/secheaders.go` thêm ba header an ninh cho MỌI response
  # dưới `/ide` (`nosniff`, `X-Frame-Options: SAMEORIGIN`, `Referrer-Policy`).
  # Binary `p12fix` KHÔNG có chúng, nên deploy chart này với ảnh cũ để nguyên lỗ
  # S1 — và không có gì đỏ lên: lỗ là một header VẮNG MẶT, `rollout status` vẫn
  # xanh, pod vẫn `Running 1/1`.
  #
  # Nghĩa là đợt 3 xây bốn ảnh, không phải ba như §3ter mục 4 liệt kê:
  # `dlp-web:p13`, `dlp-orchestrator:p13`, `dlp-migrator:p13`, và
  # `dlp-terminal-gateway:p13`.
  #
  # KHÁC với cặp web↔orchestrator, ảnh này KHÔNG có ràng buộc thứ tự: nó chỉ
  # thêm header response, không đụng wire-protocol nào — nên nó không nối dài
  # chuỗi "cùng lượt hoặc không lượt nào" của D15, chỉ thêm một bước xây.
  #
  # CỐ Ý KHÔNG ghim sẵn `:p13` ở đây, cùng lý do lane Go không ghim: cổng
  # render-vs-`ctr images ls` của `12-helm-deploy.sh` sẽ (đúng đắn) từ chối một
  # tag chưa có trên node. Bump tag TRONG CÙNG thay đổi với lượt build+side-load.
  image:
  #
  # p13b (2026-09-07): `ideroute` chỉ bỏ cookie `dlp_sandbox` thay vì xoá CẢ header
  # `Cookie`. Bản trước xoá luôn `theia-connection-token` mà Theia tự phát, và
  # Theia từ chối mọi lượt nâng cấp socket thiếu token đó — nên `/ide` dựng được
  # vỏ (200) mà `socket.io` trả 403: IDE không có backend. Không có gì trên cụm
  # phát hiện được: `rollout status` xanh, pod `Running 1/1`, trang gốc 200.
    tag: p13e
  # 2 replica từ chặng 3.H. Gateway stateless đã được KIỂM CHỨNG chứ không chỉ
  # được khẳng định: không map/registry session→conn nào ở package-level hay
  # struct field; đích exec đọc từ Redis mỗi lần connect, và trần WS đồng thời
  # cũng nằm ở Redis — nên một client nối lại trúng replica KHÁC vẫn attach đúng
  # pod cũ (AC-H3).
  #
  # Chi phí trên lab: gateway xin 100m/32Mi mỗi replica, node còn dư nhiều.
  #
  # ⛔ KHÔNG dựng session-affinity ở Traefik, có chủ ý. Affinity không cần cho
  # tính đúng đắn, và nó CHE mọi lỗi cross-replica — ô AC "scale ngang chạy
  # đúng" sẽ xanh kể cả khi hệ không thực sự stateless. Xem plan §H2 quyết định H1.
  replicaCount: 2
  pdb:
    # Bật CÙNG LÚC với replicaCount: 2 — `minAvailable: 1` trên 1 replica chặn
    # `kubectl drain` vĩnh viễn.
    enabled: true
    minAvailable: 1
  resources:
    requests:
      cpu: 100m
      memory: 32Mi
    limits:
      # ⛔ 150m LÀ CON SỐ ĐÃ ĐO LÀ SAI, không phải một mức tiết kiệm hợp lý.
      # 1.G-4 đo trên chính cụm này: ở trần 150m, gateway bị throttle **38.7%
      # số chu kỳ CFS** (110/284) và mất **123ms mỗi lượt attach** — tức ~27%
      # toàn bộ thời gian 101→`ready`. Nhu cầu CPU trung bình đo được chỉ ~106m,
      # nên 150m "trông đủ"; cái giết nó là ĐỘT BIẾN, và quota CFS cắt đột biến
      # theo từng cửa sổ 100ms chứ không theo trung bình.
      #
      # 500m ⇒ throttle còn 0.4% chu kỳ (1.8ms/lượt) và tổng attach giảm
      # 457ms → 412ms. Đo thêm 2000m chỉ được 359ms, nhưng 36ms trong phần
      # chênh đó nằm ở `pty` (sàn hạ tầng, không liên quan CPU gateway) nên
      # không quy được cho trần CPU — vì thế chốt 500m, không chốt 2000m.
      #
      # Triệu chứng khi trần quá thấp KHÔNG phải OOM hay lỗi: nó là "terminal
      # lâu mở", và không log nào nói vì sao. Chỉ `cpu.stat` trên host nói.
      cpu: 500m
      memory: 128Mi

# Postgres + Redis chạy TRONG cluster trên self-host: VM lab không có managed DB,
# và pod orchestrator gọi RequireDataStores() mà không có hai service này là
# CrashLoop ngay (phase-1 1.B0.2 / R10).
#
# Mật khẩu KHÔNG nằm trong file này (file này commit vào git) — truyền lúc deploy:
#   helm upgrade --install platform infra/helm/platform \
#     -f infra/helm/platform/values-selfhost.yaml \
#     --set datastore.postgres.password="$(openssl rand -hex 24)" \
#     --set datastore.redis.password="$(openssl rand -hex 24)"
datastore:
  enabled: true

  # kubeadm KHÔNG cài StorageClass nào — PVC sẽ Pending vĩnh viễn với
  # "no persistent volumes available". local-path-provisioner được cài bởi
  # infra/host/05-cluster-addons.sh. Trỏ TƯỜNG MINH thay vì dựa vào
  # is-default-class: một StorageClass mặc định vô hình là thứ khiến người khác
  # không hiểu volume của mình đang nằm ở đâu.
  storageClassName: local-path

  # ĐÈ global.imagePullPolicy (Never). `Never` đúng cho image CỦA TA (import tay
  # vào containerd), nhưng postgres/redis đến từ Docker Hub và chưa có trên node
  # ⇒ Never sẽ cho ImagePullBackOff vĩnh viễn với thông báo không nói lý do thật.
  imagePullPolicy: IfNotPresent

  postgres:
    storage: 4Gi
    resources:
      requests:
        cpu: 50m
        memory: 128Mi
      limits:
        cpu: 500m
        memory: 512Mi

  redis:
    storage: 1Gi
    # Thấp hơn limits.memory (192Mi) đủ biên cho fork() lúc AOF rewrite.
    maxmemory: 96mb
    resources:
      requests:
        cpu: 25m
        memory: 32Mi
      limits:
        cpu: 250m
        memory: 192Mi

# Quota sandbox của VM lab — ĐẶT LẠI Ở P3/3.I MẮT 5 (2026-08-16) theo số đo
# cgroup của mắt 3, thay cho bộ số cũ dựng trên `requests` thổi phồng.
#
# ── Vì sao trần cũ là 3 phiên, và vì sao nó KHÔNG phải giới hạn phần cứng ────
# Bộ cũ: `requests` 500m/512Mi ⇒ 2100m ÷ 500m = 4 pod, trừ POOL_TARGET=1 ⇒ **3
# phiên**. Con số 512Mi đến từ `memory.current` đỉnh (428–464Mi), mà đại lượng
# ấy GỘP page cache của `docker pull`/`build`. Mắt 3 tách ra: workingSet đỉnh —
# đúng đại lượng kubelet dùng để đuổi pod — chỉ **158–163Mi**. Tức mỗi pod giữ
# chỗ gấp ~3 lần phần nó thật sự không nhả được.
#
# Mắt 2 từng kết luận "trần bị chặn bởi RAM thật, 25 × 451Mi ≈ 11GiB = cả VM".
# Phép đo của mắt 3 BÁC BỎ kết luận đó: 451Mi là con số đã gộp cache; số phải
# nhân lên là 163Mi ⇒ 21 × 163Mi ≈ 3.3GiB, node 11.6GiB thừa sức.
#
# ── ĐẶT LẠI Ở P12/12.A (2026-09-04): bộ cũ tính cho POOL_TARGET=1 ───────────
# Bộ 2026-08-16 ghi "20 phiên đồng thời" và tính bằng `21 pod − POOL_TARGET 1`.
# Nhưng `orchestrator.env.poolTarget` (§ trên, dòng ~106) đã lên **3** từ 5.B.
# Trần hiệu lực do đó là 21 − 3 = **18**, không phải 20 — con số trong chú thích
# đã sai lệch so với hành vi suốt từ lúc pool nới ra. Đây là lớp lỗi mà
# `no-derived-fields` cảnh báo: trần phiên là ĐẠI LƯỢNG SUY RA từ (quota,
# poolTarget); viết nó thành hằng số trong chú thích thì nó mục lặng lẽ khi một
# trong hai vế đổi. Bộ dưới đây tính lại từ ngân sách THẬT của node.
#
# ── Ngân sách node, đo chứ không suy (kubectl, 2026-09-04) ───────────────────
#   allocatable                     = 8000m / 11830Mi
#   requests của MỌI pod ngoài dlp-sandbox (31 pod, 6 namespace)
#                                   = 1880m / 1832Mi
#   ⇒ còn cho sandbox               = 6120m / 9998Mi
#
# Trừ tiếp **250m dự phòng rollout**: `maxSurge: 25%` trên cả 5 Deployment của
# `default` ⇒ một `helm upgrade` toàn phần dựng thêm gateway 100m + web 50m +
# postgres 50m + orchestrator 25m + redis 25m = 250m CÙNG LÚC. Không chừa chỗ
# này thì lần deploy kế tiếp có pod Pending, và triệu chứng ("deploy treo") đọc
# không giống nguyên nhân ("quota sandbox ăn hết ngân sách node").
#   ⇒ ngân sách quota CPU           = 6120 − 250 = 5870m
#
# ── Số dưới đây suy ra từ ngân sách, không phải từ một mục tiêu tròn ─────────
#   P × 250m + canary 100m ≤ 5870m  ⇒ P ≤ 23.08 ⇒ **P = 23 pod**
#   23 pod × 250m  = 5750m, + canary 100m → 5850m   (còn 20m slack)
#   23 pod × 256Mi = 5888Mi, + canary 64Mi → 5952Mi
#   23 pod × 2 (defaultCpu)    = 46, + canary → 48
#   23 pod × 1Gi (defaultMemory) = 23Gi, + canary → 24Gi
# ⇒ min(5850÷250, 5952÷256, 48÷2, 24576÷1024, 28)
#   = min(23.4, 23.25, 24, 24, 28) = **23 pod**
#
# ── HAI TRẦN, KHÔNG PHẢI MỘT — và phép trừ `− POOL_TARGET` là SAI ────────────
# Chú thích cũ (và `values.yaml` dòng ~695) viết
#   "trần session đồng thời = quota_hiệu_lực − POOL_TARGET".
# ĐO ĐƯỢC 2026-09-04 (`ceiling.js`, TARGET qua ingress) thì KHÔNG phải vậy:
#   ##CEILING## giữ 23 session (id phân biệt = 23), từ chối đầu = #24 (quota)
#   refused_quota=1 · refused_other=0 · refused_5xx=0 · quota_reported_as_5xx=0
# Pod warm pool KHÔNG bị mất khỏi ngân sách — chúng được CLAIM và TRỞ THÀNH
# session. Pool chỉ chiếm chỗ khi đang RỖI, không chiếm vĩnh viễn.
#
#   · **Trần cứng = 23 phiên** — số quota thật sự cho vào. ĐO, không suy.
#   · **Trần "pool còn lành" = 20 phiên** — vượt mức này thì quota đã đầy nên
#     orchestrator KHÔNG refill nổi pool; người thứ 21–23 vẫn vào được nhưng đi
#     cold path (chờ tạo pod) thay vì nhận pod ấm. Hệ vẫn phục vụ, chỉ chậm.
#
# Con số dùng cho "còn N chỗ" trên FE (P13) là **20**, không phải 23: 23 là chỗ
# vật lý, 20 là chỗ còn giữ được trải nghiệm. Đừng gộp hai số này làm một.
#
# `pods: 28` = 23 + 5 khe hở: pod Terminating VẪN tính vào quota `pods` hàng
# chục giây sau khi phiên đóng, và namespace này còn CronJob canary. Đặt sát 24
# là mời một cơn từ chối giả đúng lúc đông người.
#
# ── VÌ SAO 40 KHÔNG ĐẠT ĐƯỢC AN TOÀN TRÊN NODE NÀY ──────────────────────────
# Mục tiêu 40 phiên đòi 43 pod (40 + POOL_TARGET 3):
#   43 × 250m + 100m = 10850m  >  5870m ngân sách  ⇒ **thiếu 4980m (85%)**
# Nhét đủ 43 pod đòi hạ `requests.cpu` xuống (5870 − 100) ÷ 43 = **134m/pod**.
# Mức ấy nằm DƯỚI 150m — và 150m là con số ĐÃ ĐO ra tác hại: nó làm mất 123ms
# mỗi lượt attach (`cpu-throttle-looks-like-app-slowness`). Hạ xuống 134m là cố
# ý mua lại một suy thoái đã biết, để đổi lấy một con số trên giấy.
#
# ⚠ RAM KHÔNG phải chỗ chặn, và đây là chỗ phase-12.md đoán khác kết quả đo.
# Ô ⚠ của 12.A lo "hạ requests.memory để nhét 40 pod là cược vào eviction".
# Số thật: 43 × 163Mi (đỉnh workingSet đo được) = 7009Mi < 9998Mi còn trống —
# RAM thừa sức chứa 43 pod. Ràng buộc thật là **CPU**, và nó chặn ở 23.
# ⇒ Kết luận của 12.A: **N=40 không đạt an toàn trên 1 node / 8 vCPU.** Không
#   phải "chưa thử", mà là "đã tính, và cái giá là một suy thoái đã đo được".
#   Nâng trần thật đòi thêm CPU vật lý (node thứ hai), không đòi sửa con số này.
#
# ── Chỗ CỐ Ý overcommit, khai thẳng ─────────────────────────────────────────
# `limitsCpu: 48` và `limitsMemory: 24Gi` đều VƯỢT phần cứng (8 core / 11.6Gi).
# Đó là bản chất của `limits` — nó là TRẦN BURST, không phải chỗ giữ. Phần thật
# sự gác an toàn node là `requests`: 5850m/5952Mi, cộng platform (1880m/1832Mi)
# = 7730m/7784Mi trên 8000m/11830Mi ⇒ **97% CPU, 66% RAM** đã đặt chỗ.
# 97% là CỐ Ý sát trần, và 250m dự phòng rollout ở trên là thứ giữ cho nó an
# toàn. Ván cược RAM: nếu CẢ 23 pod cùng chạm 1Gi anon một lúc thì node hết RAM.
# Đo được thì anon đỉnh chỉ 127Mi/pod (23 × 127Mi ≈ 2.9Gi), nên cược này rộng
# cửa — nhưng nó LÀ một ván cược, và mọi lần nâng trần sau phải đo lại.
sandbox:
  quota:
    pods: '28'
    requestsCpu: '5850m'
    requestsMemory: '5952Mi'
    limitsCpu: '48'
    limitsMemory: '24Gi'

# ─────────────────────────────────────────────────────────────────────────────
# Registry mirror docker.io (P3/3.I mắt 1) — BẬT trên self-host.
#
# Lab tự-host: sandbox KHÔNG có internet (luật 10, 3.B). Không có mirror thì trụ
# cột "học Docker" không có đường chạy (`docker build` chết vì egress chặn).
# Mirror mở egress sandbox CHỈ tới nó — internet công khai/IMDS/apiserver vẫn chặn.
#
# ⚠ Phạm vi CHỈ docker.io (dockerd registry-mirrors chỉ mirror trong suốt Hub).
# Storage/resources kế thừa default ở values.yaml; local-path đã có trên cụm.
registryMirror:
  enabled: true
