# values.yaml — mặc định "cloud-shaped" (replica ≥2, imagePullPolicy IfNotPresent
# vì cloud kéo image từ registry thật). Namespace KHÔNG đặt cứng ở đây — chọn bằng
# `helm -n <namespace> install|upgrade`.
#
# Self-host (VM kubeadm 1-node, infra/host/) đè lại qua values-selfhost.yaml.
# Cloud multi-node đè lại qua values-cloud.yaml (giữ chỗ node-pool, chưa dùng).

global:
  imagePullPolicy: IfNotPresent

image:
  # Tên repo GHCR bắt buộc lowercase.
  registry: ghcr.io/nghaiz
  tag: dev

web:
  enabled: true
  image:
    repository: dlp-web
    tag: '' # rỗng = dùng image.tag ở trên
    pullPolicy: '' # rỗng = dùng global.imagePullPolicy
  replicaCount: 2
  service:
    type: ClusterIP
    port: 3000
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 512Mi
  env:
    # databaseUrl/redisUrl rỗng = template OMIT hẳn biến (env.ts coi chuỗi rỗng
    # y như thiếu — comment cũ nói "đọc rỗng vẫn boot" là SAI). P0 chưa có
    # Postgres/Redis in-cluster: pod Running + /api/health xanh là acceptance
    # của task 27; route đụng DB 500 cho tới P1 — có chủ ý, không phải bug.
    databaseUrl: ''
    redisUrl: ''
    # KHÔNG có default — secret ký session/JWT commit trong git là secret đã lộ.
    # Đi vào một Secret (templates/web-secret.yaml) rồi tới pod qua secretKeyRef,
    # KHÔNG phải env.value trên Deployment. Thiếu là helm install DỪNG (`required`).
    betterAuthSecret: ''
    # Tên một Secret có sẵn mang 3 khoá BETTER_AUTH_SECRET / GOOGLE_CLIENT_SECRET
    # / MICROSOFT_CLIENT_SECRET. Set giá trị này ⇒ chart KHÔNG tạo Secret và
    # KHÔNG đòi betterAuthSecret. Đây là đường prod: giá trị thật không đi qua
    # `--set` nên không nằm lại trong shell history / `helm get values` / log CI.
    existingSecret: ''
    betterAuthUrl: 'http://localhost:3000'
    # Origin công khai của app (metadataBase). Rỗng = biến bị omit hẳn. KHÁC
    # betterAuthUrl về vai trò dù thường trùng giá trị: cái kia là base để dựng
    # callback OAuth + issuer JWT, cái này chỉ là base URL của metadata trang.
    appUrl: ''
    # Rỗng = template tự suy "<release>-orchestrator:<grpcPort>" (DNS in-cluster).
    orchestratorGrpcAddr: ''
    # Đường BFF → terminal-gateway cho `lessons.checkStep` (P2 / 2.C).
    # Rỗng = template tự suy "<release>-gateway:<port>" (DNS in-cluster).
    #
    # ⚠ KHÔNG phải `appUrl`. Trình duyệt tới gateway qua reverse proxy gộp origin
    # (D1); BFF thì gọi thẳng Service. Đặt origin công khai vào đây nghĩa là mỗi
    # lượt bấm "Check" đi ra internet rồi vòng lại, và nó hỏng đúng lúc ingress
    # chưa sẵn sàng — trong khi bản thân cụm vẫn hoàn toàn khoẻ.
    gatewayInternalUrl: ''
    # Thư mục nội dung bài học TRONG image (apps/web/Dockerfile `COPY content`).
    # Tuyệt đối vì cwd runtime là /repo. Chỉ đổi khi mount nội dung từ volume.
    scenariosDir: '/repo/content/scenarios'
    # '1' CHỈ khi web đứng sau proxy set x-forwarded-for đúng (Traefik — P3).
    # Rỗng = biến bị omit, middleware skip rate limit (log 1 lần). Xem
    # apps/web/src/middleware.ts clientKey().
    rateLimitTrustProxy: ''
    googleClientId: 'placeholder'
    googleClientSecret: 'placeholder'
    microsoftClientId: 'placeholder'
    microsoftClientSecret: 'placeholder'
    corsAllowedOrigins: 'http://localhost:3000'

# Job chạy migration Drizzle như hook pre-install/pre-upgrade.
# Xem templates/migrate-job.yaml để biết vì sao là hook chứ không phải initContainer.
migrate:
  enabled: true
  image:
    repository: dlp-migrator
    tag: ''
    pullPolicy: ''
  # Trần cứng để `helm upgrade` không treo vô thời hạn khi Postgres không tới
  # được. 5 phút đủ rộng cho một migration thật, đủ hẹp để lỗi lộ ra nhanh.
  activeDeadlineSeconds: 300
  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      cpu: 500m
      memory: 256Mi

orchestrator:
  enabled: true
  image:
    repository: dlp-orchestrator
    tag: ''
    pullPolicy: ''
  replicaCount: 2
  service:
    type: ClusterIP
    httpPort: 8081
    grpcPort: 9090
  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      cpu: 250m
      memory: 256Mi
  env:
    grpcAddr: ':9090'
    httpAddr: ':8081'
    logLevel: 'info'
    grpcReflection: 'false'
    databaseUrl: ''
    redisUrl: ''
    sessionTtl: '1h'
    shutdownGrace: '15s'
    sandboxNamespace: 'dlp-sandbox'

    # Trần TUYỆT ĐỐI của một session, tính từ created_at, KHÔNG gia hạn được
    # (phase-1 D11). Phải >= sessionTtl, nếu không orchestrator từ chối khởi động.
    hardCap: '2h'

    # Số pod ấm giữ sẵn. ⛔ trần session đồng thời = quota_hiệu_lực − poolTarget
    # (D16). Trên lab quota hiệu lực là 4 pod, nên 3 ở đây phục vụ đúng MỘT user
    # rồi replenish chết vĩnh viễn vì quota.
    poolTarget: '1'

    # Image của pod lab. RỖNG = kế thừa `image.registry` + `image.tag` ở trên
    # (thành `<registry>/dlp-sandbox-base:<tag>`) — cùng khuôn với
    # `sandboxRuntimeClass`, và vì đúng lý do đó: chép `ghcr.io/nghaiz` với `dev`
    # xuống đây là dựng bản sao thứ hai của hai giá trị mà mọi image khác đã lấy
    # từ một chỗ, rồi một ngày đổi tag ở trên mà pod lab vẫn chạy bản cũ.
    #
    # 1.E-1 (2026-08-10) đã thay `registry.k8s.io/pause:3.10` bằng image thật:
    # `pause` chỉ ngủ, không có shell nào để exec vào, nên D3/G4 (tmux) không thể
    # chạy trên nó. Đặt giá trị TƯỜNG MINH ở đây chỉ khi muốn ghim pod lab vào
    # một image khác hẳn — ví dụ quay lại `pause` để đo warm-pool mà không tốn RAM.
    sandboxImage: ''

    # Để RỖNG để kế thừa `sandbox.runtimeClassName` — đó là SSOT. Chỉ đặt giá
    # trị ở đây khi thật sự muốn orchestrator dựng pod với RuntimeClass KHÁC với
    # cái mà ValidatingAdmissionPolicy đang ép, tức là cố tình làm mọi pod bị từ
    # chối. Nhân bản con số này là cách nó trôi đi.
    sandboxRuntimeClass: ''

    # Khoảng đẩy thêm mỗi lần gateway heartbeat (D11).
    # ⚠ Con số này THỰC TẾ quyết định hạn của session sau lần gia hạn đầu tiên,
    # không phải sessionTtl — xem Service.Extend trong internal/lifecycle.
    extendDefault: '300s'

    # Nhịp sweep của reaper. Sweep là ĐƯỜNG CHÍNH (keyspace notification chỉ là
    # đường nhanh, best-effort và mất event khi reaper offline).
    reapInterval: '60s'

    # mTLS của cổng gRPC nay điều khiển bằng MỘT biến dùng chung cho cả ba
    # service: `platform.grpcMtlsMode` ở cuối file. Không còn cờ riêng ở đây —
    # ba giá trị riêng lẻ là ba cơ hội để chúng lệch nhau, và một client chưa
    # cắm cert gặp server đã siết là 100% RPC đỏ.

gateway:
  enabled: true
  image:
    repository: dlp-terminal-gateway
    tag: ''
    pullPolicy: ''
  replicaCount: 2
  service:
    type: ClusterIP
    publicPort: 8082
    # KHÔNG có adminPort ở đây — /healthz + /metrics (8083) cố ý không lên
    # Service: /metrics không có authz, lộ version + số goroutine (đếm được
    # session đang chạy). kubelet probe vẫn chạm được vì probe đánh thẳng pod IP,
    # không qua Service. Xem services/terminal-gateway/internal/config/config.go.
  resources:
    requests:
      cpu: 100m
      memory: 64Mi
    limits:
      # Xem values-selfhost.yaml cho số đo đầy đủ (1.G-4). Tóm tắt: dựng một
      # phiên terminal là công việc ĐỘT BIẾN (bắt tay TLS tới apiserver, dựng
      # stream, bơm byte đầu), còn quota CFS cắt theo từng cửa sổ 100ms — nên
      # trần đặt theo mức trung bình sẽ throttle đúng lúc người dùng đang chờ.
      # Ở 150m đo được 38.7% chu kỳ bị throttle và +123ms mỗi lượt attach; 250m
      # nằm cùng vùng đó. 500m đưa throttle về 0.4%.
      cpu: 500m
      memory: 256Mi
  env:
    publicAddr: ':8082'
    # BẮT BUỘC ":8083" trong k8s — default trong code Go là "127.0.0.1:8083"
    # (chỉ bind loopback), khiến kubelet probe từ ngoài container fail. Đè lại ở
    # đây, không phải ở code, vì đây là khác biệt do MÔI TRƯỜNG chạy (container vs
    # host), không phải default sai. Xem plans/devops-learning-platform/phase-0.md 0.F.
    adminAddr: ':8083'
    logLevel: 'info'
    shutdownGrace: '15s'
    # Rỗng = template tự suy ra "<release>-orchestrator:<grpcPort>" (xem
    # templates/gateway-deployment.yaml). Chưa dùng thật ở P0 — gateway chưa gọi
    # orchestrator (task 22) — nhưng khoá đúng hình dạng DNS trong-cluster từ đây.
    orchestratorGrpcAddr: ''
    # Rỗng = lấy REDIS_URL từ Secret của datastore in-cluster (qua secretKeyRef —
    # URL chứa mật khẩu). Chỉ đặt tường minh khi trỏ Redis NGOÀI cluster, và lúc
    # đó nhớ rằng giá trị này sẽ hiện nguyên văn trong `helm get values`.
    redisUrl: ''
    # JWKS của Better Auth — gateway verify sandbox token bằng khoá công khai lấy
    # từ đây (phase-1 D15, 1.B0.5). KHÔNG có khoá riêng nào của gateway: khoá
    # riêng đẻ ra biến env × 4 nơi, một Helm secret, và một quy trình xoay vòng
    # thủ công. JWKS cho rotation miễn phí.
    #
    # Rỗng = template tự suy ra "<release>-web:<port>/api/auth/jwks" (DNS
    # in-cluster). Chỉ đặt tường minh khi web nằm ngoài cluster này.
    jwksUrl: ''

    # Giá trị `iss` mà sandbox token bắt buộc mang.
    #
    # ⚠ KHÔNG suy ra được từ jwksUrl: jwksUrl là DNS NỘI BỘ
    # (http://<release>-web:3000/...) còn `iss` là URL CÔNG KHAI trình duyệt
    # thấy. Rỗng = template lấy ĐÚNG `web.env.betterAuthUrl` — một giá trị, hai
    # nơi đọc, không có hằng số thứ hai để trôi.
    tokenIssuer: ''

    # Allowlist `Origin` của handshake WS, ngăn cách bằng dấu phẩy. Đây là thứ
    # DUY NHẤT đóng CSWSH (handshake WS không chịu CORS).
    #
    # Rỗng = template lấy `web.env.appUrl` (rơi về `betterAuthUrl` khi trống) —
    # cùng origin với web là ĐIỀU KIỆN SỐNG của cookie dlp_sandbox
    # (SameSite=Strict, host-only), nên hai giá trị này vốn phải bằng nhau.
    allowedOrigins: ''

    # Trần WS ĐỒNG THỜI trên một session (D17). Số ĐO ĐƯỢC trên tmux 3.4: client
    # thứ hai attach làm cửa sổ của client thứ nhất tụt từ 200×50 xuống 80×23 rồi
    # lật qua lại mỗi keystroke. Nâng lên >1 là chấp nhận terminal tự co giãn.
    maxWsPerSession: '1'

    # Lệnh chạy trong pod khi gateway attach (G4). Tách theo khoảng trắng — argv.
    #
    # ⛔ HẰNG SỐ PHÍA SERVER: contract §3c cấm client chọn lệnh, vì đó là cho
    # client chọn thứ chạy trong pod. Đổi giá trị này là đổi thứ MỌI sinh viên
    # nhận được khi mở terminal.
    #
    # `tmux new-session -A -s dlp` (D3) chứ không phải `bash`: pods/exec mỗi lần
    # attach sinh tiến trình MỚI, nên không có tmux thì "mất mạng rồi vào lại" là
    # một shell trắng, không phải phiên cũ. Image sandbox-base đã cài sẵn tmux 3.4
    # và tắt status bar (E4) để stty size khớp chính xác cols/rows FE gửi.
    execCommand: 'tmux new-session -A -s dlp'

    # --- exec ONE-SHOT: chấm step của Lessons (P2 / 2.C) ---------------------
    #
    # ⛔ TÁCH HẲN khỏi execCommand ở trên, không phải trùng lặp. Attach vào tmux
    # của người học rồi bơm script chấm vào đó sẽ (1) gõ lệnh chấm ngay giữa màn
    # hình họ đang làm bài, (2) trả exit code của tmux chứ không của script.
    # Script đi qua STDIN của `sh` — không qua argv, vì argv nằm trong query
    # string của URL apiserver và một verify script vài KB sẽ phình nó.
    execShell: 'sh'
    # Trần MỘT lượt chấm. Vượt → 502 (lỗi), KHÔNG phải "bài sai": một script treo
    # không phải một bài làm sai, và trả "fail" cho nó sẽ bắt người học đi sửa
    # một bài vốn đã đúng.
    execTimeout: '30s'
    # Trần byte output mỗi lượt chấm. Đây là trần CHỐNG DoS, không phải trần hiển
    # thị — FE chỉ dùng output làm hint vài dòng. Cắt cỡ KHÔNG làm mất exit code
    # (xem podexec/oneshot.go `cappedWriter`).
    execMaxOutput: '8192'

# Ingress gộp origin web ↔ gateway. TẮT mặc định — xem templates/ingress.yaml
# để biết vì sao bật nó trên cluster không có ingress controller là cái bẫy im
# lặng. Đây là điều kiện SỐNG của cookie dlp_sandbox (SameSite=Strict, host-only),
# không phải tiện nghi vận hành.
ingress:
  enabled: false
  # Tên IngressClass (vd 'traefik', 'nginx'). Rỗng = dùng class mặc định của cluster.
  className: ''
  # Rỗng = rule không gắn host (khớp mọi Host header) — chỉ hợp lý khi cluster
  # phục vụ đúng một ứng dụng.
  host: ''
  annotations: {}
  tls:
    enabled: false
    secretName: ''

# Postgres + Redis chạy TRONG cluster. TẮT mặc định ở đây: values.yaml là bản
# "cloud-shaped", và trên cloud thì managed DB (backup, PITR, failover) thắng
# tuyệt đối một pod tự dựng. values-selfhost.yaml bật lên cho VM lab.
#
# Trước P1, hai datastore này CHỈ tồn tại trong docker-compose.yml trên máy dev,
# nên pod orchestrator trong cluster gọi RequireDataStores() là CrashLoop ngay
# (phase-1 R10, task 1.B0.2).
datastore:
  enabled: false

  # Rỗng = dùng StorageClass MẶC ĐỊNH của cluster. Cluster lab kubeadm không có
  # StorageClass nào sẵn — xem infra/host/05-cluster-addons.sh (cài
  # local-path-provisioner) và values-selfhost.yaml.
  storageClassName: ''

  # Rỗng = dùng global.imagePullPolicy. Self-host đặt Never cho image CỦA TA
  # (import tay vào containerd), nhưng postgres/redis đến từ Docker Hub và PHẢI
  # được phép pull — nếu không, đặt Never trên một image chưa có trên node là
  # ImagePullBackOff vĩnh viễn mà thông báo lỗi không hề nói lý do thật.
  imagePullPolicy: ''

  # Secret có sẵn mang 4 khoá POSTGRES_PASSWORD / REDIS_PASSWORD / DATABASE_URL /
  # REDIS_URL. Set giá trị này ⇒ chart KHÔNG tạo Secret và KHÔNG đòi password.
  existingSecret: ''

  postgres:
    enabled: true
    image: postgres:16-alpine
    user: dlp
    database: dlp
    # KHÔNG có default — xem datastore-secret.yaml.
    password: ''
    storage: 4Gi
    resources:
      requests:
        cpu: 50m
        memory: 128Mi
      limits:
        cpu: 500m
        memory: 512Mi

  redis:
    enabled: true
    image: redis:7-alpine
    password: ''
    # 1Gi cho AOF: warm-pool + session hash là dữ liệu nhỏ, nhưng AOF ghi phụ
    # thêm liên tục và chỉ rewrite theo ngưỡng.
    storage: 1Gi
    # PHẢI thấp hơn resources.limits.memory một biên đủ rộng: AOF rewrite dùng
    # fork() + copy-on-write nên đỉnh RSS cao hơn dataset. Chạm limit = OOMKill =
    # mất mọi session đang chạy; chạm maxmemory = Redis trả lỗi ghi, và đó là
    # thứ ta đọc được trong log.
    maxmemory: 128mb
    resources:
      requests:
        cpu: 25m
        memory: 32Mi
      limits:
        cpu: 250m
        memory: 256Mi

platform:
  # Bảo vệ 3 pod nền tảng khỏi bị kube-scheduler preempt khi node cạn tài
  # nguyên vì pod sandbox sinh viên tràn ngập — pod sandbox giữ nguyên
  # priority mặc định (0, không set class), platform luôn thắng khi phải
  # chọn ai bị evict trước trên VM 1-node.
  priorityClassEnabled: true
  priorityClassName: dlp-platform-critical
  priorityClassValue: 1000000

  # mTLS cho cổng gRPC orchestrator — MỘT biến cho cả ba service (1.C-4).
  #
  #   off        Không TLS. Cổng gRPC không xác thực người gọi: `user_id` là
  #              field client tự khai, nhánh `system_component` của ReapSession
  #              bị TỪ CHỐI (fail-closed). Đây là trạng thái R25 mô tả.
  #   permissive Server có TLS và nhận CẢ client có cert lẫn không; client nào
  #              cũng đã trình cert. Nấc để QUAN SÁT trước khi siết.
  #   require    Không có client cert hợp lệ ⇒ Unauthenticated.
  #
  # ⛔ MẶC ĐỊNH `require`, KHÔNG PHẢI `permissive` — VÀ ĐÓ LÀ MỘT SỬA LỖI.
  # Bản đầu để `permissive` làm mặc định, nhưng `permissive` KHÔNG đóng R25:
  # nó nhận client không cert, nên `user_id` trong CreateSession/GetSession/
  # ExtendSession vẫn là field client tự khai và bất kỳ workload nào tới được
  # :9090 vẫn cạn được trần 4 pod. Chỉ `require` đóng vế đó. Ship `permissive`
  # làm mặc định là ship một chương "đóng R25" mà R25 vẫn mở.
  # Cài mới an toàn với `require` ngay: chart tự sinh đủ cert cho cả ba service
  # trong cùng một `helm install`, nên không có ai thiếu cert.
  #
  # ⛔ `permissive` LÀ BƯỚC DI TRÚ, KHÔNG PHẢI TRẠNG THÁI ĐÍCH — và cái thang
  # này chỉ có MỘT bậc êm, không phải hai. Đã đo 2026-08-12:
  #   off → permissive   CÓ cửa sổ chết. Đây là cú lật TRANSPORT ở cả hai đầu
  #                      (server h2c→TLS, client http→https), Kubernetes cuốn ba
  #                      Deployment không theo thứ tự nào, nên chiều nào cũng có
  #                      lúc client và server nói hai giao thức khác nhau.
  #                      Bắt buộc chấp nhận một cửa sổ, hoặc cuốn lúc vắng người.
  #   permissive→require KHÔNG có cửa sổ. Client không đổi hành vi (đã trình
  #                      cert từ trước), chỉ server siết. Đây là bậc êm DUY NHẤT,
  #                      và cũng là bậc sẽ còn lặp lại (xoay CA, thêm consumer).
  #   permissive → off   CŨNG có cửa sổ chết, đối xứng với bậc đầu. Nghĩa là
  #                      KHÔNG có đường lùi không-gián-đoạn về `off`; đường lùi
  #                      an toàn duy nhất là `require → permissive`.
  # Nói cách khác: ba nấc bảo vệ chiều CERT, không bảo vệ chiều TLS.
  grpcMtlsMode: 'require'

  # Group sở hữu volume cert. `fsGroup` là thứ làm cert ĐỌC ĐƯỢC, không phải
  # tuỳ chọn phong cách: cả ba image chạy non-root (Go uid 65532, web uid 1001),
  # và không có fsGroup thì kubelet để file `root:root` ⇒ không tiến trình nào
  # trong pod đọc nổi. Đo được trên cụm 2026-08-12: hai pod Go CrashLoopBackOff
  # với `permission denied`, còn web lên `Ready` rồi trả 500 ở mọi RPC — vì
  # probe là httpGet nên Kubernetes không thấy gì sai.
  mtlsFsGroup: 65532

# Tầng cô lập cho namespace chạy pod sandbox sinh viên (P1) — sinh viên có
# root BÊN TRONG pod và là tác nhân CỐ Ý ĐỐI KHÁNG. Namespace này KHÁC
# namespace platform (web/orchestrator/gateway) — orchestrator tạo pod sandbox
# vào đây qua SANDBOX_NAMESPACE (xem orchestrator.env.sandboxNamespace ở
# trên — PHẢI khớp giá trị sandbox.namespace dưới đây, đổi 1 chỗ mà quên chỗ
# kia là vỡ cô lập trong im lặng).
sandbox:
  enabled: true
  namespace: dlp-sandbox

  # RuntimeClass Sysbox — BẮT BUỘC trên mọi pod sandbox, ép qua
  # ValidatingAdmissionPolicy (xem templates/sandbox-admissionpolicy.yaml).
  # Đừng bật sandbox.enabled trên cluster chưa cài RuntimeClass này trước.
  runtimeClassName: sysbox-runc

  # TẮT theo mặc định — bật có ý thức khi bài lab cần internet thật (vd
  # apt-get). Bật KHÔNG mở IMDS/CIDR nội bộ cluster, xem egressExcept.
  allowInternetEgress: false
  egressExcept:
    - '169.254.0.0/16' # link-local / IMDS cloud — KHÔNG BAO GIỜ bỏ dòng này
    - '10.96.0.0/12' # service CIDR cluster (mặc định kubeadm)
    - '10.244.0.0/16' # pod CIDR cluster (mặc định Calico trên cluster đích)
    - '192.168.0.0/16' # mạng node/VM lab

  # Chặn resource-exhaustion (fork-bomb / spawn hàng loạt pod) từ 1 sinh
  # viên làm sập node. Ước lượng ban đầu cho VM lab ~11Gi RAM tổng (platform
  # hiện dùng ~1.4Gi) — chỉnh qua --set khi có capacity thật khác.
  quota:
    pods: '20'
    requestsCpu: '4'
    requestsMemory: '4Gi'
    limitsCpu: '8'
    limitsMemory: '8Gi'

  # Pod sandbox không tự khai resources (orchestrator tạo hộ, sinh viên không
  # viết YAML) — LimitRange ép default để quota ở trên thật sự có hiệu lực.
  limitRange:
    defaultRequestCpu: '500m'
    defaultRequestMemory: '512Mi'
    defaultCpu: '1'
    defaultMemory: '1Gi'
    maxCpu: '2'
    maxMemory: '2Gi'
