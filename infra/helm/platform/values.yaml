# values.yaml — mặc định "cloud-shaped" (replica ≥2, imagePullPolicy IfNotPresent
# vì cloud kéo image từ registry thật). Namespace KHÔNG đặt cứng ở đây — chọn bằng
# `helm -n <namespace> install|upgrade`.
#
# Self-host (VM kubeadm 1-node, infra/host/) đè lại qua values-selfhost.yaml.
# Cloud multi-node đè lại qua values-cloud.yaml (giữ chỗ node-pool, chưa dùng).

global:
  imagePullPolicy: IfNotPresent

image:
  # Tên repo GHCR bắt buộc lowercase.
  registry: ghcr.io/nghaiz
  tag: dev

web:
  enabled: true
  image:
    repository: dlp-web
    tag: '' # rỗng = dùng image.tag ở trên
    pullPolicy: '' # rỗng = dùng global.imagePullPolicy
  replicaCount: 2
  service:
    type: ClusterIP
    port: 3000
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 512Mi
  env:
    # databaseUrl/redisUrl rỗng = template OMIT hẳn biến (env.ts coi chuỗi rỗng
    # y như thiếu — comment cũ nói "đọc rỗng vẫn boot" là SAI). P0 chưa có
    # Postgres/Redis in-cluster: pod Running + /api/health xanh là acceptance
    # của task 27; route đụng DB 500 cho tới P1 — có chủ ý, không phải bug.
    databaseUrl: ''
    redisUrl: ''
    # KHÔNG có default — secret ký session/JWT commit trong git là secret đã lộ.
    # Đi vào một Secret (templates/web-secret.yaml) rồi tới pod qua secretKeyRef,
    # KHÔNG phải env.value trên Deployment. Thiếu là helm install DỪNG (`required`).
    betterAuthSecret: ''
    # Tên một Secret có sẵn mang 3 khoá BETTER_AUTH_SECRET / GOOGLE_CLIENT_SECRET
    # / MICROSOFT_CLIENT_SECRET. Set giá trị này ⇒ chart KHÔNG tạo Secret và
    # KHÔNG đòi betterAuthSecret. Đây là đường prod: giá trị thật không đi qua
    # `--set` nên không nằm lại trong shell history / `helm get values` / log CI.
    existingSecret: ''
    betterAuthUrl: 'http://localhost:3000'
    # Origin công khai của app (metadataBase). Rỗng = biến bị omit hẳn. KHÁC
    # betterAuthUrl về vai trò dù thường trùng giá trị: cái kia là base để dựng
    # callback OAuth + issuer JWT, cái này chỉ là base URL của metadata trang.
    appUrl: ''
    # Rỗng = template tự suy "<release>-orchestrator:<grpcPort>" (DNS in-cluster).
    orchestratorGrpcAddr: ''
    # Đường BFF → terminal-gateway cho `lessons.checkStep` (P2 / 2.C).
    # Rỗng = template tự suy "<release>-gateway:<port>" (DNS in-cluster).
    #
    # ⚠ KHÔNG phải `appUrl`. Trình duyệt tới gateway qua reverse proxy gộp origin
    # (D1); BFF thì gọi thẳng Service. Đặt origin công khai vào đây nghĩa là mỗi
    # lượt bấm "Check" đi ra internet rồi vòng lại, và nó hỏng đúng lúc ingress
    # chưa sẵn sàng — trong khi bản thân cụm vẫn hoàn toàn khoẻ.
    gatewayInternalUrl: ''
    # Thư mục nội dung bài học TRONG image (apps/web/Dockerfile `COPY content`).
    # Tuyệt đối vì cwd runtime là /repo. Chỉ đổi khi mount nội dung từ volume.
    scenariosDir: '/repo/content/scenarios'
    # '1' CHỈ khi web đứng sau proxy set x-forwarded-for đúng (Traefik — P3).
    # Rỗng = biến bị omit, middleware skip rate limit (log 1 lần). Xem
    # apps/web/src/middleware.ts clientKey().
    rateLimitTrustProxy: ''
    googleClientId: 'placeholder'
    googleClientSecret: 'placeholder'
    microsoftClientId: 'placeholder'
    microsoftClientSecret: 'placeholder'
    corsAllowedOrigins: 'http://localhost:3000'

# Job chạy migration Drizzle như hook pre-install/pre-upgrade.
# Xem templates/migrate-job.yaml để biết vì sao là hook chứ không phải initContainer.
migrate:
  enabled: true
  image:
    repository: dlp-migrator
    tag: ''
    pullPolicy: ''
  # Trần cứng để `helm upgrade` không treo vô thời hạn khi Postgres không tới
  # được. 5 phút đủ rộng cho một migration thật, đủ hẹp để lỗi lộ ra nhanh.
  activeDeadlineSeconds: 300
  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      cpu: 500m
      memory: 256Mi

orchestrator:
  enabled: true
  image:
    repository: dlp-orchestrator
    tag: ''
    pullPolicy: ''
  replicaCount: 2
  service:
    type: ClusterIP
    httpPort: 8081
    grpcPort: 9090
  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      cpu: 250m
      memory: 256Mi
  env:
    grpcAddr: ':9090'
    httpAddr: ':8081'
    logLevel: 'info'
    grpcReflection: 'false'
    databaseUrl: ''
    redisUrl: ''
    sessionTtl: '1h'
    shutdownGrace: '15s'
    sandboxNamespace: 'dlp-sandbox'

    # URL mirror docker.io truyền xuống pod sandbox (P3/3.I). RỖNG = template tự
    # ghép từ `registryMirror` khi mirror bật (SSOT), giống cách SANDBOX_IMAGE tự
    # ghép từ image.registry+tag. Đặt giá trị TƯỜNG MINH ở đây chỉ khi muốn ghim
    # một URL mirror KHÁC (vd mirror ngoài chart) — nhân bản con số này là cách
    # nó trôi khỏi tên Service thật.
    registryMirror: ''

    # Trần TUYỆT ĐỐI của một session, tính từ created_at, KHÔNG gia hạn được
    # (phase-1 D11). Phải >= sessionTtl, nếu không orchestrator từ chối khởi động.
    hardCap: '2h'

    # Số pod ấm giữ sẵn. ⛔ trần session đồng thời = quota_hiệu_lực − poolTarget
    # (D16), với quota_hiệu_lực là min của NĂM ràng buộc quota×LimitRange — xem
    # `sandbox.quota` cuối file.
    #
    # 2026-08-16 (3.I mắt 5): quota hiệu lực trên lab đi từ 4 lên **21 pod**, nên
    # ràng buộc cũ ("3 ở đây là phục vụ đúng MỘT user rồi replenish chết vì
    # quota") KHÔNG còn áp. Vẫn để 1 vì nâng nó là một đánh đổi CHƯA đo: mỗi pod
    # ấm là một khe quota bị giữ thường trực và một phần chi phí đáy khi không ai
    # học (docs/cost-model.md §5), đổi lấy việc người thứ 2..N không phải chờ cold
    # path. Muốn đổi thì đo tỉ lệ cold-path thật trước, đừng nâng theo cảm giác.
    poolTarget: '1'

    # Image của pod lab. RỖNG = kế thừa `image.registry` + `image.tag` ở trên
    # (thành `<registry>/dlp-sandbox-base:<tag>`) — cùng khuôn với
    # `sandboxRuntimeClass`, và vì đúng lý do đó: chép `ghcr.io/nghaiz` với `dev`
    # xuống đây là dựng bản sao thứ hai của hai giá trị mà mọi image khác đã lấy
    # từ một chỗ, rồi một ngày đổi tag ở trên mà pod lab vẫn chạy bản cũ.
    #
    # 1.E-1 (2026-08-10) đã thay `registry.k8s.io/pause:3.10` bằng image thật:
    # `pause` chỉ ngủ, không có shell nào để exec vào, nên D3/G4 (tmux) không thể
    # chạy trên nó. Đặt giá trị TƯỜNG MINH ở đây chỉ khi muốn ghim pod lab vào
    # một image khác hẳn — ví dụ quay lại `pause` để đo warm-pool mà không tốn RAM.
    sandboxImage: ''

    # Để RỖNG để kế thừa `sandbox.runtimeClassName` — đó là SSOT. Chỉ đặt giá
    # trị ở đây khi thật sự muốn orchestrator dựng pod với RuntimeClass KHÁC với
    # cái mà ValidatingAdmissionPolicy đang ép, tức là cố tình làm mọi pod bị từ
    # chối. Nhân bản con số này là cách nó trôi đi.
    sandboxRuntimeClass: ''

    # Khoảng đẩy thêm mỗi lần gateway heartbeat (D11).
    # ⚠ Con số này THỰC TẾ quyết định hạn của session sau lần gia hạn đầu tiên,
    # không phải sessionTtl — xem Service.Extend trong internal/lifecycle.
    extendDefault: '300s'

    # Nhịp sweep của reaper. Sweep là ĐƯỜNG CHÍNH (keyspace notification chỉ là
    # đường nhanh, best-effort và mất event khi reaper offline).
    reapInterval: '60s'

    # mTLS của cổng gRPC nay điều khiển bằng MỘT biến dùng chung cho cả ba
    # service: `platform.grpcMtlsMode` ở cuối file. Không còn cờ riêng ở đây —
    # ba giá trị riêng lẻ là ba cơ hội để chúng lệch nhau, và một client chưa
    # cắm cert gặp server đã siết là 100% RPC đỏ.

gateway:
  enabled: true
  image:
    repository: dlp-terminal-gateway
    tag: ''
    pullPolicy: ''
  replicaCount: 2
  service:
    type: ClusterIP
    publicPort: 8082
    # KHÔNG có adminPort ở đây — /healthz + /metrics (8083) cố ý không lên
    # Service: /metrics không có authz, lộ version + số goroutine (đếm được
    # session đang chạy). kubelet probe vẫn chạm được vì probe đánh thẳng pod IP,
    # không qua Service. Xem services/terminal-gateway/internal/config/config.go.
  resources:
    requests:
      cpu: 100m
      memory: 64Mi
    limits:
      # Xem values-selfhost.yaml cho số đo đầy đủ (1.G-4). Tóm tắt: dựng một
      # phiên terminal là công việc ĐỘT BIẾN (bắt tay TLS tới apiserver, dựng
      # stream, bơm byte đầu), còn quota CFS cắt theo từng cửa sổ 100ms — nên
      # trần đặt theo mức trung bình sẽ throttle đúng lúc người dùng đang chờ.
      # Ở 150m đo được 38.7% chu kỳ bị throttle và +123ms mỗi lượt attach; 250m
      # nằm cùng vùng đó. 500m đưa throttle về 0.4%.
      cpu: 500m
      memory: 256Mi

  # --- drain êm khi rollout (3.H) ---------------------------------------
  #
  # PHẢI > gateway.env.shutdownGrace. Xem chú thích trong gateway-deployment.yaml:
  # kubelet đếm từ preStop, và SIGKILL tới trước khi drain xong thì `defer` trả
  # khe WS không chạy — đúng chế độ hỏng 3.H đang vá.
  # 15s (shutdownGrace) + 5s (preStop) + 10s biên = 30s.
  terminationGracePeriodSeconds: 30
  # 0 ⇒ tắt preStop. 5s đủ cho endpoint rụng khỏi Traefik trước khi tiến trình
  # bắt đầu từ chối kết nối mới.
  preStopSleepSeconds: 5

  pdb:
    # Mặc định TẮT vì values.yaml gốc dùng được cho cả hồ sơ 1 replica, và
    # `minAvailable: 1` với 1 replica CHẶN drain vĩnh viễn. Bật cùng lúc với
    # replicaCount ≥ 2, không bao giờ tách rời.
    enabled: false
    minAvailable: 1

  env:
    publicAddr: ':8082'
    # BẮT BUỘC ":8083" trong k8s — default trong code Go là "127.0.0.1:8083"
    # (chỉ bind loopback), khiến kubelet probe từ ngoài container fail. Đè lại ở
    # đây, không phải ở code, vì đây là khác biệt do MÔI TRƯỜNG chạy (container vs
    # host), không phải default sai. Xem plans/devops-learning-platform/phase-0.md 0.F.
    adminAddr: ':8083'
    logLevel: 'info'
    shutdownGrace: '15s'
    # Rỗng = template tự suy ra "<release>-orchestrator:<grpcPort>" (xem
    # templates/gateway-deployment.yaml). Chưa dùng thật ở P0 — gateway chưa gọi
    # orchestrator (task 22) — nhưng khoá đúng hình dạng DNS trong-cluster từ đây.
    orchestratorGrpcAddr: ''
    # Rỗng = lấy REDIS_URL từ Secret của datastore in-cluster (qua secretKeyRef —
    # URL chứa mật khẩu). Chỉ đặt tường minh khi trỏ Redis NGOÀI cluster, và lúc
    # đó nhớ rằng giá trị này sẽ hiện nguyên văn trong `helm get values`.
    redisUrl: ''
    # JWKS của Better Auth — gateway verify sandbox token bằng khoá công khai lấy
    # từ đây (phase-1 D15, 1.B0.5). KHÔNG có khoá riêng nào của gateway: khoá
    # riêng đẻ ra biến env × 4 nơi, một Helm secret, và một quy trình xoay vòng
    # thủ công. JWKS cho rotation miễn phí.
    #
    # Rỗng = template tự suy ra "<release>-web:<port>/api/auth/jwks" (DNS
    # in-cluster). Chỉ đặt tường minh khi web nằm ngoài cluster này.
    jwksUrl: ''

    # Giá trị `iss` mà sandbox token bắt buộc mang.
    #
    # ⚠ KHÔNG suy ra được từ jwksUrl: jwksUrl là DNS NỘI BỘ
    # (http://<release>-web:3000/...) còn `iss` là URL CÔNG KHAI trình duyệt
    # thấy. Rỗng = template lấy ĐÚNG `web.env.betterAuthUrl` — một giá trị, hai
    # nơi đọc, không có hằng số thứ hai để trôi.
    tokenIssuer: ''

    # Allowlist `Origin` của handshake WS, ngăn cách bằng dấu phẩy. Đây là thứ
    # DUY NHẤT đóng CSWSH (handshake WS không chịu CORS).
    #
    # Rỗng = template lấy `web.env.appUrl` (rơi về `betterAuthUrl` khi trống) —
    # cùng origin với web là ĐIỀU KIỆN SỐNG của cookie dlp_sandbox
    # (SameSite=Strict, host-only), nên hai giá trị này vốn phải bằng nhau.
    allowedOrigins: ''

    # Trần WS ĐỒNG THỜI trên một session (D17). Số ĐO ĐƯỢC trên tmux 3.4: client
    # thứ hai attach làm cửa sổ của client thứ nhất tụt từ 200×50 xuống 80×23 rồi
    # lật qua lại mỗi keystroke. Nâng lên >1 là chấp nhận terminal tự co giãn.
    maxWsPerSession: '1'

    # Lease của khe `session:{id}:ws` (3.H) — gia hạn ở 1/3 lease suốt phiên.
    #
    # ĐÂY LÀ THỜI GIAN NGƯỜI DÙNG BỊ KHOÁ NGOÀI phiên của chính mình khi gateway
    # chết ĐỘT NGỘT (SIGKILL, OOM, mất node) — những ca `defer` không chạy nên
    # drain êm không đỡ được. Trước 3.H giá trị này là cả phần đời còn lại của
    # session: baseline đo được 2/2 phiên KHÔNG vào lại được sau một lượt rollout.
    #
    # Ngắn hơn ⇒ tự lành nhanh hơn nhưng biên chịu lỗi Redis mỏng đi (gia hạn
    # mỗi lease/3). 90s cho biên 2 nhịp lỡ.
    wsLease: '90s'

    # Lệnh chạy trong pod khi gateway attach (G4). Tách theo khoảng trắng — argv.
    #
    # ⛔ HẰNG SỐ PHÍA SERVER: contract §3c cấm client chọn lệnh, vì đó là cho
    # client chọn thứ chạy trong pod. Đổi giá trị này là đổi thứ MỌI sinh viên
    # nhận được khi mở terminal.
    #
    # `tmux new-session -A -s dlp` (D3) chứ không phải `bash`: pods/exec mỗi lần
    # attach sinh tiến trình MỚI, nên không có tmux thì "mất mạng rồi vào lại" là
    # một shell trắng, không phải phiên cũ. Image sandbox-base đã cài sẵn tmux 3.4
    # và tắt status bar (E4) để stty size khớp chính xác cols/rows FE gửi.
    execCommand: 'tmux new-session -A -s dlp'

    # --- exec ONE-SHOT: chấm step của Lessons (P2 / 2.C) ---------------------
    #
    # ⛔ TÁCH HẲN khỏi execCommand ở trên, không phải trùng lặp. Attach vào tmux
    # của người học rồi bơm script chấm vào đó sẽ (1) gõ lệnh chấm ngay giữa màn
    # hình họ đang làm bài, (2) trả exit code của tmux chứ không của script.
    # Script đi qua STDIN của `sh` — không qua argv, vì argv nằm trong query
    # string của URL apiserver và một verify script vài KB sẽ phình nó.
    #
    # ⛔ `bash`, KHÔNG phải `sh` — đo trên cụm 2026-08-13, không phải phòng xa.
    # Nội dung Killercoda là script BASH: shebang `#!/bin/bash`, `[[ ]]`, và
    # `set -euo pipefail`. `sh` trong image sandbox là dash, và dash không có
    # `pipefail`, nên MỌI verify script thật chết ngay dòng `set`:
    #     sh: 3: set: Illegal option -o pipefail        (exit 2)
    # `ckad-configmap-as-files` (bài mà plan P2 chỉ định làm bằng chứng pass/fail)
    # dùng cả `[[ ]]` lẫn `set -euo pipefail` ⇒ nó đã hỏng vì lý do NÀY nữa, độc
    # lập với việc thiếu `kubectl`.
    #
    # Bẫy nguy hiểm hơn cả lỗi: lượt chấm đó vẫn trả `passed:false` — đúng cái
    # nhãn mà một bài CHƯA LÀM cũng nhận. Ô AC "vế fail" vì thế XANH VÌ LÝ DO
    # SAI, và không ai đọc `output` để thấy nó chưa từng chạy dòng nào.
    execShell: 'bash'
    # Trần MỘT lượt chấm. Vượt → 502 (lỗi), KHÔNG phải "bài sai": một script treo
    # không phải một bài làm sai, và trả "fail" cho nó sẽ bắt người học đi sửa
    # một bài vốn đã đúng.
    execTimeout: '30s'
    # Trần byte output mỗi lượt chấm. Đây là trần CHỐNG DoS, không phải trần hiển
    # thị — FE chỉ dùng output làm hint vài dòng. Cắt cỡ KHÔNG làm mất exit code
    # (xem podexec/oneshot.go `cappedWriter`).
    execMaxOutput: '8192'

# Ingress gộp origin web ↔ gateway. TẮT mặc định — xem templates/ingress.yaml
# để biết vì sao bật nó trên cluster không có ingress controller là cái bẫy im
# lặng. Đây là điều kiện SỐNG của cookie dlp_sandbox (SameSite=Strict, host-only),
# không phải tiện nghi vận hành.
ingress:
  enabled: false
  # Tên IngressClass (vd 'traefik', 'nginx'). Rỗng = dùng class mặc định của cluster.
  className: ''
  # Rỗng = rule không gắn host (khớp mọi Host header) — chỉ hợp lý khi cluster
  # phục vụ đúng một ứng dụng.
  host: ''
  annotations: {}
  tls:
    enabled: false
    secretName: ''

  # ── Middleware ở BIÊN (P3 / 3.A — luật 5 của design §6) ────────────────────
  # TẮT mặc định vì đây là CRD riêng của Traefik (traefik.io/v1alpha1). Bật trên
  # cluster dùng nginx/HAProxy thì `helm upgrade` chết ở bước apply với lỗi
  # "no matches for kind Middleware" — tắt là mặc định trung lập nhà cung cấp,
  # đúng cam kết cloud-agnostic của plan.md §7.
  #
  # Bật cờ này KHÔNG tự nó siết gì thêm ở apps/web: `web.env.rateLimitTrustProxy`
  # là một quyết định TÁCH RỜI và phải bật SAU khi đã đo được Traefik thật sự
  # chuẩn hoá `x-forwarded-for` (3.A bước 5). Bật trust-proxy trước phép đo đó là
  # tự tay mở đường giả mạo IP: web sẽ tin một header mà client tự đặt được.
  middleware:
    enabled: false
    # Tên entrypoint của Traefik. Mặc định của chart traefik: web=:8000 (HTTP),
    # websecure=:8443 (HTTPS). Ghim router vào đúng entrypoint là thứ ngăn vòng
    # lặp chuyển hướng — xem templates/middleware-redirect.yaml.
    entrypoints:
      secure: websecure
      insecure: web
    bodyLimit:
      # 1 MiB — CÙNG con số với MAX_JSON_BODY_BYTES của apps/web
      # (server/security/body-limit.ts). Hai lớp cùng trần có chủ ý: lớp web trả
      # lỗi tRPC đọc được cho client hợp lệ, lớp biên chặn thứ không bao giờ nên
      # tới nơi. Lệch số giữa hai lớp thì khoảng giữa là vùng "web từ chối nhưng
      # biên cho qua" — tốn tài nguyên mà không ai gác.
      maxRequestBodyBytes: 1048576
    rateLimit:
      # Request ĐỘNG (mọi thứ trừ /_next/static và /ws).
      #
      # ⚠ 120 TRÙNG SỐ với RATE_LIMIT_MAX_REQUESTS của web nhưng KHÔNG phải cùng
      # một ngân sách — đừng đọc thành "hai lớp cùng trần". `proxy.ts` khai matcher
      # `['/((?!_next/static|_next/image|favicon.ico).*)']` nên lớp của web KHÔNG
      # đếm asset tĩnh; router này xấp xỉ được điều đó CHỈ VÌ `/_next/static` đã
      # tách sang router riêng bên dưới. Bỏ router tĩnh đi là trần này lập tức đếm
      # cả chunk JS — tức sự tương đương đến từ CẤU HÌNH, không phải hiển nhiên.
      web:
        average: 120
        period: 1m
        burst: 60
      # Asset tĩnh: rộng hơn hẳn, có lý do đo được — xem
      # templates/middleware-ratelimit.yaml. Riêng trang chủ đã tham chiếu 14 file
      # `/_next/static` ngay trong HTML (đo 2026-08-14), chưa tính import lồng
      # nhau, font và ảnh; trang bài học nguội còn nặng hơn. Vẫn có trần chứ không
      # thả tự do — asset rẻ nhưng không miễn phí.
      static:
        average: 600
        period: 1m
        burst: 300
      # Handshake WebSocket: MỖI lượt là một lần attach vào pod sandbox, đắt hơn
      # một GET nhiều bậc. Trần D17=1 (một phiên một WS) KHÔNG chặn được việc một
      # IP mở liên tiếp nhiều handshake nhắm nhiều session khác nhau.
      #
      # ⚠ CHƯA ĐO trên tải thật. Hai ca phải soi trước 3.E: (a) gateway restart ⇒
      # mọi client nối lại cùng lúc, nếu client retry không có backoff nhiễu thì
      # một người ăn hết burst; (b) một lớp học sau NAT chung vẫn dùng CHUNG một
      # bucket dù `externalTrafficPolicy: Local` đã trả lại IP thật — NAT gộp N
      # người vào một địa chỉ, và 20/phút chia cho cả lớp là quá chật.
      ws:
        average: 20
        period: 1m
        burst: 10
    redirectHttps:
      enabled: false
      # Cổng CÔNG KHAI của entrypoint HTTPS, khai TƯỜNG MINH. Rỗng = giữ nguyên
      # cổng của request. Traefik chỉ biết websecure là :8443 bên trong pod và
      # không biết gì về NodePort 30443 bên ngoài, nên để rỗng trên NodePort sẽ
      # sinh `Location` trỏ vào một cổng không ai mở được — đúng nỗi lo nợ P2 §3.
      port: ''
      # false ⇒ 302 Found; true ⇒ 301 Moved Permanently (đo trên cụm 2026-08-14).
      # Giữ 302 ở chặng này vì 301 bị trình duyệt cache lâu dài: một Location sai
      # cổng sẽ dính lại cả sau khi đã sửa, và triệu chứng ("vẫn hỏng") không phân
      # biệt được với "bản vá chưa deploy". Đổi sang true khi AC-A5 xanh ổn định.
      permanent: false

# Postgres + Redis chạy TRONG cluster. TẮT mặc định ở đây: values.yaml là bản
# "cloud-shaped", và trên cloud thì managed DB (backup, PITR, failover) thắng
# tuyệt đối một pod tự dựng. values-selfhost.yaml bật lên cho VM lab.
#
# Trước P1, hai datastore này CHỈ tồn tại trong docker-compose.yml trên máy dev,
# nên pod orchestrator trong cluster gọi RequireDataStores() là CrashLoop ngay
# (phase-1 R10, task 1.B0.2).
datastore:
  enabled: false

  # Rỗng = dùng StorageClass MẶC ĐỊNH của cluster. Cluster lab kubeadm không có
  # StorageClass nào sẵn — xem infra/host/05-cluster-addons.sh (cài
  # local-path-provisioner) và values-selfhost.yaml.
  storageClassName: ''

  # Rỗng = dùng global.imagePullPolicy. Self-host đặt Never cho image CỦA TA
  # (import tay vào containerd), nhưng postgres/redis đến từ Docker Hub và PHẢI
  # được phép pull — nếu không, đặt Never trên một image chưa có trên node là
  # ImagePullBackOff vĩnh viễn mà thông báo lỗi không hề nói lý do thật.
  imagePullPolicy: ''

  # Secret có sẵn mang 4 khoá POSTGRES_PASSWORD / REDIS_PASSWORD / DATABASE_URL /
  # REDIS_URL. Set giá trị này ⇒ chart KHÔNG tạo Secret và KHÔNG đòi password.
  existingSecret: ''

  postgres:
    enabled: true
    image: postgres:16-alpine
    user: dlp
    database: dlp
    # KHÔNG có default — xem datastore-secret.yaml.
    password: ''
    storage: 4Gi
    resources:
      requests:
        cpu: 50m
        memory: 128Mi
      limits:
        cpu: 500m
        memory: 512Mi

  redis:
    enabled: true
    image: redis:7-alpine
    password: ''
    # 1Gi cho AOF: warm-pool + session hash là dữ liệu nhỏ, nhưng AOF ghi phụ
    # thêm liên tục và chỉ rewrite theo ngưỡng.
    storage: 1Gi
    # PHẢI thấp hơn resources.limits.memory một biên đủ rộng: AOF rewrite dùng
    # fork() + copy-on-write nên đỉnh RSS cao hơn dataset. Chạm limit = OOMKill =
    # mất mọi session đang chạy; chạm maxmemory = Redis trả lỗi ghi, và đó là
    # thứ ta đọc được trong log.
    maxmemory: 128mb
    resources:
      requests:
        cpu: 25m
        memory: 32Mi
      limits:
        cpu: 250m
        memory: 256Mi

platform:
  # Bảo vệ 3 pod nền tảng khỏi bị kube-scheduler preempt khi node cạn tài
  # nguyên vì pod sandbox sinh viên tràn ngập — pod sandbox giữ nguyên
  # priority mặc định (0, không set class), platform luôn thắng khi phải
  # chọn ai bị evict trước trên VM 1-node.
  priorityClassEnabled: true
  priorityClassName: dlp-platform-critical
  priorityClassValue: 1000000

  # mTLS cho cổng gRPC orchestrator — MỘT biến cho cả ba service (1.C-4).
  #
  #   off        Không TLS. Cổng gRPC không xác thực người gọi: `user_id` là
  #              field client tự khai, nhánh `system_component` của ReapSession
  #              bị TỪ CHỐI (fail-closed). Đây là trạng thái R25 mô tả.
  #   permissive Server có TLS và nhận CẢ client có cert lẫn không; client nào
  #              cũng đã trình cert. Nấc để QUAN SÁT trước khi siết.
  #   require    Không có client cert hợp lệ ⇒ Unauthenticated.
  #
  # ⛔ MẶC ĐỊNH `require`, KHÔNG PHẢI `permissive` — VÀ ĐÓ LÀ MỘT SỬA LỖI.
  # Bản đầu để `permissive` làm mặc định, nhưng `permissive` KHÔNG đóng R25:
  # nó nhận client không cert, nên `user_id` trong CreateSession/GetSession/
  # ExtendSession vẫn là field client tự khai và bất kỳ workload nào tới được
  # :9090 vẫn cạn được trần 4 pod. Chỉ `require` đóng vế đó. Ship `permissive`
  # làm mặc định là ship một chương "đóng R25" mà R25 vẫn mở.
  # Cài mới an toàn với `require` ngay: chart tự sinh đủ cert cho cả ba service
  # trong cùng một `helm install`, nên không có ai thiếu cert.
  #
  # ⛔ `permissive` LÀ BƯỚC DI TRÚ, KHÔNG PHẢI TRẠNG THÁI ĐÍCH — và cái thang
  # này chỉ có MỘT bậc êm, không phải hai. Đã đo 2026-08-12:
  #   off → permissive   CÓ cửa sổ chết. Đây là cú lật TRANSPORT ở cả hai đầu
  #                      (server h2c→TLS, client http→https), Kubernetes cuốn ba
  #                      Deployment không theo thứ tự nào, nên chiều nào cũng có
  #                      lúc client và server nói hai giao thức khác nhau.
  #                      Bắt buộc chấp nhận một cửa sổ, hoặc cuốn lúc vắng người.
  #   permissive→require KHÔNG có cửa sổ. Client không đổi hành vi (đã trình
  #                      cert từ trước), chỉ server siết. Đây là bậc êm DUY NHẤT,
  #                      và cũng là bậc sẽ còn lặp lại (xoay CA, thêm consumer).
  #   permissive → off   CŨNG có cửa sổ chết, đối xứng với bậc đầu. Nghĩa là
  #                      KHÔNG có đường lùi không-gián-đoạn về `off`; đường lùi
  #                      an toàn duy nhất là `require → permissive`.
  # Nói cách khác: ba nấc bảo vệ chiều CERT, không bảo vệ chiều TLS.
  grpcMtlsMode: 'require'

  # Group sở hữu volume cert. `fsGroup` là thứ làm cert ĐỌC ĐƯỢC, không phải
  # tuỳ chọn phong cách: cả ba image chạy non-root (Go uid 65532, web uid 1001),
  # và không có fsGroup thì kubelet để file `root:root` ⇒ không tiến trình nào
  # trong pod đọc nổi. Đo được trên cụm 2026-08-12: hai pod Go CrashLoopBackOff
  # với `permission denied`, còn web lên `Ready` rồi trả 500 ở mọi RPC — vì
  # probe là httpGet nên Kubernetes không thấy gì sai.
  mtlsFsGroup: 65532

# Cô lập mạng cho namespace NỀN TẢNG (web/gateway/orchestrator/postgres/redis) —
# P3/3.B. Namespace sandbox có default-deny riêng từ P1 (khối `sandbox` ở dưới);
# phần này là hàng rào cho chính các dịch vụ nền tảng, vốn TRƯỚC 3.B không có
# NetworkPolicy nào.
networkPolicy:
  platform:
    # ⛔ MẶC ĐỊNH TẮT, VÀ ĐÓ LÀ MỘT QUYẾT ĐỊNH CHỨ KHÔNG PHẢI SỰ THẬN TRỌNG THỪA.
    # Bật cờ này là siết mạng NGAY (xem ghi chú `denyEnabled` ngay dưới: các
    # policy allow tự chúng đã siết). Ba giá trị bên dưới — apiServerEndpoints,
    # nodeCidrs, và datastoreExternalEgress khi DB nằm ngoài cụm — PHỤ THUỘC CỤM
    # và không có mặc định đúng nào; bật mà chưa khai đủ thì chart `fail` lúc
    # render. Vì thế nó phải là hành động có ý thức tại chỗ deploy, cùng khuôn
    # với `ingress.middleware.enabled`.
    # Đường bật đã dựng sẵn: infra/host/09-networkpolicy.sh — script đọc endpoint
    # apiserver + IP node TỪ CỤM ĐANG CHẠY rồi in ra lệnh `--set` tương ứng, nên
    # không ai phải gõ tay ba giá trị dễ sai đó.
    enabled: false

    # ⛔ HAI PHA, KHÔNG PHẢI MỘT. Đọc ngữ nghĩa ở đầu
    # templates/platform-networkpolicy.yaml trước khi đổi cờ này.
    #
    # Điều DỄ HIỂU NGƯỢC NHẤT: các policy `allow-*` ở trên TỰ CHÚNG đã siết
    # web/gateway/orchestrator/migrate — trong Kubernetes, một pod bị BẤT KỲ
    # policy nào chọn với `policyTypes: Egress` lập tức chỉ còn đúng những chiều
    # được liệt kê. Cờ này KHÔNG phải thứ bật sự siết chặt; nó phủ nốt phần còn
    # hở: pod lạ không policy nào chọn, và egress của postgres/redis.
    #
    # Vẫn bật SAU vì lý do đo đạc: áp allow → xác nhận từng chiều còn sống bằng
    # infra/k8s/netpol-verify.sh → rồi mới bật deny. Bật cả hai cùng lúc thì mọi
    # nguyên nhân sai đều cho CÙNG một triệu chứng (timeout) và không tách được.
    # Giữ tắt được để chẩn đoán mà không phải gỡ cả chart.
    denyEnabled: false

    # Namespace của ingress controller. `kubernetes.io/metadata.name` là nhãn do
    # chính Kubernetes đặt trên mọi namespace nên không phụ thuộc người vận hành
    # có nhớ gắn nhãn hay không.
    ingressControllerNamespace: traefik

    # ⛔ Endpoint THẬT của kube-apiserver — KHÔNG phải ClusterIP 10.96.0.1:443.
    # NetworkPolicy được đánh giá SAU khi kube-proxy DNAT, nên đích policy nhìn
    # thấy là endpoint thật (kubeadm: IP node + 6443). Rỗng + denyEnabled=true ⇒
    # chart `fail`, vì chiều này hỏng làm CẢ SẢN PHẨM chết trong khi mọi pod vẫn
    # Running 1/1 (gateway không exec được, orchestrator không tạo được pod).
    #   kubectl get endpoints kubernetes \
    #     -o jsonpath='{.subsets[0].addresses[0].ip}:{.subsets[0].ports[0].port}'
    apiServerEndpoints: []
    # - cidr: 192.168.94.130/32
    #   port: 6443

    # ⛔ IP node — nguồn của probe kubelet. Probe KHÔNG đi từ pod nên không
    # selector nào bắt được; thiếu dải này dưới default-deny thì web/gateway/
    # orchestrator bị giết-tạo-lại liên tục và đọc ra y hệt "ứng dụng crash".
    # Rỗng + denyEnabled=true ⇒ chart `fail`.
    #   kubectl get nodes -o jsonpath='{.items[*].status.addresses[?(@.type=="InternalIP")].address}'
    nodeCidrs: []
    # - 192.168.94.130/32

    # Dùng KHI `datastore.enabled=false` (Postgres/Redis là dịch vụ quản lý
    # ngoài cụm — đây là MẶC ĐỊNH của values.yaml và của hồ sơ cloud). Lúc đó
    # các rule datastore không thể ghim theo podSelector vì không có pod nào.
    # Rỗng + datastore.enabled=false + denyEnabled=true ⇒ chart `fail`.
    datastoreExternalEgress: []
    # - cidr: 10.20.0.5/32   # RDS
    #   port: 5432
    # - cidr: 10.20.0.6/32   # ElastiCache
    #   port: 6379

    # Egress ra internet cho web — CHỈ cần khi bật đăng nhập bằng IdP ngoài
    # (Google/Microsoft): Better Auth đổi authorization-code → token và tải JWKS
    # từ phía SERVER. Trên lab hai client id là 'placeholder' nên tắt.
    # Mở egress internet cho pod đứng ngay trước người dùng là bề mặt SSRF ⇒
    # phải là lựa chọn có ý thức, và `except` giữ các dải nội bộ để nó không
    # thành đường vòng ngược vào chính cụm.
    webExternalEgress:
      enabled: false
      except:
        - '169.254.0.0/16' # link-local / IMDS cloud — KHÔNG BAO GIỜ bỏ dòng này
        - '10.96.0.0/12' # service CIDR cluster (mặc định kubeadm)
        - '10.244.0.0/16' # pod CIDR cluster (mặc định Calico)
        - '192.168.0.0/16' # mạng node/VM lab

    # Chiều scrape của Prometheus (P3/3.D). Là rule RIÊNG theo đúng ghi chú đã
    # cắm sẵn ở khối 9 của templates/platform-networkpolicy.yaml: "Nếu sau này
    # có Prometheus thì chiều scrape là một rule MỚI từ namespace monitoring —
    # đừng nới rule này." Nới khối 9 sẽ mở cổng gRPC cho namespace monitoring,
    # tức đổi một chiều quan sát thành một chiều điều khiển.
    #
    # ⛔ VÌ SAO OPT-IN, KHÔNG MẶC ĐỊNH BẬT. Hai cổng mở ở đây phục vụ `/metrics`
    # KHÔNG CÓ AUTHZ — chính là lý do cổng admin 8083 của gateway cố ý không nằm
    # trên Service (xem `gateway.service` ở trên). Bật cờ này khi CHƯA cài stack
    # quan sát nghĩa là mở hai cổng đó cho một namespace chưa tồn tại, mà tên
    # namespace thì ai tạo được namespace cũng chiếm được. Bật đúng lúc chạy
    # infra/host/10-observability.sh, không sớm hơn.
    metricsScrape:
      enabled: false
      # Namespace chạy Prometheus. Ghim theo `kubernetes.io/metadata.name` —
      # nhãn Kubernetes tự đặt, không phụ thuộc người vận hành nhớ gắn.
      #
      # Chủ ý dùng namespaceSelector TRẦN (mọi pod trong namespace này), KHÔNG
      # kèm podSelector của Prometheus: nhãn pod do chart kube-prometheus-stack
      # đặt và đổi theo phiên bản chart, nên ghim vào đó là dựng một chiều sẽ
      # chết trong im lặng ở lần nâng chart kế tiếp. Đánh đổi được chấp nhận vì
      # cả namespace này là thành phần hạ tầng tin cậy (Prometheus, Grafana,
      # Loki, promtail) — nếu sau này có workload không tin cậy vào đây thì
      # đánh đổi ấy hết đúng và phải ghim chặt lại.
      namespace: monitoring

# Tầng cô lập cho namespace chạy pod sandbox sinh viên (P1) — sinh viên có
# root BÊN TRONG pod và là tác nhân CỐ Ý ĐỐI KHÁNG. Namespace này KHÁC
# namespace platform (web/orchestrator/gateway) — orchestrator tạo pod sandbox
# vào đây qua SANDBOX_NAMESPACE (xem orchestrator.env.sandboxNamespace ở
# trên — PHẢI khớp giá trị sandbox.namespace dưới đây, đổi 1 chỗ mà quên chỗ
# kia là vỡ cô lập trong im lặng).
sandbox:
  enabled: true
  namespace: dlp-sandbox

  # RuntimeClass Sysbox — BẮT BUỘC trên mọi pod sandbox, ép qua
  # ValidatingAdmissionPolicy (xem templates/sandbox-admissionpolicy.yaml).
  # Đừng bật sandbox.enabled trên cluster chưa cài RuntimeClass này trước.
  runtimeClassName: sysbox-runc

  # TẮT theo mặc định — bật có ý thức khi bài lab cần internet thật (vd
  # apt-get). Bật KHÔNG mở IMDS/CIDR nội bộ cluster, xem egressExcept.
  allowInternetEgress: false
  # ⛔ DÙNG CHUNG với registryMirror.egressExcept qua YAML anchor: đây là tập
  # CIDR CHỐNG-PIVOT (giữ egress internet không vòng lại vào IMDS/apiserver/
  # pod/node của chính cụm). Hai bản chép rời sẽ trôi khỏi nhau khi CIDR cụm đổi,
  # và bản trôi lệch mở lại đúng đường mà cả hai tồn tại để đóng. Một nguồn.
  egressExcept: &internalPivotCidrs
    - '169.254.0.0/16' # link-local / IMDS cloud — KHÔNG BAO GIỜ bỏ dòng này
    - '10.96.0.0/12' # service CIDR cluster (mặc định kubeadm)
    - '10.244.0.0/16' # pod CIDR cluster (mặc định Calico trên cluster đích)
    - '192.168.0.0/16' # mạng node/VM lab

  # Chặn resource-exhaustion (fork-bomb / spawn hàng loạt pod) từ 1 sinh
  # viên làm sập node. Đây là DEFAULT chung; self-host đè bằng số đo thật.
  #
  # ⛔ TRẦN ĐỒNG THỜI KHÔNG PHẢI `pods:` — nó là số NHỎ NHẤT trong NĂM ràng buộc,
  # và `pods:` gần như không bao giờ là cái nhỏ nhất:
  #     min( requestsCpu    ÷ limitRange.defaultRequestCpu,
  #          requestsMemory ÷ limitRange.defaultRequestMemory,
  #          limitsCpu      ÷ limitRange.defaultCpu,
  #          limitsMemory   ÷ limitRange.defaultMemory,
  #          pods )  −  POOL_TARGET
  # Với số dưới đây + LimitRange (250m/256Mi/2/1Gi):
  #     min(16, 16, 16, 16, 20) − 1 = **15 phiên đồng thời**.
  #
  # ⚠ HAI VẾ `limits*` LÀ CHỖ DỄ QUÊN NHẤT, và quên là tụt trần trong im lặng.
  # `defaultCpu` vừa đổi 1 → 2 (mắt 3 đo được nhu cầu thật ~1.8 core). Giữ
  # `limitsCpu: 8` như cũ sẽ cho 8 ÷ 2 = **4 pod** — trần tụt xuống đúng con số
  # của lab CŨ, trong khi mọi khoá `requests*` trông như đã được nới. Nên mỗi lần
  # đụng `limitRange.default*` PHẢI rà lại cả hai khoá `limits*` ở đây.
  #
  # Sửa `pods:` một mình sẽ KHÔNG nâng được trần — đó chính là bẫy mà mắt 5 của
  # 3.I ghi lại. `infra/k8s/reaper-verify.sh` § `quota_pod_ceiling` tính đúng
  # công thức này từ đối tượng SỐNG; đừng chép cứng con số vào bất kỳ script nào.
  quota:
    pods: '20'
    requestsCpu: '4'
    requestsMemory: '4Gi'
    limitsCpu: '32'
    limitsMemory: '16Gi'

  # Pod sandbox không tự khai resources (orchestrator tạo hộ, sinh viên không
  # viết YAML) — LimitRange ép default để quota ở trên thật sự có hiệu lực.
  #
  # ⛔ MỌI SỐ DƯỚI ĐÂY ĐẾN TỪ PHÉP ĐO Ở CGROUP HOST (P3/3.I mắt 3), KHÔNG TỪ ƯỚC
  # LƯỢNG. Công cụ: `infra/k8s/sandbox_load_probe.py`; tải: trọn bài
  # `dlp-docker-basics` (pull python:3.12-slim + nginx:alpine + docker build).
  # Đổi số ở đây thì phải đo lại, đừng chỉnh cho vừa một mục tiêu trần đồng thời.
  #
  # ── RAM: vì sao 256Mi chứ không phải 512Mi ────────────────────────────────
  # `memory.current` đỉnh đo được là **428–464Mi**, và bản 3.H/mắt 2 suýt lấy
  # chính con số đó làm `requests`. Nhưng `memory.current` GỘP CẢ PAGE CACHE:
  # `docker pull`/`build` ghi hàng trăm MB layer xuống overlay và mọi byte ấy vào
  # cache. Tách ra bằng `memory.stat`:
  #     anon (KHÔNG thu hồi được)          : 121–127Mi
  #     page cache                         : 254–274Mi
  #     workingSet = current − inactive_file: **158–163Mi**   ← số quyết định
  # `workingSet` mới là đại lượng kubelet dùng để xếp hạng eviction và để so với
  # `requests.memory`. Đặt requests theo 512Mi là giữ chỗ cho ~270Mi mà kernel
  # sẵn sàng bỏ đi miễn phí — nó không làm hệ an toàn hơn, chỉ ép trần đồng thời
  # xuống một nửa. 256Mi = đỉnh đo được 163Mi + ~57% dư địa.
  #
  # ── CPU: vì sao limit 2 chứ không phải 1 ──────────────────────────────────
  # Với `defaultCpu: 1` cũ, bài học bị throttle **401/4693 chu kỳ, 19.4s bị giữ
  # lại** — người học chờ một trần nhân tạo. Nới trần rồi đo lại (0 throttle ⇒ số
  # này là NHU CẦU, không phải sàn) cho đỉnh thật theo cửa sổ:
  #     0.2s: 2.23–2.42 core · 1s: 1.76–1.87 · 5s: 1.44–1.57 · 60s: 0.63–0.71
  # `limit 2` phủ đỉnh cửa sổ 1s. KHÔNG đặt 4: một sinh viên build sẽ ăn nửa
  # node 8 core và bỏ đói người khác.
  #
  # ⚠ Bằng chứng chính là **throttle**, KHÔNG phải thời gian tường. Ở trần 1:
  # 401/4693 chu kỳ bị giữ lại; ở trần 4: 0/4562. Thời gian tường có đo được
  # (238s ở trần 1, 195s ở trần 4) nhưng hai lượt ấy chạy trên trạng thái cụm
  # KHÁC nhau, nên đừng trích nó như một phép đo tăng tốc — lượt ở trần 2 sau đó
  # cho 288s với cụm đang bận, và con số ấy KHÔNG có nghĩa là trần 2 chậm hơn
  # trần 1. Chỉ `nr_throttled` là đại lượng so sánh được ở đây.
  #
  # ── requests.cpu 250m: đây là chỗ CỐ Ý overcommit, và khai thẳng ───────────
  # Trung bình cả phiên 0.16–0.22 core; trung bình riêng CỬA SỔ ĐANG LÀM BÀI
  # 0.32–0.47 core. 250m nằm GIỮA hai số đó ⇒ nếu toàn bộ sinh viên build cùng
  # lúc thì họ tranh CPU và build chậm đi. Đó là đánh đổi CÓ CHỦ Ý: CPU quá tải
  # thì DEGRADE (chậm), RAM quá tải thì KILL (OOM) — nên overcommit đặt ở CPU,
  # còn RAM giữ nguyên trần 1Gi/pod.
  limitRange:
    defaultRequestCpu: '250m'
    defaultRequestMemory: '256Mi'
    defaultCpu: '2'
    defaultMemory: '1Gi'
    maxCpu: '2'
    maxMemory: '2Gi'

# ─────────────────────────────────────────────────────────────────────────────
# Registry mirror docker.io trong cụm (P3/3.I mắt 1).
#
# MẶC ĐỊNH TẮT. Bật ở values-selfhost.yaml (lab tự-host, sandbox không có
# internet). Khi bật:
#   · dựng ns `dlp-registry` + registry:2 pull-through proxy docker.io + PVC.
#   · sandbox được mở egress CHỈ tới mirror (netpol, không mở internet).
#   · orchestrator truyền URL mirror xuống pod qua env DLP_REGISTRY_MIRROR;
#     entrypoint sandbox ghi /etc/docker/daemon.json trước khi start dockerd.
#
# ⚠ Phạm vi CHỈ docker.io: dockerd `registry-mirrors` chỉ mirror trong suốt được
# Docker Hub. ghcr/quay/gcr KHÔNG đi qua đây và VẪN bị egress sandbox chặn.
registryMirror:
  enabled: false
  namespace: dlp-registry
  # Image công khai trên Docker Hub — node kéo được (không phải image dlp-* private).
  image: registry:2
  imagePullPolicy: IfNotPresent
  # Upstream DUY NHẤT. Một instance registry:2 proxy đúng một upstream.
  remoteUrl: https://registry-1.docker.io
  service:
    port: 5000
  storage:
    className: local-path
    size: 10Gi
  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      cpu: 500m
      memory: 512Mi
  networkPolicy:
    enabled: true
  # Dải nội bộ giữ trong `except` của egress internet mirror — mirror bị chiếm
  # KHÔNG thành đường vòng vào apiserver/pod/IMDS. Tham chiếu anchor của
  # sandbox.egressExcept (SSOT) để hai tập chống-pivot KHÔNG BAO GIỜ trôi khỏi nhau.
  egressExcept: *internalPivotCidrs

# ─────────────────────────────────────────────────────────────────────────────
# Autoscaling (P3/3.G) — cluster-autoscaler TRUNG LẬP NHÀ CUNG CẤP.
#
# ⛔ MỨC ĐỘ ĐƯỢC CHỨNG MINH: **render + `--dry-run=server` + kubeconform**. Hành
# vi scale KHÔNG được chứng minh, và không thể chứng minh trên lab hiện tại —
# cụm kubeadm 1 node, `cluster.x-k8s.io` và `metrics.k8s.io` đều RỖNG, không
# tầng nào cấp được node. Ràng buộc này §1 của plan đã chốt trước với chủ dự án.
# Đừng đọc sự tồn tại của khối này thành "đã có autoscaling".
#
# ⛔ MẶC ĐỊNH TẮT. Bật là quyết định của người vận hành một cụm có node group
# thật; bật nhầm trên cụm 1 node cho một vòng lặp log lỗi và một autoscaler nhìn
# node control-plane duy nhất như ứng viên scale-down.
autoscaling:
  clusterAutoscaler:
    enabled: false

    # `clusterapi` là provider DUY NHẤT thật sự không khoá nhà cung cấp: cùng bộ
    # CRD chạy trên AWS/GCP/Azure/vSphere/bare-metal. Đặt `aws`/`gce`/`azure`
    # vẫn được, nhưng đó là chọn khoá vào đúng nhà cung cấp ấy.
    cloudProvider: clusterapi

    # Ghim tag, KHÔNG `latest`: autoscaler có quyền xoá node, nên một bản nhảy
    # version sau lưng là thứ cuối cùng ta muốn trong cụm.
    image: registry.k8s.io/autoscaling/cluster-autoscaler:v1.34.1
    imagePullPolicy: IfNotPresent

    # Chuỗi auto-discovery của provider. RỖNG mặc định vì mỗi provider một cú
    # pháp, và một giá trị mặc định sai sẽ "chạy" mà không quản nhóm node nào —
    # đúng kiểu hỏng im lặng mà cả P3 tránh.
    #   clusterapi : 'clusterAPI:namespace=default'
    #   aws        : 'asg:tag=k8s.io/cluster-autoscaler/enabled'
    nodeGroupAutoDiscovery: []

    balanceSimilarNodeGroups: true

    scaleDown:
      # Scale-to-zero off-peak: cần scale-down BẬT, cộng với việc nhóm node khai
      # được min=0 ở tầng provider (với clusterapi là annotation
      # `cluster.x-k8s.io/cluster-api-autoscaler-node-group-min-size: "0"` trên
      # MachineDeployment). Chart này KHÔNG đặt hộ annotation đó — nó nằm ở
      # object của provider, ngoài phạm vi chart.
      enabled: true
      # 10m chứ không mặc định: một buổi học có khoảng nghỉ giữa hai bài, và
      # `unneededTime` ngắn sẽ trả node ngay trước khi cả lớp quay lại — trả rồi
      # xin lại là trả tiền hai lần cho cùng một capacity, cộng thêm một lượt
      # chờ boot node ngay giữa buổi.
      unneededTime: 10m
      delayAfterAdd: 10m

    resources:
      requests:
        cpu: 50m
        memory: 128Mi
      limits:
        cpu: 500m
        memory: 512Mi

    extraArgs: []
