# Template secret khi deploy Helm. KHÔNG chứa giá trị thật.
#
#   cp infra/helm/platform/values-secrets.example.yaml \
#      infra/helm/platform/values-secrets.yaml
#
# `values-secrets.yaml` (không có .example) đã bị .gitignore chặn.
#
# ─────────────────────────────────────────────────────────────────────────────
# ĐỌC PHẦN NÀY TRƯỚC KHI DEPLOY THẬT
#
# File này là đường đi cho DEV/LAB. Với deploy thật, đường đúng là
# `web.env.existingSecret` — Secret tạo ngoài băng, chart không bao giờ chạm vào
# giá trị. Lý do: bất cứ giá trị nào đi qua `-f values-secrets.yaml` hay `--set`
# đều nằm lại trong `helm get values <release>` và trong release Secret của Helm,
# nơi mọi role đọc-được-namespace đều lấy ra được.
#
# Cách dùng existingSecret (xem docs/env/05-helm-secrets-deploy.md):
#
#   kubectl create secret generic dlp-web-prod \
#     --from-literal=BETTER_AUTH_SECRET="$(openssl rand -hex 32)" \
#     --from-literal=GOOGLE_CLIENT_SECRET='...' \
#     --from-literal=MICROSOFT_CLIENT_SECRET='...'
#
#   helm upgrade --install platform infra/helm/platform \
#     --set web.env.existingSecret=dlp-web-prod
#
# Đặt existingSecret thì chart KHÔNG sinh Secret và KHÔNG đòi betterAuthSecret.
# ─────────────────────────────────────────────────────────────────────────────

web:
  env:
    # Secret ký session + JWT. Sinh MỚI cho mỗi môi trường:
    #   openssl rand -hex 32
    # Đổi giá trị này = đăng xuất toàn bộ user đang đăng nhập (mọi session và
    # mọi JWT đã phát đều không verify được nữa). Đó là hành vi đúng khi cần
    # thu hồi khẩn cấp, và là sự cố nếu bạn làm nhầm.
    betterAuthSecret: ''

    # OAuth. 'placeholder' chạy được cho tới khi thật sự cần đăng nhập bằng
    # Google/Microsoft. Lấy giá trị thật: docs/env/02-google-oauth.md và
    # docs/env/03-microsoft-entra.md
    googleClientId: 'placeholder'
    googleClientSecret: 'placeholder'
    microsoftClientId: 'placeholder'
    microsoftClientSecret: 'placeholder'

    # ─────────────────────────────────────────────── URL (không phải secret,
    # nhưng phải khớp nhau, nên để cạnh đây)
    #
    # betterAuthUrl PHẢI khớp CHÍNH XÁC redirect URI đã khai ở Google/Microsoft —
    # lệch một dấu "/" là OAuth trả redirect_uri_mismatch.
    betterAuthUrl: 'https://dlp.example.com'
    appUrl: 'https://dlp.example.com'
    corsAllowedOrigins: 'https://dlp.example.com'

    # Chỉ đặt '1' khi web THẬT SỰ đứng sau proxy set x-forwarded-for đúng
    # (Traefik — P3). Đặt sớm là tự cho phép client giả IP để né rate limit.
    rateLimitTrustProxy: ''

    # Kết nối data store trong cluster (P1). Rỗng = biến bị omit hẳn.
    databaseUrl: ''
    redisUrl: ''
