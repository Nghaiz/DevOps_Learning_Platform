# Dependabot — tự mở PR nâng dependency.
#
# `github-actions` là mục QUAN TRỌNG NHẤT ở đây: workflow ghim action theo SHA
# (xem đầu ci.yml), mà SHA thì con người không tự nhớ nâng được. Dependabot đọc
# comment `# v7.0.1` cạnh SHA để biết version hiện tại và mở PR đổi sang SHA mới
# kèm changelog. Không có nó thì "ghim SHA" đồng nghĩa "đóng băng vĩnh viễn ở
# bản có lỗ bảo mật" — tệ hơn dùng tag di động.
#
# `groups` gộp nhiều bản nâng vào MỘT PR. Không gộp thì mỗi thứ Hai có ~15 PR
# riêng lẻ, và cái giá thật không phải là số PR mà là 15 lần chạy CI đầy đủ.
version: 2

updates:
  # ─────────────────────────────────────────────────────── GitHub Actions
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    groups:
      actions:
        patterns: ['*']
    commit-message:
      prefix: 'ci'

  # ─────────────────────────────────────────────────────────── Node / pnpm
  # directory `/` là đủ cho cả workspace: Dependabot đọc pnpm-lock.yaml ở root,
  # vốn phủ apps/web + packages/*.
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    groups:
      # Tách dev/prod: nâng devDependency (eslint, prettier, vitest) rủi ro thấp,
      # gộp một PR merge nhanh được. Dependency runtime (next, better-auth,
      # drizzle) phải xem từng cái — chúng chạm vào đường xác thực và DB.
      #
      # `update-types` CHỈ minor+patch — thiếu dòng này là bài học có thật: PR #7
      # gộp TypeScript 5→7, ESLint 9→10, vitest 3→4, @types/node 24→26 vào MỘT PR
      # và nó đỏ ngay ("typescript-eslint does not support TS 7.0"). Một PR gộp
      # nhiều major thì không tách ra được: hoặc merge cả cụm, hoặc bỏ cả cụm.
      # Major giờ đi riêng từng PR để đánh giá và revert được từng cái.
      dev-dependencies:
        dependency-type: development
        patterns: ['*']
        update-types: ['minor', 'patch']
    ignore:
      # Next major cần đọc migration guide và chạm nhiều file — nâng có kế hoạch,
      # không phải qua PR tự động lúc 3 giờ sáng.
      - dependency-name: 'next'
        update-types: ['version-update:semver-major']
      - dependency-name: 'react'
        update-types: ['version-update:semver-major']
      - dependency-name: 'react-dom'
        update-types: ['version-update:semver-major']
    commit-message:
      prefix: 'chore'

  # ────────────────────────────────────────────────────────────────── Go
  # Mỗi module trong go.work là một entry riêng — Dependabot không tự đi theo
  # go.work. THÊM MODULE MỚI VÀO go.work thì phải thêm một khối ở đây.
  - package-ecosystem: gomod
    directories:
      - /services/orchestrator
      - /services/terminal-gateway
      - /services/shared
      - /proto/gen/go
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    groups:
      go-modules:
        patterns: ['*']
    commit-message:
      prefix: 'chore'

  # ────────────────────────────────────────────────────────────── Docker
  - package-ecosystem: docker
    directories:
      - /apps/web
      - /services/orchestrator
      - /services/terminal-gateway
      - /images/sandbox-base
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 4
    groups:
      base-images:
        patterns: ['*']
    ignore:
      # Node phải BÁM DÒNG LTS. Dependabot đề xuất `node:25-alpine` (PR #5) —
      # bản lẻ là "Current", chỉ được hỗ trợ ~6 tháng và không bao giờ thành LTS.
      # Đưa image production sang đó là tự chuốc một lần nâng gấp giữa kỳ. Chờ
      # Node 26 LTS rồi nâng có kế hoạch (và nâng cùng `engines` trong
      # package.json + `node-version` trong CI, ba chỗ phải khớp).
      - dependency-name: 'node'
        update-types: ['version-update:semver-major']
    commit-message:
      prefix: 'chore'
