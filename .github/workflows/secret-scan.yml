# Quét secret — TÁCH KHỎI ci.yml khi CI bị tạm dừng (2026-09-04).
#
# VÌ SAO CÁI NÀY KHÔNG ĐƯỢC TẮT CÙNG PHẦN CÒN LẠI: bảy cổng kia gác những thứ
# hỏng-thì-sửa-được-sau (kiểu, test, build, lint). Cổng này gác thứ DUY NHẤT mà
# bật lại CI ở phase 14 không cứu được — một secret đã nằm trong lịch sử git thì
# phải xoay khoá và rewrite history, không phải chạy lại một job.
#
# Nó KHÔNG gác gì cả: branch protection đã gỡ, nên job này chỉ BÁO, không chặn
# push. Đúng ý "không chờ đợi gì nữa" — nhưng vẫn có người canh cửa đó.
#
# BẬT LẠI CI ĐẦY ĐỦ: xem `docs/ci-paused.md`. Lúc đó XOÁ file này (job gitleaks
# gốc vẫn còn nguyên trong ci.yml, chạy lại là có hai lượt quét trùng).
name: Secret scan

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: secret-scan-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  secret-scan:
    name: Secret scan (gitleaks)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # pull-requests: read là BẮT BUỘC — trên event pull_request, gitleaks-action
    # chạy nhánh ScanPullRequest và gọi GET /repos/.../pulls/{n}/commits. Thiếu
    # quyền ⇒ 403 "Resource not accessible by integration", đỏ TRƯỚC khi quét
    # được dòng nào (đã lộ ra ở PR #1). contents: read khai tường minh vì khai
    # `permissions:` là đè TOÀN BỘ mặc định.
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # gitleaks quét lịch sử commit trong run — cần full history, không thì
          # default depth=1 bỏ lọt mọi commit trừ cái cuối.
          fetch-depth: 0

      # v3 (không phải v2): v2 chạy trên runtime Node 20, thứ GitHub đã gỡ khỏi
      # runner từ 2026-09-16. v3 chỉ đổi runtime sang Node 24.
      - uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
