# Quét secret trên NHỪNG NHÁNH MÀ `ci.yml` KHÔNG VỚI TỚI.
#
# Tách khỏi `ci.yml` ngày 2026-09-04 khi CI bị tạm dừng. Chú thích cũ ở đây dặn
# "bật lại CI đầy đủ thì XOÁ file này". CI đã bật lại ngày 2026-09-14 và file này
# Ở LẠI — vì chỉ dẫn đó TỰ MÂU THUẬN với chính lý lẽ của nó.
#
# Lý lẽ đó: cổng này gác thứ DUY NHẤT mà chạy lại một job sau đó không cứu được
# — một secret đã nằm trong lịch sử git trên remote thì phải xoay khoá và rewrite
# history. Nhưng `ci.yml` chỉ nghe `push` trên `main` + tag `v*`. Xoá file này là
# mất đúng vùng nguy hiểm nhất: **push lên một nhánh feature chưa mở PR**. Secret đã
# lên remote là đã vào lịch sử; bắt muộn ở PR-time không hoàn tác được gì.
#
# Nói thẳng một điều cho đủ trung thực: thiết kế TRƯỚC lúc tạm dừng cũng có đúng
# lỗ này, nên giữ file là **vá một lỗ cũ** chứ không phải tránh một lỗ mới.
#
# PHẠM VI SAU KHI CI BẬT LẠI — chia việc, không chồng nhau:
#   file này  : push lên MỌI nhánh TRỪ `main`
#   ci.yml    : pull_request, và push lên `main` + tag `v*`
# Bỏ `pull_request:` ở đây còn một lý do thứ hai: hai workflow cùng sinh ra check
# **trùng TÊN** trên PR, mà branch protection khớp required-check theo tên.
#
# Hệ quả đã đo: trước khi thu hẹp, mỗi commit trên PR chạy gitleaks **3 lượt**
# (push + pull_request của file này, cộng pull_request của ci.yml). Nay còn 2.
name: Secret scan

on:
  push:
    branches-ignore: [main]

permissions:
  contents: read

concurrency:
  group: secret-scan-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  secret-scan:
    name: Secret scan (gitleaks)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # pull-requests: read là BẮT BUỘC — trên event pull_request, gitleaks-action
    # chạy nhánh ScanPullRequest và gọi GET /repos/.../pulls/{n}/commits. Thiếu
    # quyền ⇒ 403 "Resource not accessible by integration", đỏ TRƯỚC khi quét
    # được dòng nào (đã lộ ra ở PR #1). contents: read khai tường minh vì khai
    # `permissions:` là đè TOÀN BỘ mặc định.
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # gitleaks quét lịch sử commit trong run — cần full history, không thì
          # default depth=1 bỏ lọt mọi commit trừ cái cuối.
          fetch-depth: 0

      # v3 (không phải v2): v2 chạy trên runtime Node 20, thứ GitHub đã gỡ khỏi
      # runner từ 2026-09-16. v3 chỉ đổi runtime sang Node 24.
      - uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
