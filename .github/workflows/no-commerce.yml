# Cổng cấm thương mại — TÁCH KHỎI ci.yml khi CI bị tạm dừng (2026-09-04).
#
# VÌ SAO CÁI NÀY CHẠY TRONG LÚC CI TẮT: `docs/ci-paused.md` đặt tiêu chí giữ-chạy
# là "thứ mà bật lại CI ở phase 14 không cứu được", và theo tiêu chí đó thì cổng
# này KHÔNG đạt — một chuỗi giá lọt vào repo thì xoá được, khác hẳn secret đã vào
# lịch sử git.
#
# Nó ở đây vì một lý do khác, do chủ dự án quyết (2026-09-06): "hệ thống không có
# liên quan gì tới bán khoá học" là ràng buộc SẢN PHẨM, đã phải nhắc hai lần sau
# khi thấy chuỗi price/billing/subscribe lọt vào việc đang làm. Thứ đã trượt một
# lần thì không nên chỉ dựa vào trí nhớ để giữ. Cái giá là ~20s mỗi push.
#
# Rẻ đúng nghĩa: `scripts/check-no-commerce.mjs` là Node thuần, không phụ thuộc,
# nên job này KHÔNG cần `pnpm install` — chỉ checkout + chạy.
#
# ⚠ BẬT LẠI CI ĐẦY ĐỦ: xem `docs/ci-paused.md`. Lúc đó **XOÁ file này** — job
# `no-commerce` vẫn còn nguyên trong `ci.yml` (và nằm trong `ci-ok.needs`), nên
# giữ cả hai là chạy trùng hai lượt. Đây là bản sao tạm, không phải chỗ ở lâu dài.
#
# Cổng này chỉ BÁO, không chặn: branch protection đã gỡ cùng lúc CI tạm dừng.
name: No commerce

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: no-commerce-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  no-commerce:
    name: Không có chuỗi giá / gói cước / thanh toán
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        # KHÔNG cần fetch-depth: 0. Khác gitleaks (quét LỊCH SỬ), cổng này quét
        # CÂY LÀM VIỆC hiện tại — câu hỏi nó trả lời là "bản này có chuỗi cấm
        # không", không phải "đã từng có chưa".

      # Script tự chạy đối chứng dương TRƯỚC mỗi lượt quét (18 mẫu bẩn phải bị
      # bắt, 31 mẫu sạch không được kêu) và `exit 2` nếu đối chứng hỏng — nên một
      # lượt xanh ở đây không thể là lượt "cổng đã hỏng nhưng cây sạch".
      - name: Cổng cấm thương mại
        run: node scripts/check-no-commerce.mjs
