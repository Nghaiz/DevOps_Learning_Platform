# CI xanh mới merge. Sáu cổng chạy SONG SONG, gom về một check duy nhất `ci-ok`:
#
#   proto ─┐
#   ts     ├─► ci-ok ─► images (chỉ push main / tag v*)
#   go     │
#   infra  │
#   secret-scan ┘
#   dependency-review (chỉ PR)
#
# VÌ SAO MỘT FILE: `images: needs: ci-ok` là phụ thuộc job THẬT trong cùng
# workflow run. Tách sang file khác thì phải đi đường workflow_run, vốn phải chạy
# lại toàn bộ cổng một lần nữa mới gate được.
#
# VÌ SAO `ci-ok`: branch protection chỉ nhận tên check cố định. Khai 6 job làm 6
# required check nghĩa là mỗi lần thêm/đổi tên job phải vào Settings sửa tay và
# quên là mất cổng trong im lặng. `ci-ok` là một cái tên, không bao giờ đổi.
#
# MỌI ACTION GHIM THEO SHA, không phải tag. `@v7` là tag DI ĐỘNG — chủ action trỏ
# lại vào commit khác lúc nào cũng được, và đó chính xác là đường đi của vụ
# tj-actions/changed-files (2025). Dependabot nâng SHA giúp (.github/dependabot.yml).
name: CI

on:
  # KHÔNG để `push:` trần: với branch nằm trong chính repo này, GitHub bắn CẢ
  # `push` LẪN `pull_request` ⇒ mọi PR chạy CI hai lần, tốn đôi số phút runner.
  # Giới hạn push về main + tag (nơi không có PR nào bắn thay).
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

# Least privilege cấp workflow: mặc định của GITHUB_TOKEN rộng hơn nhiều thứ CI
# này cần. Job nào cần hơn thì tự khai thêm (images: packages:write, ...).
permissions:
  contents: read

# Huỷ run cũ khi có push mới trên cùng branch/PR — khỏi tốn phút chờ một run đã
# lỗi thời. TRỪ main: cancel giữa chừng job `images` đang push là để lại tag
# `latest` nửa vời trên registry; run trên main chạy trọn.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  # ────────────────────────────────────────────────────────── contract (proto)
  proto:
    name: Contract (buf)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # fetch-depth: 0 cho `make proto-breaking` — baseline của buf là một git
          # ref (`.git#branch=main` / `.git#ref=HEAD~1`), shallow clone mặc định
          # (depth 1) không có ref đó nên buf fail bằng lỗi git khó hiểu.
          fetch-depth: 0

      - uses: bufbuild/buf-setup-action@a47c93e0b1648d5651a065437926377d060baa99 # v1.50.0
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          # PIN BẮT BUỘC — không truyền version thì action dùng DEFAULT NƯỚNG
          # CỨNG trong chính nó (không phải latest). buf 1.50 sinh session_pb.ts
          # khác byte với buf 1.72 (máy dev + docker) → proto-check đỏ oan
          # (run 31245094744). Cùng nguyên tắc pin 3 remote plugin trong buf.gen.yaml.
          version: 1.72.0

      # Job này KHÔNG cần node/pnpm: buf.gen.yaml dùng toàn REMOTE plugin
      # (buf.build/...), codegen chạy trên hạ tầng buf chứ không phải runner.
      - name: Lint contract
        run: make proto-lint

      - name: Drift gate (buf generate + git status)
        run: make proto-check

      - name: 'Nạp baseline main (chỉ khi KHÔNG ở trên main)'
        # `fetch-depth: 0` tải đủ lịch sử NHƯNG không tạo local branch `main`:
        # trên PR, checkout để HEAD detached ở merge commit và refspec của nó chỉ
        # phủ ref đang checkout. buf resolve `branch=main` bằng cách clone local
        # .git ⇒ "fatal: couldn't find remote ref main" (đã dính thật, PR #1).
        # An toàn vì nhánh này chỉ chạy khi KHÔNG ở trên main — fetch vào branch
        # đang checkout là lỗi cứng của git.
        if: github.ref != 'refs/heads/main'
        run: git fetch --no-tags origin '+refs/heads/main:refs/heads/main'

      - name: Breaking gate (buf breaking)
        # Baseline theo VỊ TRÍ, không theo loại event:
        #   - đang ở trên main: so với main là tự so với chính mình ⇒ LUÔN xanh,
        #     cổng giả. Dùng HEAD~1.
        #   - mọi chỗ khác (PR, nhánh feature): so với main → bắt breaking change
        #     của CẢ nhánh, không chỉ commit cuối.
        env:
          BUF_BREAKING_AGAINST: >-
            ${{ github.ref == 'refs/heads/main' && '.git#ref=HEAD~1' || '.git#branch=main' }}
        run: make proto-breaking

  # ──────────────────────────────────────────────────────────────── TypeScript
  ts:
    name: TypeScript (lint + build + test)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        # Giá trị khớp .github/ci.env — credential GIẢ, sống vài phút trong runner.
        image: postgres:16-alpine
        env:
          POSTGRES_USER: dlp
          POSTGRES_PASSWORD: ci-only-password
          POSTGRES_DB: dlp
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U dlp -d dlp"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      # KHÔNG khai redis ở đây: cú pháp `services:` chỉ nhận docker-create flags
      # qua `options`, không có chỗ đè CMD của container — mà `--requirepass` là
      # CMD arg của redis-server, không phải env (image redis chính chủ không đọc
      # env mật khẩu như bitnami/redis). Nên `docker run` thủ công ở bước dưới.
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24

      # SSOT env của CI. Trước đây 11 dòng này nằm inline trong workflow và phải
      # tự khớp bằng tay với `services:` ở trên, với lệnh docker run Redis, và
      # với turbo.json tasks.test.env. Giờ một file, và `env-check` ép nó đủ.
      - name: 'Nạp .github/ci.env vào môi trường job'
        run: grep -E '^[A-Z][A-Z0-9_]*=' .github/ci.env >> "$GITHUB_ENV"

      # Chạy TRƯỚC pnpm install: chỉ cần node stdlib, nên fail sớm trong ~5s thay
      # vì sau 60s cài dependency.
      - name: Env drift gate
        run: node scripts/env-check.mjs

      - name: 'Start Redis (requirepass — services: không cho đặt CMD)'
        run: |
          docker run -d --name ci-redis -p 6379:6379 redis:7-alpine \
            redis-server --requirepass "$REDIS_PASSWORD"
          # Loop chờ PHẢI kết thúc bằng fail tường minh — for hết vòng mà rơi
          # xuyên qua im lặng thì lỗi Redis lộ ra sau đó thành test fail khó hiểu.
          ok=""
          for _ in $(seq 1 30); do
            if docker exec ci-redis redis-cli -a "$REDIS_PASSWORD" ping 2>/dev/null | grep -q PONG; then
              ok=1; break
            fi
            sleep 1
          done
          if [ -z "$ok" ]; then
            echo "Redis không PONG sau 30s"; docker logs ci-redis; exit 1
          fi

      # KHÔNG khai `version:` — root package.json đã có `packageManager:
      # pnpm@11.10.0` (SSOT); action-setup coi khai cả hai nơi là LỖI CỨNG
      # ("Multiple versions of pnpm specified"), không phải cảnh báo.
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10

      - name: 'Bật cache pnpm (sau action-setup — cần pnpm trên PATH)'
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: pnpm

      - name: pnpm install
        run: pnpm install --frozen-lockfile

      # CỐ Ý CHƯA CÓ cổng `pnpm format:check`. Nó hiện đỏ trên main ở 15 file có
      # từ trước — bật lên bây giờ nghĩa là hoặc CI đỏ ngay, hoặc phải nhét một
      # diff thuần-format vào giữa code auth/security. Bật sau, ở một commit
      # riêng chỉ làm đúng việc `pnpm format`.

      - name: DB migrate (Drizzle)
        run: pnpm --filter @devops-platform/web db:migrate

      # `typecheck` phải có mặt tường minh: từ khi alias TS6/TS7, `next build`
      # của apps/web type-check bằng JS API (shim TS6) — chỉ `tsc --noEmit` (TS7)
      # mới là cổng typecheck thật. Thiếu nó thì diff chẩn đoán chỉ-có-ở-TS7
      # merge xanh mà không ai thấy (đúng rủi ro "hai nguồn chẩn đoán" của D5).
      - name: lint + typecheck + build + test (turbo)
        run: pnpm turbo run lint typecheck build test

  # ──────────────────────────────────────────────────────────────────────── Go
  go:
    name: Go (build + vet + test + lint + vuln)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # Redis THẬT cho test warm-pool claim. Không có nó thì `internal/pool` tự
    # skip (theo thiết kế: miniredis hỗ trợ Lua không đầy đủ nên chạy ở đó là
    # guard giả) — và một HARD-GATE bị skip mọi lần chạy là một HARD-GATE
    # không gác gì. Test tự dùng DB 15 + FLUSHDB nên container này dùng xong bỏ.
    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.work
          # go.work ở root không có go.mod cạnh bên — chỉ cho cache key vào go.sum
          # của từng module, không thì setup-go warn "go.mod not found".
          cache-dependency-path: '**/go.sum'

      - name: build + vet + test (mọi module trong go.work)
        env:
          # DB 15: test FLUSHDB, và service container này chỉ phục vụ CI nên
          # không có gì để mất — nhưng giữ đúng DB mà test dùng ở local để
          # hành vi hai nơi giống hệt nhau.
          REDIS_URL: redis://127.0.0.1:6379/15
        run: go work sync && make go-build go-vet go-test

      # Test đua của warm-pool chỉ có nghĩa khi lặp: race hiện theo xác suất,
      # một lượt xanh không chứng minh gì. -count=20 là tiêu chí xanh của
      # HARD-GATE 1.A-2 (phase-1.md) — chạy nó ở CI để nó gác được mọi PR chạm
      # claim.lua, chứ không chỉ gác đúng lần spike.
      - name: Test đua warm-pool claim (-race -count=20, Redis thật)
        env:
          REDIS_URL: redis://127.0.0.1:6379/15
        working-directory: services/orchestrator
        # `go test` trả exit 0 khi MỌI test đều SKIP, nên "job xanh" một mình
        # không chứng minh gì: gỡ Redis service ra thì suite này skip sạch và CI
        # vẫn xanh — đúng cái bẫy mà comment ở services block cảnh báo. Đọc
        # -json và ĐỎ nếu thấy bất kỳ action "skip" nào.
        run: |
          set -o pipefail
          go test ./internal/pool/... -race -count=20 -json | tee /tmp/pool-test.json
          if grep -q '"Action":"skip"' /tmp/pool-test.json; then
            echo "::error::Test warm-pool bị SKIP — Redis service không tới được. HARD-GATE 1.A-2 không gác gì trong lần chạy này."
            exit 1
          fi
          grep -c '"Action":"pass"' /tmp/pool-test.json

      - name: Cài golangci-lint v2.x
        # `go install` thay vì install.sh: script trên master mang bảng checksum
        # của bộ version HIỆN TẠI của nó — cài version pin cũ hơn là mismatch
        # ("hash_sha256_verify did not verify", run 31245533716). go install build
        # từ source, toàn vẹn do Go checksum DB đảm bảo, không script lạ.
        run: |
          go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@v2.12.2
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"

      - name: golangci-lint (mọi module)
        run: make go-lint

      - name: govulncheck (mọi module)
        # Đối chiếu dependency Go với Go vulnerability DB. Khác Dependabot ở chỗ
        # nó phân tích REACHABILITY — chỉ báo khi code thật sự gọi tới hàm dính
        # lỗi, nên gần như không có nhiễu để phải bỏ qua.
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@v1.1.4
          for dir in $(go list -m -f '{{.Dir}}'); do
            echo "--- govulncheck $dir"
            (cd "$dir" && govulncheck ./...) || exit 1
          done

  # ───────────────────────────────────────────────────── hạ tầng (Helm + shell)
  infra:
    name: Infra (helm + kubeconform + shellcheck + actionlint)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
        with:
          version: v3.20.0

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.work
          cache-dependency-path: '**/go.sum'

      - name: helm lint (3 bộ values)
        # betterAuthSecret + 2 mật khẩu datastore là `required` trong chart —
        # không truyền thì template dừng. Giá trị dưới đây là rác dùng một lần
        # trong runner.
        #
        # values-selfhost.yaml bật `datastore.enabled: true` từ P1 (1.B0.2), nên
        # thiếu hai --set datastore.* là job này đỏ ở ĐÚNG bộ values đó — trong
        # khi `helm upgrade` thủ công (luôn có --set) vẫn xanh. Đây chính là loại
        # "cổng chưa từng được chạy trên đường CI" mà repo này đã dính một lần.
        run: |
          for f in values.yaml values-selfhost.yaml values-cloud.yaml; do
            echo "--- helm lint -f $f"
            helm lint infra/helm/platform \
              -f "infra/helm/platform/$f" \
              --set web.env.betterAuthSecret=ci-only-not-a-real-secret \
              --set datastore.postgres.password=ci-only-not-a-real-password \
              --set datastore.redis.password=ci-only-not-a-real-password || exit 1
          done

      - name: 'helm template + kubeconform (manifest có hợp lệ với API k8s không)'
        run: |
          go install github.com/yannh/kubeconform/cmd/kubeconform@v0.8.0
          for f in values.yaml values-selfhost.yaml values-cloud.yaml; do
            echo "--- kubeconform -f $f"
            helm template platform infra/helm/platform \
              -f "infra/helm/platform/$f" \
              --set web.env.betterAuthSecret=ci-only-not-a-real-secret \
              --set datastore.postgres.password=ci-only-not-a-real-password \
              --set datastore.redis.password=ci-only-not-a-real-password \
            | "$(go env GOPATH)/bin/kubeconform" -strict -summary \
                -ignore-missing-schemas || exit 1
          done

      - name: 'helm template — nhánh ingress bật (chưa bộ values nào bật)'
        # Ingress mặc định TẮT ở cả 3 bộ values, nên không có bước nào ở trên
        # từng render template đó. Không test thì lỗi cú pháp trong ingress.yaml
        # chỉ lộ vào đúng hôm bật ingress trên prod.
        run: |
          helm template platform infra/helm/platform \
            --set web.env.betterAuthSecret=ci-only-not-a-real-secret \
            --set ingress.enabled=true \
            --set ingress.className=traefik \
            --set ingress.host=dlp.example.com \
          | "$(go env GOPATH)/bin/kubeconform" -strict -summary \
              -ignore-missing-schemas

      - name: 'helm template — nhánh existingSecret (đường đi của prod)'
        # Nhánh này KHÔNG được đòi betterAuthSecret và KHÔNG được sinh Secret.
        # Không test thì logic `if not existingSecret` trong web-secret.yaml chỉ
        # được chạy lần đầu vào đúng hôm deploy prod.
        run: |
          out=$(helm template platform infra/helm/platform \
            --set web.env.existingSecret=dlp-web-prod)
          if printf '%s' "$out" | grep -q 'kind: Secret'; then
            echo "existingSecret đã set mà chart vẫn sinh Secret — sai"; exit 1
          fi
          printf '%s' "$out" | grep -q 'name: dlp-web-prod' \
            || { echo "pod không tham chiếu Secret có sẵn"; exit 1; }

      - name: shellcheck (infra/host/*.sh)
        uses: ludeeus/action-shellcheck@00cae500b08a931fb5698e11e79bfbd38e612a38 # 2.0.0
        with:
          scandir: ./infra/host
          # `error` là NGƯỠNG KHỞI ĐẦU, không phải đích. Mặc định của action fail
          # ở cả mức `note`, và 10 script hiện có sinh 16 phát hiện — đưa linter
          # vào codebase sẵn có ở ngưỡng đó thì hoặc phải viết lại script đang
          # chạy tốt, hoặc rắc `# shellcheck disable` khắp nơi. Cả hai đều tệ hơn
          # là bắt đầu ở lớp lỗi thật rồi siết dần.
          #
          # NỢ ĐÃ BIẾT, siết `warning` là phải trả (đừng siết mà không sửa trước):
          #   - SC2034 bench-sandbox-provision.sh:97 — `T_ALL_READY` đo mốc "mọi
          #     pod Ready" rồi KHÔNG in ra đâu cả (bảng tổng kết chỉ dùng T_ALL).
          #     Là số đo bị mất, không phải rác vô hại.
          #   - 15 × SC2015 (`A && B || C` không phải if-then-else) + SC2016,
          #     đều mức `note`.
          severity: error

      - name: actionlint (chính các workflow này)
        # Bắt lỗi cú pháp expression, tên context sai, và (nhờ shellcheck có sẵn
        # trên runner) cả lỗi shell trong khối `run:` — lớp lỗi mà cách duy nhất
        # khác để phát hiện là push lên rồi xem nó đỏ.
        run: |
          go install github.com/rhysd/actionlint/cmd/actionlint@v1.7.12
          "$(go env GOPATH)/bin/actionlint" -color

  # ──────────────────────────────────────────────────────────────── secret scan
  secret-scan:
    name: Secret scan (gitleaks)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # pull-requests: read là BẮT BUỘC — trên event pull_request, gitleaks-action
    # chạy nhánh ScanPullRequest và gọi GET /repos/.../pulls/{n}/commits để lấy
    # danh sách commit cần quét. Thiếu quyền ⇒ 403 "Resource not accessible by
    # integration" và job đỏ TRƯỚC KHI quét được dòng nào (lộ ra ở PR #1).
    # contents: read khai tường minh: khai `permissions:` là đè TOÀN BỘ mặc định,
    # bỏ dòng này thì chính actions/checkout mất quyền đọc repo.
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # gitleaks quét lịch sử commit trong run — cần full history, không thì
          # default depth=1 bỏ lọt mọi commit trừ cái cuối.
          fetch-depth: 0

      # v3 (không phải v2): v2 chạy trên runtime Node 20, thứ GitHub đã gỡ khỏi
      # runner từ 2026-09-16 và từ 2026-06-02 đã cần cờ opt-out mới chạy. v3 chỉ
      # đổi runtime sang Node 24, không đổi input/output/hành vi.
      - uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # KHÔNG có job `dependency-review`. Bản đầu có, và nó đỏ ngay lần chạy đầu:
  # "Dependency review is not supported on this repository." Action đó cần
  # GitHub Advanced Security khi repo là PRIVATE (repo này private) — GHAS là
  # tính năng trả phí. Giữ lại chỉ tạo một job đỏ vĩnh viễn, và một cổng luôn đỏ
  # là cổng bị bỏ qua. Phần lớn giá trị của nó đã có ở nơi khác: Dependabot
  # alerts (cảnh báo CVE trong dependency) + govulncheck (Go, có reachability) +
  # Trivy (image). Khi nào repo thành public thì thêm lại.
  #
  # ──────────────────────────────────────────── build thử image sandbox ở PR-time
  #
  # Job `images` bên dưới CHỈ chạy trên `main`, nên tới 1.E-1 thì `images/sandbox-base/
  # Dockerfile` là file DUY NHẤT không có cổng nào ở PR. Lúc nó còn là placeholder
  # 3 dòng thì vô hại; giờ nó có một layer apt, HAI lượt tải mạng và HAI cổng
  # checksum, tức là đã có thứ để hỏng.
  #
  # Chế độ hỏng cụ thể được chặn ở đây: một PR nâng `OMP_VERSION`/`FASTFETCH_VERSION`
  # mà quên cập nhật digest ⇒ `sha256sum -c` đỏ. Không có job này thì `ci-ok` vẫn
  # XANH ở PR (job `images` bị skip), merge xong main mới đỏ — và vì `images` đỏ
  # nên KHÔNG có tag `sha-<short>` nào cho `dlp-sandbox-base`. Cộng với việc chart
  # nay ghép sandboxImage từ `image.tag`, lần deploy kế tiếp sẽ trỏ vào một tag
  # không bao giờ tồn tại ⇒ warm-pool ImagePullBackOff.
  #
  # KHÔNG dùng `paths:` (rules/ci-cd-trigger-design.md #3 — required check bị skip
  # vì paths sẽ treo ở "Expected — Waiting" vĩnh viễn). Build luôn, và cache gha
  # dùng chung scope với job `images` nên lần chạy sau gần như tức thì.
  sandbox-image:
    name: 'Build thử: sandbox-base'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      - name: 'Build (KHÔNG push) — cổng checksum + layer apt'
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: images/sandbox-base
          file: images/sandbox-base/Dockerfile
          push: false
          load: true
          tags: dlp-sandbox-base:pr
          cache-from: type=gha,scope=sandbox-base
          # KHÔNG `cache-to`: job này chạy trên mọi PR, để nó ghi cache sẽ đẩy
          # văng cache của `images` (giới hạn 10 GB/repo của GitHub).

      - name: 'Smoke: 10 binary của AC + PID 1 + locale'
        run: |
          set -euo pipefail
          missing=0
          for b in zsh tmux git jq fzf zoxide fastfetch eza bat oh-my-posh vi; do
            if ! docker run --rm --entrypoint /bin/bash dlp-sandbox-base:pr -c "command -v $b >/dev/null"; then
              echo "::error::thiếu binary trong image: $b"; missing=1
            fi
          done
          [ "$missing" -eq 0 ] || exit 1

          # PID 1 phải SỐNG. podspec.go không đặt Command/Args và dùng
          # RestartPolicy=Never, nên một CMD thoát ngay sẽ biến mọi pod warm-pool
          # thành xác mà `pool:free` vẫn đếm là ấm. Đây là cổng rẻ nhất cho nó.
          cid=$(docker run -d dlp-sandbox-base:pr)
          sleep 5
          state=$(docker inspect -f '{{.State.Status}}' "$cid")
          docker rm -f "$cid" >/dev/null
          [ "$state" = "running" ] || { echo "::error::PID 1 chết sau 5s (state=$state)"; exit 1; }

          got=$(docker run --rm --entrypoint /bin/zsh dlp-sandbox-base:pr -lic 'echo $COLORTERM')
          [ "$got" = "truecolor" ] || { echo "::error::COLORTERM=$got, muốn truecolor"; exit 1; }
          echo "smoke đạt."

      - name: 'Trivy — CỔNG CHẶN ở CRITICAL (trước khi vào main)'
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: dlp-sandbox-base:pr
          format: table
          exit-code: '1'
          severity: 'CRITICAL'

  # ─────────────────────────────────────────────── cổng tổng hợp (required check)
  ci-ok:
    name: ci-ok
    # `always()` để job vẫn chạy KHI CÓ need thất bại/bị skip — nếu không, nó bị
    # skip theo và branch protection thấy một check "chưa chạy", treo PR mãi mãi.
    if: always()
    needs: [proto, ts, go, infra, secret-scan, sandbox-image]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: 'Mọi cổng phải success (hoặc skipped hợp lệ)'
        # BẪY KINH ĐIỂN: `if: always()` mà không kiểm results thì job này LUÔN
        # xanh và cổng tổng hợp trở thành cổng giả — tệ hơn không có cổng, vì
        # nhìn thì tưởng có.
        #
        # 'skipped' được CHẤP NHẬN vì một job có `if:` không khớp là ý đồ, không
        # phải lỗi. ĐÁNH ĐỔI đã biết: một job bị skip NGOÀI Ý MUỐN (vd điều kiện
        # `if` viết sai) sẽ lọt qua cổng này. Đổi lấy việc không phải sửa danh
        # sách needs mỗi lần thêm một job chạy có điều kiện.
        # 'failure' và 'cancelled' thì không bao giờ được chấp nhận.
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "kết quả các cổng: $RESULTS"
          for r in $RESULTS; do
            case "$r" in
              success|skipped) ;;
              *) echo "::error::có cổng không đạt (trạng thái: $r)"; exit 1 ;;
            esac
          done
          echo "tất cả cổng đạt."

  # ──────────────────────────────────────────────────────────── build & push img
  images:
    name: 'Build & push: ${{ matrix.name }}'
    needs: ci-ok
    # Chỉ build/push khi mọi cổng xanh VÀ đang ở push main hoặc tag v* — PR không
    # cần tốn phút build 4 image.
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
      # build-push-action ký provenance/SBOM bằng OIDC token của run.
      # KHÔNG có `security-events: write` — Trivy nay in ra log, không nộp SARIF.
      id-token: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: web
            image: dlp-web
            dockerfile: apps/web/Dockerfile
            context: .
          # Image RIÊNG cho migration Drizzle — xem stage `migrator` trong
          # apps/web/Dockerfile để biết vì sao không gộp vào image runtime.
          - name: migrator
            image: dlp-migrator
            dockerfile: apps/web/Dockerfile
            context: .
            target: migrator
          - name: orchestrator
            image: dlp-orchestrator
            dockerfile: services/orchestrator/Dockerfile
            context: .
          - name: terminal-gateway
            image: dlp-terminal-gateway
            dockerfile: services/terminal-gateway/Dockerfile
            context: .
          - name: sandbox-base
            image: dlp-sandbox-base
            dockerfile: images/sandbox-base/Dockerfile
            context: images/sandbox-base
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: 'Metadata (tag sha-<ngắn> + latest trên main)'
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          # Owner GHCR bắt buộc lowercase — khớp infra/helm/platform/values.yaml.
          # `dev` (tag local dùng trong values.yaml) KHÔNG sinh ở đây — CI đóng
          # tag theo sha ngắn + latest trên main, `dev` chỉ để build tay ở máy dev.
          images: ghcr.io/nghaiz/${{ matrix.image }}
          tags: |
            type=sha,prefix=sha-,format=short
            type=raw,value=latest,enable={{is_default_branch}}

      - id: build
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          # Rỗng với mọi hàng trừ `migrator` — buildx hiểu chuỗi rỗng là "dùng
          # stage cuối", đúng hành vi cũ của bốn hàng còn lại.
          target: ${{ matrix.target }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # Cache layer giữa các run — không có nó thì mỗi lần push main là build
          # lại `pnpm install` + `next build` từ số 0.
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,scope=${{ matrix.name }},mode=max
          # SBOM + provenance (SLSA) đính kèm image: trả lời được "image này chứa
          # package gì, sinh ra từ commit nào, bằng workflow nào" mà không phải
          # tin vào trí nhớ. Bắt buộc khi tới lúc phải rà một CVE mới công bố.
          sbom: true
          provenance: mode=max

      # HAI bước Trivy, có chủ ý — một để ĐỌC, một để CHẶN.
      #
      # Gộp làm một thì phải chọn: `severity: CRITICAL` là mất hẳn danh sách HIGH
      # khỏi log, còn `severity: HIGH,CRITICAL` + `exit-code: 1` là chặn cả HIGH.
      # Mà 3 CVE HIGH còn lại do next@15.5.23 ghim (postcss, sharp) — mình KHÔNG
      # tự vá được, nên chặn ở HIGH là main đỏ dài hạn vì lỗi thượng nguồn, và
      # đó là cách nhanh nhất để tập cho người ta phớt lơ màu đỏ.
      - name: 'Trivy — báo cáo HIGH + CRITICAL (không chặn)'
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          # Quét theo DIGEST, không theo tag: tag `latest` có thể đã bị run khác
          # đẩy đè trong lúc job này chạy — digest thì trỏ đúng thứ vừa build.
          image-ref: ghcr.io/nghaiz/${{ matrix.image }}@${{ steps.build.outputs.digest }}
          # `table` ra thẳng log, KHÔNG PHẢI `sarif` + upload-sarif. Nộp SARIF
          # đòi code scanning, thứ cần GitHub Advanced Security trên repo private
          # — bản trước dùng SARIF và sẽ đỏ ngay lần merge đầu vào main (job này
          # bị skip trên PR nên lỗi đó không lộ ra ở PR).
          format: table
          exit-code: '0'
          severity: 'HIGH,CRITICAL'

      - name: 'Trivy — CỔNG CHẶN ở CRITICAL'
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ghcr.io/nghaiz/${{ matrix.image }}@${{ steps.build.outputs.digest }}
          format: table
          exit-code: '1'
          severity: 'CRITICAL'
          # `ignore-unfixed: false` (mặc định) giữ nguyên: một CRITICAL chưa có
          # bản vá vẫn là thứ phải BIẾT và quyết định có ship hay không, không
          # phải thứ tự động bỏ qua. Cần bỏ qua một CVE cụ thể thì thêm vào
          # .trivyignore kèm lý do và ngày rà lại — không nới cả ngưỡng.
