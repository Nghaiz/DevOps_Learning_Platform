# CI xanh mới merge. Bảy cổng chạy SONG SONG, gom về một check duy nhất `ci-ok`:
#
#   proto ───────────┐
#   ts               │
#   go               │
#   infra            │
#   secret-scan      ├─► ci-ok ─► images (chỉ push main / tag v*)
#   sandbox-image    │
#   terminal-browser │
#   web-a11y         │
#   no-commerce     ┘
#
# (`dependency-review` từng nằm ở đây, ĐÃ XOÁ — xem khối lý do ngay trên job
#  `sandbox-image`. Sơ đồ này lệch suốt từ lúc đó tới 1.E-2; sửa cùng lúc với
#  việc `sandbox-image` nhận thêm toàn bộ cổng E6/E7/E8/E9.)
#
# VÌ SAO MỘT FILE: `images: needs: ci-ok` là phụ thuộc job THẬT trong cùng
# workflow run. Tách sang file khác thì phải đi đường workflow_run, vốn phải chạy
# lại toàn bộ cổng một lần nữa mới gate được.
#
# VÌ SAO `ci-ok`: branch protection chỉ nhận tên check cố định. Khai 7 job làm 7
# required check nghĩa là mỗi lần thêm/đổi tên job phải vào Settings sửa tay và
# quên là mất cổng trong im lặng. `ci-ok` là một cái tên, không bao giờ đổi.
#
# MỌI ACTION GHIM THEO SHA, không phải tag. `@v7` là tag DI ĐỘNG — chủ action trỏ
# lại vào commit khác lúc nào cũng được, và đó chính xác là đường đi của vụ
# tj-actions/changed-files (2025). Dependabot nâng SHA giúp (.github/dependabot.yml).
name: CI

# ⏸ TẠM DỪNG 2026-09-04 — giai đoạn phát triển nhanh tới hết phase 14.
#
# Workflow này KHÔNG còn tự chạy. Nó chỉ chạy khi gọi tay (nút "Run workflow"
# trên tab Actions, hoặc `gh workflow run ci.yml`). Lý do, phạm vi, và LỆNH BẬT
# LẠI: `docs/ci-paused.md`.
#
# Quét secret KHÔNG bị tắt — nó tách sang `.github/workflows/secret-scan.yml` và
# vẫn chạy mọi push. Đó là cổng duy nhất mà hỏng thì bật lại CI sau không cứu
# được (secret lọt vào lịch sử git ⇒ phải xoay khoá + rewrite history).
#
# Khối `on:` gốc giữ nguyên ở đây, comment lại, để bật lại là bỏ comment:
#
#   push:
#     branches: [main]
#     tags: ['v*']
#   pull_request:
#
# (KHÔNG để `push:` trần: với branch trong chính repo này, GitHub bắn CẢ `push`
# LẪN `pull_request` ⇒ mọi PR chạy CI hai lần, tốn đôi số phút runner.)
on:
  workflow_dispatch:

# Least privilege cấp workflow: mặc định của GITHUB_TOKEN rộng hơn nhiều thứ CI
# này cần. Job nào cần hơn thì tự khai thêm (images: packages:write, ...).
permissions:
  contents: read

# Huỷ run cũ khi có push mới trên cùng branch/PR — khỏi tốn phút chờ một run đã
# lỗi thời. TRỪ main: cancel giữa chừng job `images` đang push là để lại tag
# `latest` nửa vời trên registry; run trên main chạy trọn.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  # ────────────────────────────────────────────────────────── contract (proto)
  proto:
    name: Contract (buf)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # fetch-depth: 0 cho `make proto-breaking` — baseline của buf là một git
          # ref (`.git#branch=main` / `.git#ref=HEAD~1`), shallow clone mặc định
          # (depth 1) không có ref đó nên buf fail bằng lỗi git khó hiểu.
          fetch-depth: 0

      - uses: bufbuild/buf-setup-action@a47c93e0b1648d5651a065437926377d060baa99 # v1.50.0
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          # PIN BẮT BUỘC — không truyền version thì action dùng DEFAULT NƯỚNG
          # CỨNG trong chính nó (không phải latest). buf 1.50 sinh session_pb.ts
          # khác byte với buf 1.72 (máy dev + docker) → proto-check đỏ oan
          # (run 31245094744). Cùng nguyên tắc pin 3 remote plugin trong buf.gen.yaml.
          version: 1.72.0

      # Job này KHÔNG cần node/pnpm: buf.gen.yaml dùng toàn REMOTE plugin
      # (buf.build/...), codegen chạy trên hạ tầng buf chứ không phải runner.
      - name: Lint contract
        run: make proto-lint

      - name: Drift gate (buf generate + git status)
        run: make proto-check

      - name: 'Nạp baseline main (chỉ khi KHÔNG ở trên main)'
        # `fetch-depth: 0` tải đủ lịch sử NHƯNG không tạo local branch `main`:
        # trên PR, checkout để HEAD detached ở merge commit và refspec của nó chỉ
        # phủ ref đang checkout. buf resolve `branch=main` bằng cách clone local
        # .git ⇒ "fatal: couldn't find remote ref main" (đã dính thật, PR #1).
        # An toàn vì nhánh này chỉ chạy khi KHÔNG ở trên main — fetch vào branch
        # đang checkout là lỗi cứng của git.
        if: github.ref != 'refs/heads/main'
        run: git fetch --no-tags origin '+refs/heads/main:refs/heads/main'

      - name: Breaking gate (buf breaking)
        # Baseline theo VỊ TRÍ, không theo loại event:
        #   - đang ở trên main: so với main là tự so với chính mình ⇒ LUÔN xanh,
        #     cổng giả. Dùng HEAD~1.
        #   - mọi chỗ khác (PR, nhánh feature): so với main → bắt breaking change
        #     của CẢ nhánh, không chỉ commit cuối.
        env:
          BUF_BREAKING_AGAINST: >-
            ${{ github.ref == 'refs/heads/main' && '.git#ref=HEAD~1' || '.git#branch=main' }}
        run: make proto-breaking

  # ──────────────────────────────────────────────────────────────── TypeScript
  ts:
    name: TypeScript (lint + build + test)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        # Giá trị khớp .github/ci.env — credential GIẢ, sống vài phút trong runner.
        image: postgres:16-alpine
        env:
          POSTGRES_USER: dlp
          POSTGRES_PASSWORD: ci-only-password
          POSTGRES_DB: dlp
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U dlp -d dlp"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      # KHÔNG khai redis ở đây: cú pháp `services:` chỉ nhận docker-create flags
      # qua `options`, không có chỗ đè CMD của container — mà `--requirepass` là
      # CMD arg của redis-server, không phải env (image redis chính chủ không đọc
      # env mật khẩu như bitnami/redis). Nên `docker run` thủ công ở bước dưới.
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24

      # SSOT env của CI. Trước đây 11 dòng này nằm inline trong workflow và phải
      # tự khớp bằng tay với `services:` ở trên, với lệnh docker run Redis, và
      # với turbo.json tasks.test.env. Giờ một file, và `env-check` ép nó đủ.
      - name: 'Nạp .github/ci.env vào môi trường job'
        run: grep -E '^[A-Z][A-Z0-9_]*=' .github/ci.env >> "$GITHUB_ENV"

      # Chạy TRƯỚC pnpm install: chỉ cần node stdlib, nên fail sớm trong ~5s thay
      # vì sau 60s cài dependency.
      - name: Env drift gate
        run: node scripts/env-check.mjs

      - name: 'Start Redis (requirepass — services: không cho đặt CMD)'
        run: |
          docker run -d --name ci-redis -p 6379:6379 redis:7-alpine \
            redis-server --requirepass "$REDIS_PASSWORD"
          # Loop chờ PHẢI kết thúc bằng fail tường minh — for hết vòng mà rơi
          # xuyên qua im lặng thì lỗi Redis lộ ra sau đó thành test fail khó hiểu.
          ok=""
          for _ in $(seq 1 30); do
            if docker exec ci-redis redis-cli -a "$REDIS_PASSWORD" ping 2>/dev/null | grep -q PONG; then
              ok=1; break
            fi
            sleep 1
          done
          if [ -z "$ok" ]; then
            echo "Redis không PONG sau 30s"; docker logs ci-redis; exit 1
          fi

      # KHÔNG khai `version:` — root package.json đã có `packageManager:
      # pnpm@11.10.0` (SSOT); action-setup coi khai cả hai nơi là LỖI CỨNG
      # ("Multiple versions of pnpm specified"), không phải cảnh báo.
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10

      - name: 'Bật cache pnpm (sau action-setup — cần pnpm trên PATH)'
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: pnpm

      - name: pnpm install
        run: pnpm install --frozen-lockfile

      # CỐ Ý CHƯA CÓ cổng `pnpm format:check`. Nó hiện đỏ trên main ở 15 file có
      # từ trước — bật lên bây giờ nghĩa là hoặc CI đỏ ngay, hoặc phải nhét một
      # diff thuần-format vào giữa code auth/security. Bật sau, ở một commit
      # riêng chỉ làm đúng việc `pnpm format`.

      - name: DB migrate (Drizzle)
        run: pnpm --filter @devops-platform/web db:migrate

      # `typecheck` phải có mặt tường minh: từ khi alias TS6/TS7, `next build`
      # của apps/web type-check bằng JS API (shim TS6) — chỉ `tsc --noEmit` (TS7)
      # mới là cổng typecheck thật. Thiếu nó thì diff chẩn đoán chỉ-có-ở-TS7
      # merge xanh mà không ai thấy (đúng rủi ro "hai nguồn chẩn đoán" của D5).
      - name: lint + typecheck + build + test (turbo)
        run: pnpm turbo run lint typecheck build test

  # ──────────────────────────────────────────────────────────────────────── Go
  go:
    name: Go (build + vet + test + lint + vuln)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # Redis THẬT cho test warm-pool claim. Không có nó thì `internal/pool` tự
    # skip (theo thiết kế: miniredis hỗ trợ Lua không đầy đủ nên chạy ở đó là
    # guard giả) — và một HARD-GATE bị skip mọi lần chạy là một HARD-GATE
    # không gác gì. Test tự dùng DB 15 + FLUSHDB nên container này dùng xong bỏ.
    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.work
          # go.work ở root không có go.mod cạnh bên — chỉ cho cache key vào go.sum
          # của từng module, không thì setup-go warn "go.mod not found".
          cache-dependency-path: '**/go.sum'

      - name: build + vet + test (mọi module trong go.work)
        env:
          # DB 15: test FLUSHDB, và service container này chỉ phục vụ CI nên
          # không có gì để mất — nhưng giữ đúng DB mà test dùng ở local để
          # hành vi hai nơi giống hệt nhau.
          REDIS_URL: redis://127.0.0.1:6379/15
        run: go work sync && make go-build go-vet go-test

      # Test đua của warm-pool chỉ có nghĩa khi lặp: race hiện theo xác suất,
      # một lượt xanh không chứng minh gì. -count=20 là tiêu chí xanh của
      # HARD-GATE 1.A-2 (phase-1.md) — chạy nó ở CI để nó gác được mọi PR chạm
      # claim.lua, chứ không chỉ gác đúng lần spike.
      - name: Test đua warm-pool claim (-race -count=20, Redis thật)
        env:
          REDIS_URL: redis://127.0.0.1:6379/15
        working-directory: services/orchestrator
        # `go test` trả exit 0 khi MỌI test đều SKIP, nên "job xanh" một mình
        # không chứng minh gì: gỡ Redis service ra thì suite này skip sạch và CI
        # vẫn xanh — đúng cái bẫy mà comment ở services block cảnh báo. Đọc
        # -json và ĐỎ nếu thấy bất kỳ action "skip" nào.
        run: |
          set -o pipefail
          go test ./internal/pool/... -race -count=20 -json | tee /tmp/pool-test.json
          if grep -q '"Action":"skip"' /tmp/pool-test.json; then
            echo "::error::Test warm-pool bị SKIP — Redis service không tới được. HARD-GATE 1.A-2 không gác gì trong lần chạy này."
            exit 1
          fi
          grep -c '"Action":"pass"' /tmp/pool-test.json

      # Cùng lý lẽ, cho lane thứ ba: vòng đời session (`internal/lifecycle`). Nó
      # chạy trên Redis THẬT vì `claim.lua` cần Lua đầy đủ, và nó chứa các ĐỐI
      # CHỨNG ÂM của P3/3.C — "session còn sống KHÔNG bị đụng khi dọn session ma",
      # "lượt hai vẫn dọn sau khi chết giữa chừng". Đối chứng âm là thứ mất đi thì
      # không ai thấy: một lần đổi env là chúng skip sạch, `make go-test` ở trên
      # trả 0, và bản vá chống-rò không còn gì gác nó.
      - name: 'Vòng đời session + đối chứng âm reaper (Redis thật, không được SKIP)'
        env:
          REDIS_URL: redis://127.0.0.1:6379/15
        working-directory: services/orchestrator
        run: |
          set -o pipefail
          go test ./internal/lifecycle/... -count=1 -json | tee /tmp/lifecycle-test.json
          if grep -q '"Action":"skip"' /tmp/lifecycle-test.json; then
            echo "::error::Test vòng đời session bị SKIP — Redis service không tới được. Đối chứng âm của 3.C không gác gì trong lần chạy này."
            exit 1
          fi
          grep -c '"Action":"pass"' /tmp/lifecycle-test.json

      # Cùng lý lẽ với bước warm-pool ở trên, cho lane còn lại: authz per-session
      # của gateway (luật 8 + luật 10) chạy trên Redis THẬT, nên gỡ Redis ra là
      # cả bộ acceptance IDOR tự skip và CI vẫn xanh. Đây đúng là bộ test mà
      # G13 nói "chạy trong CI", nên nó phải có cổng chống-skip riêng — bước
      # `make go-test` ở trên KHÔNG có, và một lượt skip sạch ở đó im lặng
      # tuyệt đối.
      - name: 'Acceptance IDOR + trần WS của gateway (Redis thật, không được SKIP)'
        env:
          REDIS_URL: redis://127.0.0.1:6379/15
        working-directory: services/terminal-gateway
        run: |
          set -o pipefail
          go test ./internal/sessionstore/... ./internal/wsroute/... -race -count=1 -json | tee /tmp/gw-test.json
          if grep -q '"Action":"skip"' /tmp/gw-test.json; then
            echo "::error::Test authz của gateway bị SKIP — Redis service không tới được. Acceptance IDOR (G13) không gác gì trong lần chạy này."
            exit 1
          fi
          grep -c '"Action":"pass"' /tmp/gw-test.json

      - name: Cài golangci-lint v2.x
        # `go install` thay vì install.sh: script trên master mang bảng checksum
        # của bộ version HIỆN TẠI của nó — cài version pin cũ hơn là mismatch
        # ("hash_sha256_verify did not verify", run 31245533716). go install build
        # từ source, toàn vẹn do Go checksum DB đảm bảo, không script lạ.
        run: |
          go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@v2.12.2
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"

      - name: golangci-lint (mọi module)
        run: make go-lint

      # go.work là SSOT của phiên bản Go: setup-go đọc nó, nên govulncheck bên
      # dưới quét đúng stdlib của phiên bản đó. Nhưng BINARY GIAO ĐI lại build
      # trong Dockerfile — nếu base image lệch, cổng vuln xanh trong khi ảnh
      # chạy thật vẫn dính. Đã dính đúng một lần: `golang:1.26-alpine` còn ở
      # 1.26.5 sau khi CI đã chuyển sang 1.26.6, tức tag "trôi theo minor"
      # KHÔNG bảo vệ được gì. Vì vậy Dockerfile ghim patch chính xác, và cổng
      # này giữ cho nó không lệch khỏi go.work ở lần nâng sau.
      - name: 'Ghim toolchain: go.mod + Dockerfile phải khớp go.work'
        run: |
          want=$(awk '/^go [0-9]/{print $2; exit}' go.work)
          [ -n "$want" ] || { echo '::error::không đọc được dòng "go" trong go.work'; exit 1; }
          echo "SSOT: go.work → go$want"
          rc=0

          n_mod=0
          for f in $(git ls-files '*go.mod'); do
            n_mod=$((n_mod + 1))
            got=$(awk '/^go [0-9]/{print $2; exit}' "$f")
            [ "$got" = "$want" ] || { echo "::error file=$f::go $got lệch go.work (go$want)"; rc=1; }
          done

          n_df=0
          for f in $(git ls-files '*Dockerfile'); do
            grep -q '^FROM golang:' "$f" || continue
            n_df=$((n_df + 1))
            got=$(sed -n 's/^FROM golang:\([0-9][^ -]*\).*/\1/p' "$f" | head -1)
            [ "$got" = "$want" ] || { echo "::error file=$f::golang:$got lệch go.work (go$want)"; rc=1; }
          done

          # Cổng khớp-0-file là cổng không gác gì: repo này đã có tiền lệ
          # "xanh vì không match cái nào", nên khẳng định số file đếm được.
          [ "$n_mod" -ge 4 ] || { echo "::error::chỉ thấy $n_mod go.mod — cổng không quét đủ"; exit 1; }
          [ "$n_df" -ge 4 ] || { echo "::error::chỉ thấy $n_df Dockerfile FROM golang: — cổng không quét đủ"; exit 1; }
          echo "khớp: $n_mod go.mod + $n_df Dockerfile → go$want"
          exit $rc

      - name: govulncheck (mọi module)
        # Đối chiếu dependency Go với Go vulnerability DB. Khác Dependabot ở chỗ
        # nó phân tích REACHABILITY — chỉ báo khi code thật sự gọi tới hàm dính
        # lỗi, nên gần như không có nhiễu để phải bỏ qua.
        #
        # KHÔNG dừng ở module đỏ đầu tiên: `|| exit 1` trong vòng lặp từng che
        # mất 3 module còn lại (lần go1.26.5 dính GO-2026-6090 chỉ báo
        # proto/gen/go, không ai biết 3 module kia sạch hay bẩn cho tới khi quét
        # tay). Quét hết rồi mới trả mã lỗi.
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@v1.1.4
          rc=0
          for dir in $(go list -m -f '{{.Dir}}'); do
            echo "--- govulncheck $dir"
            (cd "$dir" && govulncheck ./...) || rc=1
          done
          exit $rc

  # ───────────────────────────────────────────────────── hạ tầng (Helm + shell)
  infra:
    name: Infra (helm + kubeconform + shellcheck + actionlint)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
        with:
          version: v3.20.0

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.work
          cache-dependency-path: '**/go.sum'

      - name: helm lint (3 bộ values)
        # betterAuthSecret + 2 mật khẩu datastore là `required` trong chart —
        # không truyền thì template dừng. Giá trị dưới đây là rác dùng một lần
        # trong runner.
        #
        # values-selfhost.yaml bật `datastore.enabled: true` từ P1 (1.B0.2), nên
        # thiếu hai --set datastore.* là job này đỏ ở ĐÚNG bộ values đó — trong
        # khi `helm upgrade` thủ công (luôn có --set) vẫn xanh. Đây chính là loại
        # "cổng chưa từng được chạy trên đường CI" mà repo này đã dính một lần.
        run: |
          for f in values.yaml values-selfhost.yaml values-cloud.yaml; do
            echo "--- helm lint -f $f"
            helm lint infra/helm/platform \
              -f "infra/helm/platform/$f" \
              --set web.env.betterAuthSecret=ci-only-not-a-real-secret \
              --set datastore.postgres.password=ci-only-not-a-real-password \
              --set datastore.redis.password=ci-only-not-a-real-password || exit 1
          done

      - name: 'helm template + kubeconform (manifest có hợp lệ với API k8s không)'
        run: |
          go install github.com/yannh/kubeconform/cmd/kubeconform@v0.8.0
          for f in values.yaml values-selfhost.yaml values-cloud.yaml; do
            echo "--- kubeconform -f $f"
            helm template platform infra/helm/platform \
              -f "infra/helm/platform/$f" \
              --set web.env.betterAuthSecret=ci-only-not-a-real-secret \
              --set datastore.postgres.password=ci-only-not-a-real-password \
              --set datastore.redis.password=ci-only-not-a-real-password \
            | "$(go env GOPATH)/bin/kubeconform" -strict -summary \
                -ignore-missing-schemas || exit 1
          done

      - name: 'helm template — nhánh ingress bật (chưa bộ values nào bật)'
        # Ingress mặc định TẮT ở cả 3 bộ values, nên không có bước nào ở trên
        # từng render template đó. Không test thì lỗi cú pháp trong ingress.yaml
        # chỉ lộ vào đúng hôm bật ingress trên prod.
        run: |
          helm template platform infra/helm/platform \
            --set web.env.betterAuthSecret=ci-only-not-a-real-secret \
            --set ingress.enabled=true \
            --set ingress.className=traefik \
            --set ingress.host=dlp.example.com \
          | "$(go env GOPATH)/bin/kubeconform" -strict -summary \
              -ignore-missing-schemas

      - name: 'helm template — nhánh cluster-autoscaler bật (P3/3.G)'
        # Cùng lỗ hổng với hai bước trên: `autoscaling.clusterAutoscaler.enabled`
        # mặc định FALSE ở cả 3 bộ values (bật là quyết định của người vận hành
        # cụm có node group thật), nên không bước nào ở trên từng render template
        # này. Không có bước này thì một lỗi cú pháp ở đó chỉ lộ vào đúng hôm ai
        # đó bật autoscaler trên prod.
        #
        # ⚠ Cổng này CHỈ chứng minh render + schema. Hành vi scale KHÔNG được
        # chứng minh ở bất cứ đâu trong repo, và không được đọc thành đã có —
        # lab 1-node không có `cluster.x-k8s.io` lẫn `metrics.k8s.io`.
        run: |
          helm template platform infra/helm/platform \
            --set web.env.betterAuthSecret=ci-only-not-a-real-secret \
            --set autoscaling.clusterAutoscaler.enabled=true \
            --set 'autoscaling.clusterAutoscaler.nodeGroupAutoDiscovery[0]=clusterAPI:namespace=default' \
          | "$(go env GOPATH)/bin/kubeconform" -strict -summary \
              -ignore-missing-schemas

          # Đối chứng âm: TẮT cờ ⇒ KHÔNG một object autoscaler nào được render.
          # Thiếu vế này thì một `if` viết sai (vd luôn true) vẫn qua cổng trên.
          n=$(helm template platform infra/helm/platform \
                --set web.env.betterAuthSecret=ci-only-not-a-real-secret \
              | grep -c 'cluster-autoscaler' || true)
          if [ "$n" -ne 0 ]; then
            echo "cluster-autoscaler render dù cờ TẮT ($n dòng) — khối if hỏng" >&2
            exit 1
          fi

      - name: 'helm template — nhánh middleware biên bật (P3/3.A)'
        # Ba Middleware + việc tách Ingress làm ba CHỈ render khi
        # ingress.middleware.enabled=true, mà KHÔNG bộ values nào bật nó (mặc định
        # false để trung lập nhà cung cấp — Middleware là CRD riêng của Traefik).
        # Không có bước này thì ba manifest mới không bao giờ được CI render.
        #
        # ⛔ PHÉP KIỂM CHÍNH LÀ VẾ "THAM CHIẾU KHỚP ĐỊNH NGHĨA", KHÔNG PHẢI "render
        # được". Traefik BỎ QUA TRONG IM LẶNG một `router.middlewares` trỏ tới
        # Middleware không tồn tại: Ingress vẫn Ready, route vẫn chạy, và trần
        # body/rate-limit đơn giản là KHÔNG có. Đó đúng là chế độ hỏng của sự cố
        # `service.type` (2026-08-14) — giá trị đã khai và hành vi thật nói hai
        # điều khác nhau, và không cổng nào bắt được.
        run: |
          out=$(helm template platform infra/helm/platform \
            --set web.env.betterAuthSecret=ci-only-not-a-real-secret \
            --set ingress.enabled=true \
            --set ingress.className=traefik \
            --set ingress.host=dlp.example.com \
            --set ingress.middleware.enabled=true \
            --set ingress.middleware.redirectHttps.enabled=true \
            --set ingress.middleware.redirectHttps.port=30443)

          printf '%s' "$out" | "$(go env GOPATH)/bin/kubeconform" -strict -summary \
            -ignore-missing-schemas || exit 1

          defined=$(printf '%s\n' "$out" \
            | awk '/^kind: Middleware$/{f=1} f&&/^  name: /{print $2; f=0}' | sort -u)
          echo "Middleware được định nghĩa:"; printf '%s\n' "$defined"
          # `printf` chứ không phải chuỗi nhiều dòng: trong block scalar của YAML,
          # một dòng bắt đầu ở cột 0 sẽ THOÁT khỏi khối `run:` và làm hỏng workflow.
          # `platform-ratelimit-ide` là tier RIÊNG cho `/ide` (P13 D8): Theia phục vụ
          # mọi asset của nó dưới `/ide/session/{id}/`, nên ghép chung bucket với
          # `ratelimit-web` thì mở IDE tự 429 chính lời gọi API của trang bài học.
          # Xem middleware-ratelimit.yaml § ratelimit-ide.
          want_defined=$(printf '%s\n' \
            platform-bodylimit \
            platform-ratelimit-ide \
            platform-ratelimit-static \
            platform-ratelimit-web \
            platform-ratelimit-ws \
            platform-redirect-https)
          [ "$defined" = "$want_defined" ] \
            || { echo "tập Middleware lệch. Muốn:"; printf '%s\n' "$want_defined"; exit 1; }

          # ── Khẳng định CHÍNH XÁC từng Ingress ────────────────────────────────
          # ⛔ VÌ SAO KHÔNG CHỈ KIỂM "tham chiếu khớp định nghĩa": phép kiểm đó là
          # MỘT CHIỀU (definition ⊇ reference) và một review đối kháng đã chứng
          # minh nó cho qua BỐN kiểu hỏng thật, mỗi kiểu đều XANH:
          #   A. gỡ HẲN annotation middlewares khỏi platform-web ⇒ đường web mất
          #      sạch trần body + rate-limit, mà mọi tham chiếu còn lại vẫn khớp;
          #   C. đổi entrypoint của platform-web sang `web` ⇒ HTTPS trả 404 cho
          #      toàn ứng dụng, và trên HTTP hai router cùng rule tranh nhau;
          #   F. trỏ platform-web sang ratelimit-WS ⇒ cả site tụt xuống 20 req/phút,
          #      trông như "app chậm" chứ không như lỗi cấu hình.
          # Nên ở đây pin TẬP MONG ĐỢI cho từng object, cả middleware lẫn entrypoint.
          # Release.Namespace của `helm template` là `default` ⇒ tiền tố `default-`.
          # ⚠ `flush()` phải chạy CẢ khi gặp một Ingress MỚI, không chỉ khi gặp kind
          # khác. Bản đầu chỉ xả ở nhánh `kind` khác, mà bốn Ingress nằm LIÊN TIẾP
          # trong output — nên nó chỉ in ra object CUỐI, và cổng đỏ ngay trên chart
          # đúng. Một parser im lặng nuốt 3/4 bản ghi là cách dễ nhất để cổng này
          # trở nên vô dụng theo hướng ngược lại.
          actual=$(printf '%s\n' "$out" | awk '
            function flush() { if (ing && name != "") print name "|" ep "|" mw }
            /^kind: Ingress$/ { flush(); ing=1; name=""; ep=""; mw=""; next }
            /^kind: / { flush(); ing=0; next }
            ing && /^  name: / && name=="" { name=$2 }
            ing && /router\.entrypoints:/ { ep=$2; gsub(/"/,"",ep) }
            ing && /router\.middlewares:/ { mw=$2; gsub(/"/,"",mw) }
            END { flush() }
          ' | sed 's/@kubernetescrd//g; s/default-//g' | sort)
          echo "Ingress thực tế (tên|entrypoint|middlewares):"; printf '%s\n' "$actual"
          want_actual=$(printf '%s\n' \
            'platform-ide|websecure|platform-bodylimit,platform-ratelimit-ide' \
            'platform-redirect|web|platform-redirect-https' \
            'platform-static|websecure|platform-ratelimit-static' \
            'platform-web|websecure|platform-bodylimit,platform-ratelimit-web' \
            'platform-ws|websecure|platform-ratelimit-ws')
          if [ "$actual" != "$want_actual" ]; then
            echo "LỆCH so với mong đợi:"; printf '%s\n' "$want_actual"
            echo "(một annotation BIẾN MẤT, một entrypoint sai, hay một tham chiếu trỏ nhầm middleware đều rơi vào đây)"
            exit 1
          fi

          # ── spec của Middleware: kubeconform KHÔNG kiểm được ─────────────────
          # `-ignore-missing-schemas` bỏ qua đúng 4 CRD này (`Skipped: N` trong
          # output ở trên). Hậu quả: một field gõ sai (`maxRequestBodyByte`) render
          # hợp lệ, rồi apiserver PRUNE nó trong im lặng theo structural schema của
          # CRD — kết quả là một middleware `buffering` KHÔNG có trần, mà
          # `kubectl get middleware -o yaml` in ra vẫn trông bình thường. Cùng lớp
          # với sự cố `service.type`, chỉ thấp hơn một tầng.
          need() {
            printf '%s\n' "$out" | grep -q "$1" \
              || { echo "spec Middleware thiếu '$1' — field gõ sai sẽ bị apiserver prune TRONG IM LẶNG"; exit 1; }
          }
          need '^    maxRequestBodyBytes: '
          need '^    memRequestBodyBytes: '
          need '^    scheme: https$'
          need '^    port: '
          # average/burst phải là SỐ TRẦN. Một giá trị lỡ thành chuỗi
          # (`average: "120"`) bị apiserver từ chối vì lệch kiểu — ồn ào, khác hẳn ca
          # prune im lặng ở trên, nhưng vẫn là một lượt deploy hỏng nên bắt sớm ở đây
          # rẻ hơn.
          # ⚠ SỐ MONG ĐỢI SUY RA TỪ `want_defined`, KHÔNG gõ tay. Trước 2026-09-07
          # đây là hằng `6`/`3` chép theo 3 tier rate-limit. Khi P13 thêm tier `ide` thì
          # chốt `want_defined` ở trên đỏ TRƯỚC và hai hằng này không bao giờ được nhìn
          # tới — nên chúng lặng lẽ sai theo, và người sửa chốt trên rất dễ dừng ở đó
          # rồi đỏ tiếp một lượt nữa. Một pin ĐẾM chép tay đứng cạnh một pin DANH
          # SÁCH là hai SSOT cho cùng một sự thật.
          rl=$(printf '%s\n' "$want_defined" | grep -c '^platform-ratelimit-') || rl=0
          [ "$rl" -gt 0 ] \
            || { echo "want_defined không còn tier ratelimit nào — hai phép kiểm dưới đây sẽ xanh mà không gác gì"; exit 1; }
          n=$(printf '%s\n' "$out" | grep -cE '^    (average|burst): [0-9]+$')
          [ "$n" -eq $((rl * 2)) ] \
            || { echo "muốn $((rl * 2)) dòng average/burst dạng SỐ TRẦN ($rl tier × 2 field), thấy $n"; exit 1; }
          n=$(printf '%s\n' "$out" | grep -cE '^    period: "[^"]+"$')
          [ "$n" -eq "$rl" ] \
            || { echo "muốn $rl dòng period dạng chuỗi có nháy (1 mỗi tier), thấy $n"; exit 1; }
          echo "OK: $(printf '%s\n' "$want_defined" | wc -l) Middleware, $(printf '%s\n' "$want_actual" | wc -l) Ingress khớp CHÍNH XÁC tập middleware + entrypoint, spec có đủ field và đúng kiểu."

      - name: 'helm template — trustProxy KHÔNG được bật khi không có proxy (P3/3.A)'
        # Vế NGƯỢC: `web.env.rateLimitTrustProxy=1` khi `ingress.enabled=false`
        # PHẢI làm chart chết. Không có proxy đứng trước thì `x-forwarded-for` là
        # header client tự đặt được, và tin nó biến trần theo IP thành một lớp
        # GIẢ — xoay XFF mỗi request là mỗi request một bucket mới.
        #
        # Bản đầu của 3.A đặt cờ này thẳng vào values-selfhost.yaml, trong khi các
        # lệnh deploy self-host ở docs/env/05 + infra/helm/README.md dùng đúng hồ
        # sơ đó mà KHÔNG bật ingress. Bước này gác để lần sau không tái diễn.
        run: |
          base=(helm template platform infra/helm/platform
            -f infra/helm/platform/values-selfhost.yaml
            --set web.env.betterAuthSecret=ci-only-not-a-real-secret
            --set web.env.betterAuthUrl=https://ci.example
            --set datastore.postgres.password=ci-only-not-a-real-password
            --set datastore.redis.password=ci-only-not-a-real-password)

          # ⛔ ĐỐI CHỨNG DƯƠNG TRƯỚC. Không có nó thì "render thất bại" không phân
          # biệt được với "chart hỏng vì lý do khác" — và bước này sẽ XANH VĨNH VIỄN
          # trong khi chứng minh con số không. Dự án đã có hai bài học đúng dạng
          # ("suite xanh có thể là suite skip sạch", "'0 lỗi' cần đối chứng âm").
          "${base[@]}" >/dev/null 2>&1 \
            || { echo "chart KHÔNG render được ngay cả khi trustProxy TẮT — phép kiểm dưới sẽ vô nghĩa"; exit 1; }

          # Vế NGƯỢC: bật cờ mà không có proxy PHẢI chết, và phải chết ĐÚNG LÝ DO.
          if err=$("${base[@]}" --set web.env.rateLimitTrustProxy=1 2>&1 >/dev/null); then
            echo "chart RENDER ĐƯỢC với trustProxy bật mà không có ingress — cổng đã mất tác dụng"
            exit 1
          fi
          printf '%s' "$err" | grep -q 'rateLimitTrustProxy' \
            || { echo "chart chết, nhưng KHÔNG phải vì cổng trustProxy — thông báo: $err"; exit 1; }
          echo 'OK: trustProxy=1 + ingress.enabled=false bị từ chối, và đúng lý do.'

          # Vế thứ hai của cổng: bật ingress nhưng để web là NodePort ⇒ vẫn còn cửa
          # thứ hai không qua proxy. Đo được trên cụm: đầu độc bucket qua NodePort
          # khoá được người dùng thật trên đường HTTPS hợp lệ.
          if err=$("${base[@]}" --set web.env.rateLimitTrustProxy=1 \
                     --set ingress.enabled=true --set ingress.className=traefik \
                     --set ingress.host=ci.example \
                     --set web.service.type=NodePort 2>&1 >/dev/null); then
            echo "chart RENDER ĐƯỢC với trustProxy bật + web NodePort — cửa thứ hai vẫn mở"
            exit 1
          fi
          printf '%s' "$err" | grep -q 'ClusterIP' \
            || { echo "chết nhưng không phải vì cổng service.type — thông báo: $err"; exit 1; }
          echo 'OK: trustProxy=1 + web.service.type=NodePort bị từ chối, và đúng lý do.'

      - name: 'helm template — nhánh existingSecret (đường đi của prod)'
        # Nhánh này KHÔNG được đòi betterAuthSecret và KHÔNG được sinh Secret WEB.
        # Không test thì logic `if not existingSecret` trong web-secret.yaml chỉ
        # được chạy lần đầu vào đúng hôm deploy prod.
        #
        # ⛔ PHÉP KIỂM PHẢI NHẮM ĐÚNG SECRET WEB, KHÔNG PHẢI "kind: Secret" BẤT KỲ.
        # Bản trước grep `kind: Secret` trần, và nó đúng chừng nào chart chỉ có
        # MỘT Secret. Chặng 1.C-4 thêm `platform-mtls` (CA + cert mTLS, sinh ở
        # mọi nhánh có grpcMtlsMode≠off) ⇒ cổng đỏ ở một chart hoàn toàn đúng.
        # Siết lại theo ĐÚNG ý định ban đầu, và siết MẠNH HƠN: thêm vế khẳng
        # định `platform-mtls` VẪN được sinh — nếu không, một ngày ai đó tắt
        # nhầm mTLS thì phép kiểm này sẽ xanh vì lý do sai.
        run: |
          out=$(helm template platform infra/helm/platform \
            --set web.env.existingSecret=dlp-web-prod)
          secrets=$(printf '%s' "$out" \
            | awk '/^kind: Secret$/{f=1} f&&/^  name:/{print $2; f=0}')
          echo "Secret được sinh: ${secrets:-<không có>}"
          if printf '%s' "$secrets" | grep -qE '^platform-web$'; then
            echo "existingSecret đã set mà chart vẫn sinh Secret WEB — sai"; exit 1
          fi
          printf '%s' "$secrets" | grep -qE '^platform-mtls$' \
            || { echo "Secret mTLS biến mất — phép kiểm này sẽ xanh vì lý do sai"; exit 1; }
          printf '%s' "$out" | grep -q 'name: dlp-web-prod' \
            || { echo "pod không tham chiếu Secret có sẵn"; exit 1; }

      - name: 'helm template — NetworkPolicy nền tảng (P3/3.B)'
        # KHÔNG bộ values nào bật `networkPolicy.platform.enabled` (mặc định false:
        # ba giá trị bắt buộc của nó phụ thuộc cụm). Không có bước này thì CI KHÔNG
        # BAO GIỜ render 13 manifest mới — cùng khoảng mù mà 3.A đã phải vá cho
        # nhánh middleware.
        #
        # ⛔ PHÉP KIỂM NẰM TRONG MỘT SCRIPT, KHÔNG VIẾT INLINE Ở ĐÂY.
        # 3.A phải trích phép kiểm "verbatim từ chính workflow" rồi chạy tay trên
        # các chart bị bóp méo, để thứ được kiểm và thứ CI chạy không trôi khỏi
        # nhau. Ở đây không có gì để trôi: CI và người chạy tay gọi CÙNG một file.
        #
        # Cổng ngữ nghĩa này BỔ SUNG cho kubeconform chứ không thay thế: kubeconform
        # bắt lỗi schema (đã đo: nhãn trần dưới `podSelector:` bị nó bắt vì
        # NetworkPolicy là kiểu có sẵn), còn ba kiểu hỏng nguy hiểm nhất ở đây đều
        # HỢP LỆ về schema — `egress: null` (chặn sạch), `from: []` (mở toang),
        # thiếu `ports:` (mở mọi cổng).
        run: |
          python3 -m pip install --quiet pyyaml
          gate() { python3 infra/k8s/netpol_render_gate.py "$@"; }
          common=(-f infra/helm/platform/values-selfhost.yaml
            --set web.env.betterAuthSecret=ci-only-not-a-real-secret
            --set datastore.postgres.password=ci-only-not-a-real-password
            --set datastore.redis.password=ci-only-not-a-real-password)
          netpol=(--set networkPolicy.platform.enabled=true
            --set 'networkPolicy.platform.apiServerEndpoints[0].cidr=10.0.0.1/32'
            --set 'networkPolicy.platform.apiServerEndpoints[0].port=6443'
            --set 'networkPolicy.platform.nodeCidrs[0]=10.0.0.1/32')

          echo '--- nhánh mặc định: KHÔNG được render policy nền tảng nào ---'
          helm template platform infra/helm/platform "${common[@]}" | gate --expect-none

          echo '--- pha allow (denyEnabled=false) ---'
          helm template platform infra/helm/platform "${common[@]}" "${netpol[@]}" | gate

          echo '--- pha deny (denyEnabled=true) ---'
          out=$(helm template platform infra/helm/platform "${common[@]}" "${netpol[@]}" \
            --set networkPolicy.platform.denyEnabled=true)
          printf '%s' "$out" | gate --expect-deny
          printf '%s' "$out" | "$(go env GOPATH)/bin/kubeconform" -strict -summary \
            -ignore-missing-schemas -kubernetes-version 1.34.0 -

          echo '--- chiều scrape Prometheus (3.D) — nhánh opt-in ---'
          # Không bộ values nào bật metricsScrape, nên nếu không có bước này CI
          # sẽ KHÔNG BAO GIỜ render hai policy đó — đúng khoảng mù mà 3.A và 3.B
          # đều đã phải vá một lần.
          helm template platform infra/helm/platform "${common[@]}" "${netpol[@]}" \
            --set networkPolicy.platform.metricsScrape.enabled=true | gate --metrics-scrape

          # Vế NGƯỢC của chính cổng vừa chạy: cùng bản render ấy, nhưng KHÔNG
          # khai --metrics-scrape thì phải ĐỎ. Thiếu vế này thì `--metrics-scrape`
          # có thể là một cờ không làm gì cả, và ta không phân biệt được.
          if helm template platform infra/helm/platform "${common[@]}" "${netpol[@]}" \
               --set networkPolicy.platform.metricsScrape.enabled=true | gate >/dev/null 2>&1; then
            echo '::error::hai policy scrape render mà cổng vẫn xanh khi không khai --metrics-scrape — cổng đang mù với policy tên MỚI.'
            exit 1
          fi
          echo '  OK  policy scrape lạ bị bắt khi không được khai'

          echo '--- vế NGƯỢC: bảy cổng chặn cấu hình PHẢI làm chart chết ---'
          # Một cổng chỉ kiểm "đường đúng vẫn chạy" sẽ xanh cả sau khi ai đó gỡ
          # mất chính cổng đó. Sáu ca dưới đây đều là cấu hình HỎNG THEO HƯỚNG
          # KHÔNG CÓ TRIỆU CHỨNG, nên chúng phải chết lúc render.
          # Khớp theo MÃ LỖI ổn định (`[netpol:E-*]`), không theo văn xuôi. Bản
          # đầu khớp bằng chuỗi tiếng Việt trong chính thông báo, nên khi commit
          # sau đổi cách diễn đạt của một guard thì cổng vẫn "đỏ" — nhưng đỏ vì
          # SAI LÝ DO, tức đối chứng âm ngừng chứng minh được điều nó định
          # chứng minh. Mã lỗi tách văn xuôi khỏi phép kiểm.
          covered=()
          must_fail() { # $1=mã lỗi  $2=nhãn  còn lại: --set
            local code="$1" label="$2"; shift 2
            local err
            if err=$(helm template platform infra/helm/platform "${common[@]}" "$@" 2>&1); then
              echo "LỖI: '$label' render ĐƯỢC — cổng chặn không tồn tại."; exit 1
            fi
            printf '%s' "$err" | grep -qF "$code" \
              || { echo "LỖI: '$label' chết nhưng SAI LÝ DO (không thấy $code). Thông báo: $err"; exit 1; }
            echo "  OK  $code — $label"
            covered+=("$code")
          }
          must_fail netpol:E-APISERVER-EMPTY 'apiServerEndpoints rỗng' \
            --set networkPolicy.platform.enabled=true \
            --set 'networkPolicy.platform.nodeCidrs[0]=10.0.0.1/32'
          must_fail netpol:E-NODECIDRS-EMPTY 'nodeCidrs rỗng' \
            --set networkPolicy.platform.enabled=true \
            --set 'networkPolicy.platform.apiServerEndpoints[0].cidr=10.0.0.1/32' \
            --set 'networkPolicy.platform.apiServerEndpoints[0].port=6443'
          must_fail netpol:E-DATASTORE-EGRESS 'datastore ngoài cụm mà không khai endpoint' \
            --set datastore.enabled=false "${netpol[@]}"
          must_fail netpol:E-NODECIDR-BROAD 'nodeCidrs là dải khổng lồ' \
            "${netpol[@]}" --set 'networkPolicy.platform.nodeCidrs[0]=10.0.0.0/8'
          must_fail netpol:E-APISERVER-BROAD 'apiServerEndpoints là dải khổng lồ' \
            "${netpol[@]}" --set 'networkPolicy.platform.apiServerEndpoints[0].cidr=0.0.0.0/0'
          must_fail netpol:E-WEB-EXCEPT-EMPTY 'web egress ra internet mà không loại trừ gì' \
            "${netpol[@]}" \
            --set networkPolicy.platform.webExternalEgress.enabled=true \
            --set 'networkPolicy.platform.webExternalEgress.except=null'
          must_fail netpol:E-MONITORING-NS-EMPTY 'bật scrape mà không khai namespace monitoring' \
            "${netpol[@]}" \
            --set networkPolicy.platform.metricsScrape.enabled=true \
            --set 'networkPolicy.platform.metricsScrape.namespace=null'

          # Guard nào chưa ai bắn thử thì chưa ai chứng minh là nó gác. Đối
          # chiếu tập mã trong template với tập mã vừa bắn — thêm guard mới mà
          # quên đối chứng âm sẽ đỏ ngay tại đây, chứ không im lặng trôi qua.
          declared=$(grep -oE 'netpol:E-[A-Z-]+' infra/helm/platform/templates/platform-networkpolicy.yaml | sort -u)
          tested=$(printf '%s\n' "${covered[@]}" | sort -u)
          [ -n "$declared" ] || { echo '::error::không tìm thấy mã netpol:E-* nào trong template — cổng này không gác gì'; exit 1; }
          if [ "$declared" != "$tested" ]; then
            echo "::error::tập guard lệch tập đối chứng âm."
            echo "chỉ có trong template (chưa bắn thử):"; comm -23 <(printf '%s\n' "$declared") <(printf '%s\n' "$tested")
            echo "chỉ có trong CI (guard đã bị gỡ?):";    comm -13 <(printf '%s\n' "$declared") <(printf '%s\n' "$tested")
            exit 1
          fi
          echo "  OK  $(printf '%s\n' "$declared" | wc -l) guard, tất cả đều có đối chứng âm"

          echo '--- hằng số cổng CONTAINER phải khớp containerPort trong deployment ---'
          # NetworkPolicy được đánh giá SAU DNAT nên nó phải nói về cổng CONTAINER,
          # không phải `service.*Port`. Hai giá trị đó hôm nay TRÙNG nhau, nên nếu
          # ai đó đổi containerPort mà quên helper (hoặc ngược lại) thì mọi rule
          # web↔gateway↔orchestrator trỏ sai cổng — `helm template` sạch, pod
          # Running 1/1, và cả ba chiều chết cùng lúc. Đối chiếu trực tiếp ở đây.
          check_port() { # $1=helper  $2=file  $3=tên port
            local want got
            want=$(helm template platform infra/helm/platform "${common[@]}" \
              --show-only "templates/$2" 2>/dev/null \
              | grep -A1 "name: $3$" | grep -oE 'containerPort: [0-9]+' | grep -oE '[0-9]+' | head -1)
            got=$(grep -oE "define \"$1\" -}}[0-9]+" infra/helm/platform/templates/_helpers.tpl \
              | grep -oE '[0-9]+$')
            if [ -z "$want" ] || [ -z "$got" ]; then
              echo "không đọc được cổng cho $1 (want='$want' got='$got')"; exit 1
            fi
            [ "$want" = "$got" ] || { echo "LỆCH: $1=$got nhưng containerPort '$3'=$want trong $2"; exit 1; }
            echo "  OK  $1 = $got khớp containerPort $3"
          }
          check_port platform.gatewayPublicContainerPort    gateway-deployment.yaml      public
          check_port platform.gatewayAdminContainerPort     gateway-deployment.yaml      admin
          check_port platform.orchestratorHttpContainerPort orchestrator-deployment.yaml http
          check_port platform.orchestratorGrpcContainerPort orchestrator-deployment.yaml grpc

          echo 'OK: netpol render đúng ở cả 3 nhánh, 6 cổng chặn cấu hình bắn đúng lý do, hằng số cổng khớp containerPort.'

      - name: shellcheck (infra/host/*.sh)
        uses: ludeeus/action-shellcheck@00cae500b08a931fb5698e11e79bfbd38e612a38 # 2.0.0
        with:
          scandir: ./infra/host
          # NGƯỠNG: xem khối lý lẽ ở bước infra/k8s bên dưới (cùng một `severity`,
          # cùng một món nợ).
          # `error` là NGƯỠNG KHỞI ĐẦU, không phải đích. Mặc định của action fail
          # ở cả mức `note`, và 10 script hiện có sinh 16 phát hiện — đưa linter
          # vào codebase sẵn có ở ngưỡng đó thì hoặc phải viết lại script đang
          # chạy tốt, hoặc rắc `# shellcheck disable` khắp nơi. Cả hai đều tệ hơn
          # là bắt đầu ở lớp lỗi thật rồi siết dần.
          #
          # NỢ ĐÃ BIẾT, siết `warning` là phải trả (đừng siết mà không sửa trước):
          #   - SC2034 bench-sandbox-provision.sh:97 — `T_ALL_READY` đo mốc "mọi
          #     pod Ready" rồi KHÔNG in ra đâu cả (bảng tổng kết chỉ dùng T_ALL).
          #     Là số đo bị mất, không phải rác vô hại.
          #   - 15 × SC2015 (`A && B || C` không phải if-then-else) + SC2016,
          #     đều mức `note`.
          severity: error

      - name: shellcheck (infra/k8s/*.sh)
        # `scandir` chỉ nhận MỘT thư mục, nên hai script kiểm-chứng trong
        # `infra/k8s` (netpol-verify, reaper-verify) NẰM NGOÀI cổng trên suốt từ
        # 3.B tới nay. Chúng là mã chạy trên cụm thật và quyết định một ô AC xanh
        # hay đỏ — đúng loại mã mà một lỗi cú pháp im lặng gây hại nhất: script
        # chết giữa chừng, không ô nào đỏ, và bảng tổng đọc ra như "chưa chạy gì".
        # Cả hai đã sạch ở `severity: error` khi thêm bước này, nên không nợ mới.
        uses: ludeeus/action-shellcheck@00cae500b08a931fb5698e11e79bfbd38e612a38 # 2.0.0
        with:
          scandir: ./infra/k8s
          severity: error

      - name: shellcheck (infra/k6/*.sh)
        # Cùng lý lẽ với bước `infra/k8s` ngay trên, và `scandir` chỉ nhận MỘT
        # thư mục nên phải có bước riêng. `run-load.sh` + `provision-users.sh`
        # quyết định ô AC của 3.F xanh hay đỏ; một lỗi cú pháp im lặng ở đây cho
        # ra đúng cái hại tệ nhất — script chết giữa chừng, không ô nào đỏ, và
        # bảng tổng đọc ra như "đã đo và mọi thứ ổn".
        #
        # ⚠ Cổng này CHỈ TĨNH. Chạy thật `run-load.sh` cần một cụm sống nên không
        # vào CI được (cùng lý do `reaper-verify.sh`), và kịch bản k6 (`.js`) cũng
        # không được lint ở đây vì `k6 inspect` đòi binary k6 trên runner. Đừng
        # đọc cổng này xanh thành "load test đã chạy".
        uses: ludeeus/action-shellcheck@00cae500b08a931fb5698e11e79bfbd38e612a38 # 2.0.0
        with:
          scandir: ./infra/k6
          severity: error

      - name: 'shellcheck (content/{scenarios,labs}/dlp-* — script first-party)'
        # Script của BÀI HỌC chạy bằng quyền root TRONG pod của người học, và
        # `verify.sh` quyết định một bước "đạt" hay "chưa đạt". Một lỗi cú pháp ở
        # đây cho ra đúng lớp hại tệ nhất: script chết trước khi kết luận, gateway
        # đọc mã thoát khác 0, và người học thấy "chưa đạt" cho một bài họ vừa làm
        # ĐÚNG. Suốt 2.E→3.I chúng nằm ngoài mọi cổng.
        #
        # ⛔ KHÔNG dùng `scandir: ./content/scenarios` — thư mục đó còn chứa script
        # VENDOR NGUYÊN VĂN từ upstream, và chúng KHÔNG sạch: đo 2026-08-16 có 5
        # lỗi mức `error` (SC2148 thiếu shebang ở loxilb/prolug, SC2218 ở
        # loxilb/common.sh). Ta không được sửa chúng — `vendor-scenarios.mjs
        # --check` so BYTE với commit đã ghim, và license đòi giữ nguyên. Nên cổng
        # này chỉ soi bài FIRST-PARTY (`dlp-*`), là thứ ta thật sự sở hữu.
        #
        # Lọc bằng glob chứ không liệt kê tên: bài first-party thứ ba sẽ tự động
        # được gác mà không phải sửa file này.
        run: |
          # `content/labs` thêm ở P8. Lab dùng ĐÚNG đường chấm của lesson
          # (`runScriptInSession` → gateway `/exec`), nên một `verify.sh` hỏng cú
          # pháp ở đó gây ra y hệt cái hại: script chết trước khi kết luận, mã
          # thoát khác 0, và người học thấy "chưa đạt" cho một task họ vừa làm
          # ĐÚNG. Bỏ nhánh này ngoài cổng là để một nửa số script chấm không được
          # gác — và nửa bị bỏ sót lại đúng là nửa mới nhất.
          mapfile -t files < <(
            find content/scenarios content/labs \
              -path '*/dlp-*' -name '*.sh' | sort
          )
          # Cổng đếm được 0 file sẽ XANH mà không kiểm gì — đúng hạng "0 vi phạm
          # vì không kiểm gì cả". Đổi tên thư mục bài là rơi thẳng vào ca đó, nên
          # nó phải ĐỎ chứ không được im lặng.
          if [ "${#files[@]}" -eq 0 ]; then
            echo "::error::không tìm thấy script first-party nào (content/{scenarios,labs}/dlp-*/**.sh) — cổng này sẽ xanh mà không kiểm gì. Sửa glob hoặc bỏ bước."
            exit 1
          fi
          echo "soi ${#files[@]} script:"
          printf '  · %s\n' "${files[@]}"
          shellcheck --severity=warning "${files[@]}"

      - name: actionlint (chính các workflow này)
        # Bắt lỗi cú pháp expression, tên context sai, và (nhờ shellcheck có sẵn
        # trên runner) cả lỗi shell trong khối `run:` — lớp lỗi mà cách duy nhất
        # khác để phát hiện là push lên rồi xem nó đỏ.
        run: |
          go install github.com/rhysd/actionlint/cmd/actionlint@v1.7.12
          "$(go env GOPATH)/bin/actionlint" -color

  # ──────────────────────────────────────────────────────────────── secret scan
  secret-scan:
    name: Secret scan (gitleaks)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # pull-requests: read là BẮT BUỘC — trên event pull_request, gitleaks-action
    # chạy nhánh ScanPullRequest và gọi GET /repos/.../pulls/{n}/commits để lấy
    # danh sách commit cần quét. Thiếu quyền ⇒ 403 "Resource not accessible by
    # integration" và job đỏ TRƯỚC KHI quét được dòng nào (lộ ra ở PR #1).
    # contents: read khai tường minh: khai `permissions:` là đè TOÀN BỘ mặc định,
    # bỏ dòng này thì chính actions/checkout mất quyền đọc repo.
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # gitleaks quét lịch sử commit trong run — cần full history, không thì
          # default depth=1 bỏ lọt mọi commit trừ cái cuối.
          fetch-depth: 0

      # v3 (không phải v2): v2 chạy trên runtime Node 20, thứ GitHub đã gỡ khỏi
      # runner từ 2026-09-16 và từ 2026-06-02 đã cần cờ opt-out mới chạy. v3 chỉ
      # đổi runtime sang Node 24, không đổi input/output/hành vi.
      - uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # KHÔNG có job `dependency-review`. Bản đầu có, và nó đỏ ngay lần chạy đầu:
  # "Dependency review is not supported on this repository." Action đó cần
  # GitHub Advanced Security khi repo là PRIVATE (repo này private) — GHAS là
  # tính năng trả phí. Giữ lại chỉ tạo một job đỏ vĩnh viễn, và một cổng luôn đỏ
  # là cổng bị bỏ qua. Phần lớn giá trị của nó đã có ở nơi khác: Dependabot
  # alerts (cảnh báo CVE trong dependency) + govulncheck (Go, có reachability) +
  # Trivy (image). Khi nào repo thành public thì thêm lại.
  #
  # ──────────────────────────────────────────── build thử image sandbox ở PR-time
  #
  # Job `images` bên dưới CHỈ chạy trên `main`, nên tới 1.E-1 thì `images/sandbox-base/
  # Dockerfile` là file DUY NHẤT không có cổng nào ở PR. Lúc nó còn là placeholder
  # 3 dòng thì vô hại; giờ nó có một layer apt, HAI lượt tải mạng và HAI cổng
  # checksum, tức là đã có thứ để hỏng.
  #
  # Chế độ hỏng cụ thể được chặn ở đây: một PR nâng `OMP_VERSION`/`FASTFETCH_VERSION`
  # mà quên cập nhật digest ⇒ `sha256sum -c` đỏ. Không có job này thì `ci-ok` vẫn
  # XANH ở PR (job `images` bị skip), merge xong main mới đỏ — và vì `images` đỏ
  # nên KHÔNG có tag `sha-<short>` nào cho `dlp-sandbox-base`. Cộng với việc chart
  # nay ghép sandboxImage từ `image.tag`, lần deploy kế tiếp sẽ trỏ vào một tag
  # không bao giờ tồn tại ⇒ warm-pool ImagePullBackOff.
  #
  # KHÔNG dùng `paths:` (rules/ci-cd-trigger-design.md #3 — required check bị skip
  # vì paths sẽ treo ở "Expected — Waiting" vĩnh viễn). Build luôn, và cache gha
  # dùng chung scope với job `images` nên lần chạy sau gần như tức thì.
  sandbox-image:
    name: 'Build thử: sandbox-base'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      - name: 'Build (KHÔNG push) — cổng checksum + layer apt'
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: images/sandbox-base
          file: images/sandbox-base/Dockerfile
          push: false
          load: true
          tags: dlp-sandbox-base:pr
          cache-from: type=gha,scope=sandbox-base
          # KHÔNG `cache-to`: job này chạy trên mọi PR, để nó ghi cache sẽ đẩy
          # văng cache của `images` (giới hạn 10 GB/repo của GitHub).

      - name: 'Smoke: 10 binary của AC + PID 1 + locale'
        run: |
          set -euo pipefail
          missing=0
          for b in zsh tmux git jq fzf zoxide fastfetch eza bat oh-my-posh vi; do
            if ! docker run --rm --entrypoint /bin/bash dlp-sandbox-base:pr -c "command -v $b >/dev/null"; then
              echo "::error::thiếu binary trong image: $b"; missing=1
            fi
          done
          [ "$missing" -eq 0 ] || exit 1

          # PID 1 phải SỐNG. podspec.go không đặt Command/Args và dùng
          # RestartPolicy=Never, nên một CMD thoát ngay sẽ biến mọi pod warm-pool
          # thành xác mà `pool:free` vẫn đếm là ấm. Đây là cổng rẻ nhất cho nó.
          cid=$(docker run -d dlp-sandbox-base:pr)
          sleep 5
          state=$(docker inspect -f '{{.State.Status}}' "$cid")
          docker rm -f "$cid" >/dev/null
          [ "$state" = "running" ] || { echo "::error::PID 1 chết sau 5s (state=$state)"; exit 1; }

          got=$(docker run --rm --entrypoint /bin/zsh dlp-sandbox-base:pr -lic 'echo $COLORTERM')
          [ "$got" = "truecolor" ] || { echo "::error::COLORTERM=$got, muốn truecolor"; exit 1; }
          echo "smoke đạt."

      # ─────────────────────────────────────────────────────── E7 (1.E-2)
      #
      # CHỈ kiểm SỰ CÓ MẶT của binary. AC "DinD offline" (D4) — `docker info`
      # trả cả client lẫn server, `docker build` + `docker run` không cần mạng —
      # được đo trên pod **Sysbox thật** trên cluster, không đo ở đây.
      #
      # Vì sao không thêm một lượt `docker run --privileged` cho có vẻ đầy đủ:
      # runner GitHub không có Sysbox, nên xanh ở đây không nói được gì chắc
      # chắn về môi trường tính năng thật sự chạy, còn đỏ ở đây có thể là đỏ
      # giả. Một cổng không phân biệt được hai thứ đó là cổng gây nhiễu.
      # ─────────────────────────────────────────────────────── E6 (1.E-2)
      #
      # Lý do tồn tại của cả job này (xem đầu khối) là bắt PR nâng version mà
      # quên cập nhật digest. Lý do đó KHÔNG phủ `PWSH_VERSION`/`PWSH_SHA256`:
      # mặc định `INCLUDE_PWSH=0` nên không lượt build nào chạm tới chúng, và
      # một PR nâng pwsh sẽ XANH toàn bộ rồi mới đỏ ở máy người đầu tiên bật
      # `=1` — cách xa commit gây lỗi.
      #
      # Không build cả nhánh pwsh (nó cộng ~330 MB và vài phút mỗi PR); chỉ tải
      # đúng `.deb` và kiểm checksum — đó chính xác là thứ cần gác.
      - name: 'E6: PWSH_SHA256 khớp .deb thật (nhánh mặc định-tắt vẫn phải có cổng)'
        run: |
          set -euo pipefail
          ver=$(grep -oP '^ARG PWSH_VERSION=\K.*'   images/sandbox-base/Dockerfile)
          sum=$(grep -oP '^ARG PWSH_SHA256=\K.*'    images/sandbox-base/Dockerfile)
          echo "PWSH_VERSION=$ver"
          curl -fsSL -o /tmp/pwsh.deb \
            "https://github.com/PowerShell/PowerShell/releases/download/v${ver}/powershell_${ver}-1.deb_amd64.deb"
          echo "${sum}  /tmp/pwsh.deb" | sha256sum -c - \
            || { echo "::error::PWSH_SHA256 không khớp .deb của v${ver} — cập nhật digest trong Dockerfile"; exit 1; }
          rm -f /tmp/pwsh.deb

      - name: 'E7: docker/dockerd/buildx có trong image'
        run: |
          set -euo pipefail
          for b in docker dockerd; do
            docker run --rm --entrypoint /bin/bash dlp-sandbox-base:pr -c "command -v $b >/dev/null" \
              || { echo "::error::thiếu binary: $b"; exit 1; }
          done
          # buildx là cli-plugin (/usr/libexec/docker/cli-plugins), KHÔNG nằm
          # trên PATH ⇒ `command -v docker-buildx` luôn trượt dù cài đúng. Hỏi
          # qua chính CLI. Lệnh này KHÔNG cần dockerd đang chạy.
          docker run --rm --entrypoint /bin/bash dlp-sandbox-base:pr -c 'docker buildx version' \
            || { echo "::error::docker-buildx-plugin không nạp được"; exit 1; }

      # ─────────────────────────────────────────────────────── E9 (1.E-2)
      #
      # D3 dựa vào việc `new-session -A` là IDEMPOTENT: gateway (G4) exec vào
      # `tmux new-session -A -s dlp` mỗi lần attach, nên nếu lượt hai đẻ session
      # thứ hai thì reconnect sẽ cho sinh viên một màn hình TRỐNG thay vì bài
      # đang làm — và triệu chứng đó nhìn giống hệt "mất kết nối".
      # ⚠ ĐO ĐƯỢC 2026-08-12, tmux 3.4: lượt HAI của `new-session -A` trả về **1**
      # kèm `open terminal failed: not a terminal` khi không có TTY. Không phải
      # lỗi — với `-A` và session đã tồn tại, tmux chuyển sang ngữ nghĩa ATTACH,
      # và `-d` chỉ gác đường TẠO chứ không gác đường attach. Đường thật an toàn
      # vì `podexec/bridge.go` đặt `Tty: true`; nhưng bất kỳ ai gọi
      # `tmux new-session -A` KHÔNG qua PTY (health probe, script dọn dẹp) sẽ
      # nhận mã 1 mà session vẫn đúng.
      #
      # Nên cổng này KHÔNG khẳng định mã trả về — nó khẳng định thứ E9 thật sự
      # hứa: hai lượt gọi cho **cùng một** session. So `session_id` chứ không chỉ
      # đếm `tmux ls`: số đếm bằng 1 cũng đúng trong ca "lượt hai giết session cũ
      # rồi tạo session mới" — mà ca đó chính là mất bài của sinh viên, tức đúng
      # thứ D3 sinh ra để chặn.
      # Cổng này quan sát lượt hai TỪ NGOÀI thay vì đọc mã trả về của nó, vì
      # `2>/dev/null || true` (bản đầu) nuốt MỌI chế độ hỏng: bump tmux làm `-A`
      # ngừng attach thì cổng vẫn xanh, còn sinh viên reconnect qua G4 thì mất
      # phiên. Và không thể chạy lượt hai ở foreground có TTY — đo được
      # 2026-08-12: nó ATTACH thật và chiếm terminal cho tới khi timeout.
      #
      # Nên: lượt hai chạy NỀN có TTY (giống G4, `bridge.go` đặt `Tty: true`),
      # rồi khẳng định từ ngoài. `list-clients` 0 → 1 là vế ĐỎ ĐƯỢC — nó chứng
      # minh lượt hai thật sự attach, chứ không phải "không làm gì cả" (mà ca
      # không-làm-gì cũng cho id1 == id2).
      - name: 'E9: new-session -A lượt hai ATTACH vào đúng session cũ (D3)'
        run: |
          set -euo pipefail
          cid=$(docker run -d -t --entrypoint /bin/bash dlp-sandbox-base:pr -c \
                  'tmux new-session -d -s dlp; sleep 300')
          trap 'docker rm -f "$cid" >/dev/null 2>&1 || true' EXIT
          sleep 2
          id1=$(docker exec "$cid" tmux display-message -p -t dlp '#{session_id}' | tr -d '\r')
          c0=$(docker exec "$cid" tmux list-clients 2>/dev/null | wc -l)
          docker exec -d -t "$cid" bash -c 'tmux new-session -A -s dlp'
          sleep 4
          id2=$(docker exec "$cid" tmux display-message -p -t dlp '#{session_id}' | tr -d '\r')
          n=$(docker exec "$cid" tmux ls | wc -l)
          c1=$(docker exec "$cid" tmux list-clients | wc -l)
          echo "id1=$id1 id2=$id2 n=$n clients: $c0 -> $c1"
          [ "$n" = "1" ]      || { echo "::error::tmux ls trả $n session, muốn 1"; exit 1; }
          [ -n "$id1" ]       || { echo "::error::không đọc được session_id"; exit 1; }
          [ "$id1" = "$id2" ] || { echo "::error::session bị TẠO LẠI ($id1 → $id2) — reconnect sẽ mất bài"; exit 1; }
          [ "$c0" = "0" ]     || { echo "::error::đã có client trước lượt hai — phép đo vô nghĩa"; exit 1; }
          [ "$c1" -ge 1 ]     || { echo "::error::lượt hai KHÔNG attach (clients vẫn 0) — '-A' đã ngừng hoạt động"; exit 1; }

      # ─────────────────────────────────────────────────────── E8 (1.E-2)
      #
      # Đây là cổng BẢO MẬT của chặng, không phải cổng tiện ích: nhánh này chép
      # file do người dùng cung cấp vào $HOME của phiên lab.
      - name: 'E8: allowlist dotfiles — chép cái được phép, TỪ CHỐI phần còn lại'
        run: |
          set -euo pipefail
          fx="$RUNNER_TEMP/dotfiles-fixture"
          rm -rf "$fx"; mkdir -p "$fx/.config/nvim" "$fx/.ssh"
          echo 'DLP_FIXTURE_ZSHRC' > "$fx/.zshrc"                 # allowlist → phải chép
          echo 'DLP_FIXTURE_NVIM'  > "$fx/.config/nvim/init.lua"  # .config/** → phải chép
          echo 'pwned'             > "$fx/evil.sh"                # ngoài allowlist → từ chối
          echo 'ssh-rsa AAAA'      > "$fx/.ssh/authorized_keys"   # ngoài allowlist → từ chối
          ln -s /etc/passwd "$fx/.gitconfig"                      # TÊN hợp lệ nhưng là SYMLINK → từ chối

          # 2>&1 có chủ ý: nhánh này phải NÓI RA thứ nó bỏ, không chỉ bỏ đúng.
          out=$(docker run --rm -v "$fx:/mnt/dotfiles:ro" dlp-sandbox-base:pr bash -c '
            printf "zshrc=%s\n"  "$(cat ~/.zshrc 2>/dev/null | head -1)"
            printf "nvim=%s\n"   "$(cat ~/.config/nvim/init.lua 2>/dev/null)"
            printf "evil=%s\n"   "$([ -e ~/evil.sh ] && echo YES || echo NO)"
            printf "authk=%s\n"  "$([ -e ~/.ssh/authorized_keys ] && echo YES || echo NO)"
            printf "gitcfg=%s\n" "$([ -e ~/.gitconfig ] && echo YES || echo NO)"
          ' 2>&1)
          echo "$out"
          grep -qx 'zshrc=DLP_FIXTURE_ZSHRC' <<<"$out" || { echo '::error::.zshrc trong allowlist KHÔNG được chép'; exit 1; }
          grep -qx 'nvim=DLP_FIXTURE_NVIM'   <<<"$out" || { echo '::error::.config/** KHÔNG được chép'; exit 1; }
          grep -qx 'evil=NO'                 <<<"$out" || { echo '::error::file NGOÀI allowlist đã lọt vào thư mục HOME'; exit 1; }
          grep -qx 'authk=NO'                <<<"$out" || { echo '::error::.ssh/authorized_keys đã lọt vào thư mục HOME'; exit 1; }
          # Vế QUAN TRỌNG NHẤT: symlink là vector duy nhất thoát ra ngoài $HOME
          # qua một thư mục mount — `.gitconfig` ở đây có TÊN nằm trong
          # allowlist, nên nếu chỉ kiểm tên thì nó lọt và $HOME/.gitconfig thành
          # bản sao /etc/passwd.
          grep -qx 'gitcfg=NO'               <<<"$out" || { echo '::error::SYMLINK đã đi qua allowlist'; exit 1; }
          # ...và phải NÓI RA rằng nó đã bỏ symlink. `find -type f` loại symlink
          # ÂM THẦM (nó không bao giờ vào vòng lặp), nên nếu không có lượt quét
          # `-type l` riêng thì `.gitconfig` của người dùng biến mất không dấu
          # vết — an toàn nhưng không chẩn đoán được. Đo được 2026-08-12: trước
          # khi thêm lượt quét đó, log ghi "từ chối 2" trong khi có 3 file bị bỏ.
          grep -q 'là symlink, không đi theo' <<<"$out" \
            || { echo '::error::symlink bị bỏ IM LẶNG — không có dòng log nào'; exit 1; }

      - name: 'E8: guard `..` + hai cap (gọi thẳng hàm, không qua mount)'
        run: |
          set -euo pipefail
          # `find` trên một thư mục thật KHÔNG BAO GIỜ sinh segment `..`, nên
          # guard đó không có ca kiểm nào qua đường mount. Gọi thẳng hàm qua
          # `--lib-only` — không có bước này thì guard sống mãi mà chưa từng
          # được chạy một lần nào.
          docker run --rm --entrypoint /bin/bash dlp-sandbox-base:pr -c '
            set -u
            source /usr/local/bin/dlp-entrypoint.sh --lib-only
            fail=0
            for bad in "../etc/passwd" ".config/../../etc/passwd" "/etc/passwd" ".." "id_rsa"; do
              if dlp_dotfile_allowed "$bad"; then echo "LỌT: $bad"; fail=1; fi
            done
            # Đối chứng dương: một allowlist từ chối MỌI THỨ cũng làm 5 ca trên
            # xanh, nên phải có ca khẳng định nó vẫn cho qua đúng thứ cần cho qua.
            #
            # Ca cuối là ca chống-quá-chặt: `nvim..bak` chứa ".." nhưng không có
            # segment nào LÀ "..", nên nó phải ĐƯỢC PHÉP. Viết guard bằng `*..*`
            # (thay vì `*/../*`) sẽ chặn nó — và ca này là thứ duy nhất phân biệt
            # được hai cách viết đó.
            for ok in ".zshrc" ".bashrc" ".gitconfig" ".tmux.conf" ".config/nvim/init.lua" ".config/nvim..bak/init.lua"; do
              if ! dlp_dotfile_allowed "$ok"; then echo "CHẶN NHẦM: $ok"; fail=1; fi
            done
            exit $fail
          ' || { echo '::error::guard traversal hoặc allowlist sai'; exit 1; }

          # Hai cap: vỡ cap thì bỏ TOÀN BỘ bundle, không chép nửa vời.
          fx="$RUNNER_TEMP/dotfiles-cap"; rm -rf "$fx"; mkdir -p "$fx/.config"
          for i in $(seq 1 60); do echo x > "$fx/.config/f$i"; done
          got=$(docker run --rm -v "$fx:/mnt/dotfiles:ro" dlp-sandbox-base:pr bash -c 'ls ~/.config 2>/dev/null | wc -l')
          [ "$got" = "0" ] || { echo "::error::cap 50 file không chặn (chép $got)"; exit 1; }

          rm -rf "$fx"; mkdir -p "$fx/.config"
          head -c 300000 /dev/zero | tr '\0' 'a' > "$fx/.config/big"
          got=$(docker run --rm -v "$fx:/mnt/dotfiles:ro" dlp-sandbox-base:pr bash -c 'ls ~/.config 2>/dev/null | wc -l')
          [ "$got" = "0" ] || { echo "::error::cap 256 KiB không chặn (chép $got)"; exit 1; }

          # ĐỐI CHỨNG DƯƠNG TẠI BIÊN. Hai ca trên chỉ khẳng định "0 file được
          # chép", mà một cap đặt nhầm thành 0 cũng cho ra 0 — ca dưới là thứ
          # duy nhất phân biệt `-gt` với `-ge` ở đúng ranh giới 50.
          rm -rf "$fx"; mkdir -p "$fx/.config"
          for i in $(seq 1 50); do echo x > "$fx/.config/f$i"; done
          got=$(docker run --rm -v "$fx:/mnt/dotfiles:ro" dlp-sandbox-base:pr bash -c 'ls ~/.config 2>/dev/null | wc -l')
          [ "$got" = "50" ] || { echo "::error::ĐÚNG 50 file (= cap) phải được chép, nhận $got"; exit 1; }

      # ─────────────────────────────────────────────────────── E8 / kubelet
      #
      # ConfigMap / Secret / projected KHÔNG được kubelet ghi thẳng vào thư mục
      # mount — nó dựng layout atomic-writer (`..data` symlink + thư mục có dấu
      # thời gian). Không xử lý thì mọi tên người dùng thấy đều là symlink và
      # mọi file thật nằm dưới `..2026_…/`, cho ra **chép 0 file** với log trỏ
      # vào "allowlist" — tức dẫn người debug đi sai hướng hoàn toàn.
      #
      # Producer của /mnt/dotfiles CHƯA TỒN TẠI ở P1, nên ca này là thứ duy nhất
      # giữ cho nhánh E8 dùng được với kiểu volume mà nó SẼ gặp.
      - name: 'E8: layout atomic-writer của kubelet (ConfigMap/Secret/projected)'
        run: |
          set -euo pipefail
          fx="$RUNNER_TEMP/dotfiles-k8s"; rm -rf "$fx"
          stamp='..2026_08_12_04_34_54.123456789'
          mkdir -p "$fx/$stamp/.config/nvim"
          echo 'DLP_K8S_ZSHRC' > "$fx/$stamp/.zshrc"
          echo 'DLP_K8S_NVIM'  > "$fx/$stamp/.config/nvim/init.lua"
          ln -s "$stamp" "$fx/..data"
          ln -s '..data/.zshrc' "$fx/.zshrc"
          ln -s '..data/.config' "$fx/.config"

          out=$(docker run --rm -v "$fx:/mnt/dotfiles:ro" dlp-sandbox-base:pr bash -c '
            printf "zshrc=%s\n" "$(head -1 ~/.zshrc 2>/dev/null)"
            printf "nvim=%s\n"  "$(cat ~/.config/nvim/init.lua 2>/dev/null)"' 2>&1)
          echo "$out"
          grep -q 'layout atomic-writer' <<<"$out" \
            || { echo '::error::không nhận ra ..data — nhánh dotfiles sẽ chép 0 file với ConfigMap'; exit 1; }
          grep -qx 'zshrc=DLP_K8S_ZSHRC' <<<"$out" || { echo '::error::.zshrc qua ConfigMap KHÔNG được chép'; exit 1; }
          grep -qx 'nvim=DLP_K8S_NVIM'   <<<"$out" || { echo '::error::.config/** qua ConfigMap KHÔNG được chép'; exit 1; }

      # ─────────────────────────────────────────────── bất biến PID 1 (E8)
      #
      # `set -u` KHÔNG bắt `"$@"` rỗng, nên `exec "$@"` với 0 tham số không exec
      # gì cả và script trả 0 ⇒ tini thoát ⇒ pod **Succeeded** ⇒ warm-pool đầy
      # xác mà `pool:free` vẫn đếm là ấm. Cổng PID-1 ở trên KHÔNG phủ ca này vì
      # nó chạy `docker run -d` (có CMD). Đây là ca gọi entrypoint TRỰC TIẾP —
      # đúng thứ xảy ra nếu ai đó đặt `containers[].command` trong podspec.go.
      - name: 'E8: entrypoint KHÔNG có CMD vẫn phải giữ PID 1 sống'
        run: |
          set -euo pipefail
          cid=$(docker run -d --entrypoint /usr/local/bin/dlp-entrypoint.sh dlp-sandbox-base:pr)
          sleep 5
          state=$(docker inspect -f '{{.State.Status}}' "$cid")
          docker rm -f "$cid" >/dev/null
          [ "$state" = "running" ] \
            || { echo "::error::entrypoint không CMD → state=$state (muốn running). PID 1 thoát = pod Succeeded = warm-pool đếm một xác."; exit 1; }

      # ⛔ `--exit-code 1` trả 0 KHÔNG có nghĩa là "0 CRITICAL". Trivy FATAL khi
      # không tải được DB lỗ hổng (ghcr rate-limit là ca hay gặp), và khi đó nó
      # KHÔNG quét byte nào — trong khi log của một job xanh thì không ai đọc.
      # Dính đúng ca này lúc quét cục bộ ở 1.E-2. Nên cổng ghi kết quả ra FILE
      # rồi bước sau khẳng định lượt quét ĐÃ chạy; thiếu vế đó thì đây là một
      # cổng bảo mật luôn xanh, tệ hơn không có cổng.
      # `continue-on-error` KHÔNG nới cổng: bước kế đọc `outcome` và exit 1.
      # Nó tồn tại để bước kế LUÔN chạy và IN bảng CVE. Bản trước dừng job ngay
      # tại đây khi có CRITICAL, nên bước `cat` không bao giờ chạy đúng lúc cần
      # nó nhất — log CI đỏ mà không nói CVE nào (đo 2026-09-02: phải kéo image
      # về quét tay mới biết là CVE-2026-56854 trong dockerd/buildx/oh-my-posh).
      - name: 'Trivy — CỔNG CHẶN ở CRITICAL (trước khi vào main)'
        id: trivy-critical
        continue-on-error: true
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: dlp-sandbox-base:pr
          format: table
          output: trivy-critical.txt
          exit-code: '1'
          severity: 'CRITICAL'
          timeout: '15m'

      - name: 'Trivy: khẳng định lượt quét ĐÃ chạy (chống xanh-vì-FATAL)'
        run: |
          set -euo pipefail
          [ -s trivy-critical.txt ] \
            || { echo '::error::trivy không ghi ra kết quả nào — nhiều khả năng FATAL khi tải DB. Cổng CRITICAL vừa rồi KHÔNG quét gì.'; exit 1; }
          cat trivy-critical.txt
          grep -qiE 'Report Summary|Total:|no vulnerabilities|Legend' trivy-critical.txt \
            || { echo '::error::output của trivy không có bảng tổng kết — không coi là đã quét.'; exit 1; }
          [ "${{ steps.trivy-critical.outcome }}" = success ] \
            || { echo '::error::Trivy tìm thấy CRITICAL — bảng ở ngay trên. Bump phiên bản, hoặc thêm CVE vào .trivyignore KÈM lý do + ngày rà lại.'; exit 1; }

  # ─────────────────────────────────────────────── cổng tổng hợp (required check)
  # ────────────────────────────────────────────────── test trình duyệt (xterm)
  terminal-browser:
    name: Terminal (Chromium — WebGL fallback + StrictMode)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # ⛔ TUYỆT ĐỐI KHÔNG thêm `paths:` cho job này. `ci-ok` là required check, và
    # một job bị skip-by-paths được GitHub báo `Expected — Waiting` VĨNH VIỄN ⇒
    # deadlock merge (rules/ci-cd-trigger-design.md §3). Job chạy mọi PR; nó tốn
    # ~1 phút nên không đáng đánh đổi lấy rủi ro đó.
    #
    # VÌ SAO JOB RIÊNG chứ không nhét vào `ts`: job `ts` chạy `turbo run test`,
    # tức mọi package. Cài chromium ở đó là bắt MỌI lượt chạy TS trả giá tải
    # trình duyệt, và khi đỏ thì không đọc ngay được là hỏng typecheck hay hỏng
    # trình duyệt. `packages/terminal` vì thế tách `test` (project `node`) khỏi
    # `test:browser` (hai project chromium) — xem package.json của nó.
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24

      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10

      - name: 'Bật cache pnpm (sau action-setup — cần pnpm trên PATH)'
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: pnpm

      - name: pnpm install
        run: pnpm install --frozen-lockfile

      # Khoá cache theo ĐÚNG version playwright trong lockfile. Khoá theo
      # `hashFiles('pnpm-lock.yaml')` thì mọi thay đổi dependency không liên quan
      # cũng thổi bay cache trình duyệt (~130 MB tải lại); khoá theo một hằng số
      # thì nâng playwright xong vẫn nạp browser cũ và `playwright install` phải
      # tải lại trong im lặng mỗi lượt.
      - name: 'Đọc version playwright (SSOT = lockfile đã cài)'
        id: pw
        run: |
          v=$(pnpm --filter @devops-platform/terminal exec playwright --version | awk '{print $2}')
          test -n "$v" || { echo "::error::không đọc được version playwright"; exit 1; }
          echo "version=$v" >> "$GITHUB_OUTPUT"

      - name: 'Cache trình duyệt Playwright'
        id: pw-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: ms-playwright-${{ runner.os }}-${{ steps.pw.outputs.version }}

      # `--with-deps` chỉ cần khi cache trượt: nó cài thư viện hệ thống của
      # chromium (apt), thứ KHÔNG nằm trong ~/.cache/ms-playwright nên cache hit
      # vẫn phải chạy bước deps riêng bên dưới.
      - name: 'Cài chromium (cache trượt)'
        if: steps.pw-cache.outputs.cache-hit != 'true'
        run: pnpm --filter @devops-platform/terminal exec playwright install --with-deps chromium

      - name: 'Cài thư viện hệ thống chromium (cache trúng)'
        if: steps.pw-cache.outputs.cache-hit == 'true'
        run: pnpm --filter @devops-platform/terminal exec playwright install-deps chromium

      # Hai project: `gpu-on` (mặc định, WebGL2 CÓ) và `gpu-off`
      # (`--disable-3d-apis`, WebGL2 KHÔNG). Mỗi project tự assert tiền đề WebGL
      # của nó trước mọi ca khác, nên một bản chromium đổi hành vi cờ làm job này
      # ĐỎ thay vì lặng lẽ chạy sai cảnh.
      - name: 'vitest browser mode (gpu-on + gpu-off)'
        run: pnpm --filter @devops-platform/terminal test:browser

  # ──────────────────────────────────────────────────── a11y + CSP (13.H / P13)
  web-a11y:
    name: 'Web (axe + CSP trên next start)'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    # ⛔ TUYỆT ĐỐI KHÔNG thêm `paths:` cho job này — nó nằm trong `ci-ok.needs`,
    # mà một job required bị skip-by-paths được GitHub báo `Expected — Waiting`
    # VĨNH VIỄN ⇒ deadlock merge (rules/ci-cd-trigger-design.md §3). Cùng lý do
    # đã ghi ở `terminal-browser`.
    #
    # VÌ SAO JOB RIÊNG chứ không nhét vào `ts`: job này phải BUILD rồi CHẠY
    # `next start` rồi lái một Chromium thật. Nhét vào `ts` là bắt mọi lượt chạy
    # TypeScript trả giá tải trình duyệt, và khi đỏ thì không đọc ngay được là
    # hỏng typecheck hay hỏng trình duyệt.
    #
    # PHẠM VI: chỉ `a11y.spec.ts` + `csp.spec.ts` (script `e2e:a11y`). KHÔNG chạy
    # `@flow`, `keyboard`, `perf` — cả ba cần phiên sandbox thật (orchestrator +
    # gateway + pod k8s) mà runner không có, hoặc một phép đo thời gian mà một
    # runner chia sẻ CPU không đo nổi. Chúng chạy tay trên cụm ở đợt 3.
    services:
      postgres:
        # Giá trị khớp .github/ci.env — credential GIẢ, sống vài phút trong runner.
        image: postgres:16-alpine
        env:
          POSTGRES_USER: dlp
          POSTGRES_PASSWORD: ci-only-password
          POSTGRES_DB: dlp
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U dlp -d dlp"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24

      - name: 'Nạp .github/ci.env vào môi trường job'
        run: grep -E '^[A-Z][A-Z0-9_]*=' .github/ci.env >> "$GITHUB_ENV"

      - name: 'Start Redis (requirepass — services: không cho đặt CMD)'
        run: |
          docker run -d --name ci-redis-a11y -p 6379:6379 redis:7-alpine \
            redis-server --requirepass "$REDIS_PASSWORD"
          ok=""
          for _ in $(seq 1 30); do
            if docker exec ci-redis-a11y redis-cli -a "$REDIS_PASSWORD" ping 2>/dev/null | grep -q PONG; then
              ok=1; break
            fi
            sleep 1
          done
          if [ -z "$ok" ]; then
            echo "Redis không PONG sau 30s"; docker logs ci-redis-a11y; exit 1
          fi

      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10

      - name: 'Bật cache pnpm (sau action-setup — cần pnpm trên PATH)'
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: pnpm

      - name: pnpm install
        run: pnpm install --frozen-lockfile

      # Khoá cache theo ĐÚNG version playwright trong lockfile — cùng khuôn với
      # job `terminal-browser`. `@playwright/test` của apps/web được ghim CHÍNH
      # XÁC 1.62.1 để trùng `playwright` của packages/terminal, nên hai job DÙNG
      # CHUNG một cache trình duyệt thay vì tải hai bản.
      - name: 'Đọc version playwright (SSOT = lockfile đã cài)'
        id: pw
        run: |
          v=$(pnpm --filter @devops-platform/web exec playwright --version | awk '{print $2}')
          test -n "$v" || { echo "::error::không đọc được version playwright"; exit 1; }
          echo "version=$v" >> "$GITHUB_OUTPUT"

      - name: 'Cache trình duyệt Playwright'
        id: pw-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: ms-playwright-${{ runner.os }}-${{ steps.pw.outputs.version }}

      - name: 'Cài chromium (cache trượt)'
        if: steps.pw-cache.outputs.cache-hit != 'true'
        run: pnpm --filter @devops-platform/web exec playwright install --with-deps chromium

      - name: 'Cài thư viện hệ thống chromium (cache trúng)'
        if: steps.pw-cache.outputs.cache-hit == 'true'
        run: pnpm --filter @devops-platform/web exec playwright install-deps chromium

      - name: DB migrate (Drizzle)
        run: pnpm --filter @devops-platform/web db:migrate

      # `paths.*` + `quiz.*` đọc THẲNG Postgres — hai loại nội dung duy nhất KHÔNG
      # có nguồn đĩa (lesson/lab/playground đi qua `filesystemScenarioSource` nên có
      # mặt ngay sau build). Thiếu bước này thì `learning_paths`/`quizzes` rỗng và
      # `/paths/:id` + `/quiz/:id` đỏ với "trả 0 mục" — đo ở run 34130030953:
      # 4 failed sau `db:migrate`, 0 failed sau khi seed, biến duy nhất là lệnh này.
      - name: 'Nạp lộ trình + quiz (không có nguồn đĩa)'
        run: node scripts/seed-content.mjs

      # `next start` đòi một bản build có sẵn. Playwright tự spawn `pnpm start`
      # (webServer, chỉ bật khi E2E_START_SERVER=1) nên bước build phải đứng
      # trước — thiếu nó thì server chết ngay và triệu chứng là "spec timeout".
      - name: Build web
        run: pnpm turbo run build --filter=@devops-platform/web

      # E2E_BASE_URL phải là localhost: playwright.config.ts TỪ CHỐI chạy khi
      # E2E_START_SERVER=1 mà URL trỏ ra ngoài máy (dựng server cục bộ rồi đo
      # một cụm khác là cái sai không dòng log nào nói ra).
      #
      # E2E_ORIGIN = BETTER_AUTH_URL trong .github/ci.env. Ở đây hai giá trị
      # TÌNH CỜ bằng nhau; chúng vẫn là hai biến vì Origin là thứ Better Auth
      # đối chiếu, còn base là nơi ta điều hướng tới (xem apps/web/e2e/env.ts).
      - name: 'axe + CSP (a11y.spec.ts, csp.spec.ts)'
        env:
          E2E_START_SERVER: '1'
          E2E_BASE_URL: http://localhost:3000
          E2E_ORIGIN: http://localhost:3000
        run: pnpm --filter @devops-platform/web e2e:a11y

      # Chẩn đoán cho lượt đỏ, in THẲNG vào log job.
      #
      # CỐ Ý KHÔNG dùng actions/upload-artifact: mọi action trong file này được
      # ghim theo SHA (xem khối đầu file), và thêm một action mới đòi một SHA đã
      # xác minh. Dán một SHA chưa kiểm là đúng thứ mà luật ghim-SHA sinh ra để
      # ngăn. Bản dưới không cần action nào; nâng lên upload-artifact khi có SHA
      # đã xác minh là một thay đổi một dòng.
      - name: 'Chẩn đoán khi đỏ'
        if: failure()
        run: |
          ls -R apps/web/e2e/.artifacts/ 2>/dev/null || echo '(không có .artifacts/)'
          echo '--- results.json (200 dòng đầu) ---'
          head -c 20000 apps/web/e2e/.artifacts/results.json 2>/dev/null || echo '(không có results.json)'

  # ──────────────────────────────────────────────── lệnh cấm thương mại (13.H)
  #
  # Nền tảng này KHÔNG bán khoá học. Ràng buộc nặng nhất của dự án, chủ dự án
  # nêu hai lần. Cổng này là phép kiểm duy nhất gác nó.
  #
  # TRƯỚC ĐÂY CỔNG NÀY KHÔNG TỒN TẠI. Phép kiểm là một chuỗi `grep` dài dán
  # trong `plans/devops-learning-platform/phase-13-exec.md` §5, và grep toàn bộ
  # `.github/workflows/` cho ra 0 kết quả — tức nó chỉ chạy khi có người nhớ
  # chạy. Ngoài ra chính mẫu bắt của nó cũng lọt 4 hình dạng paywall tiếng Việt
  # (đo 2026-09-06). Cả hai lỗ được vá cùng lúc bởi `scripts/check-no-commerce.mjs`.
  #
  # KHÔNG `paths:` Ở ĐÂY, và cũng không được thêm về sau. `no-commerce` nằm
  # trong `ci-ok.needs`, mà `ci-ok` là required check duy nhất của branch
  # protection. GitHub báo một required check bị skip-by-paths là
  # `Expected — Waiting` VĨNH VIỄN ⇒ khoá merge. Muốn bỏ qua có điều kiện thì
  # dùng `if:` ở mức step, đừng đụng `paths:` (rules/ci-cd-trigger-design.md #3).
  #
  # Không `pnpm install`: script không có dependency nào, chỉ cần Node. Job này
  # là job rẻ nhất trong workflow (~20s), nên không có lý do gì để lọc nó.
  no-commerce:
    name: 'Lệnh cấm thương mại (không bán khoá học)'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24

      # Script tự chạy đối chứng dương TRƯỚC khi quét: nếu nó không còn bắt
      # được tập mẫu vi phạm đã biết thì thoát 2 và không quét gì cả. Nghĩa là
      # job này không thể xanh trong tình trạng "cổng đã hỏng nhưng cây sạch".
      - name: 'Quét chuỗi giá / gói cước / thanh toán / paywall'
        run: node scripts/check-no-commerce.mjs

  ci-ok:
    name: ci-ok
    # `always()` để job vẫn chạy KHI CÓ need thất bại/bị skip — nếu không, nó bị
    # skip theo và branch protection thấy một check "chưa chạy", treo PR mãi mãi.
    if: always()
    needs: [proto, ts, go, infra, secret-scan, sandbox-image, terminal-browser, web-a11y, no-commerce]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: 'Mọi cổng phải success (hoặc skipped hợp lệ)'
        # BẪY KINH ĐIỂN: `if: always()` mà không kiểm results thì job này LUÔN
        # xanh và cổng tổng hợp trở thành cổng giả — tệ hơn không có cổng, vì
        # nhìn thì tưởng có.
        #
        # 'skipped' được CHẤP NHẬN vì một job có `if:` không khớp là ý đồ, không
        # phải lỗi. ĐÁNH ĐỔI đã biết: một job bị skip NGOÀI Ý MUỐN (vd điều kiện
        # `if` viết sai) sẽ lọt qua cổng này. Đổi lấy việc không phải sửa danh
        # sách needs mỗi lần thêm một job chạy có điều kiện.
        # 'failure' và 'cancelled' thì không bao giờ được chấp nhận.
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "kết quả các cổng: $RESULTS"
          for r in $RESULTS; do
            case "$r" in
              success|skipped) ;;
              *) echo "::error::có cổng không đạt (trạng thái: $r)"; exit 1 ;;
            esac
          done
          echo "tất cả cổng đạt."

  # ──────────────────────────────────────────────────────────── build & push img
  images:
    name: 'Build & push: ${{ matrix.name }}'
    needs: ci-ok
    # Chỉ build/push khi mọi cổng xanh VÀ đang ở push main hoặc tag v* — PR không
    # cần tốn phút build 4 image.
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
      # build-push-action ký provenance/SBOM bằng OIDC token của run.
      # KHÔNG có `security-events: write` — Trivy nay in ra log, không nộp SARIF.
      id-token: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: web
            image: dlp-web
            dockerfile: apps/web/Dockerfile
            context: .
          # Image RIÊNG cho migration Drizzle — xem stage `migrator` trong
          # apps/web/Dockerfile để biết vì sao không gộp vào image runtime.
          - name: migrator
            image: dlp-migrator
            dockerfile: apps/web/Dockerfile
            context: .
            target: migrator
          - name: orchestrator
            image: dlp-orchestrator
            dockerfile: services/orchestrator/Dockerfile
            context: .
          - name: terminal-gateway
            image: dlp-terminal-gateway
            dockerfile: services/terminal-gateway/Dockerfile
            context: .
          - name: sandbox-base
            image: dlp-sandbox-base
            dockerfile: images/sandbox-base/Dockerfile
            context: images/sandbox-base
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: 'Metadata (tag sha-<ngắn> + latest trên main)'
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          # Owner GHCR bắt buộc lowercase — khớp infra/helm/platform/values.yaml.
          # `dev` (tag local dùng trong values.yaml) KHÔNG sinh ở đây — CI đóng
          # tag theo sha ngắn + latest trên main, `dev` chỉ để build tay ở máy dev.
          images: ghcr.io/nghaiz/${{ matrix.image }}
          tags: |
            type=sha,prefix=sha-,format=short
            type=raw,value=latest,enable={{is_default_branch}}

      # ⛔ THỨ TỰ: build (KHÔNG push) → quét → chỉ push khi cổng xanh.
      #
      # Bản trước đặt `push: true` ngay ở bước build và để cả hai bước Trivy chạy
      # SAU — nghĩa là một image CRITICAL đã nằm trên ghcr dưới cả `sha-…` lẫn
      # `latest` trước khi cổng kịp đỏ; cổng chỉ tô đỏ run chứ không chặn artifact.
      # Và phạm vi rộng hơn vẻ ngoài: job `sandbox-image` (PR-time) chỉ gác
      # `sandbox-base`, nên với `web`/`migrator`/`orchestrator`/`terminal-gateway`
      # thì đây là cổng DUY NHẤT. Khuôn dưới đây chép từ chính job đó.
      - id: build
        name: 'Build ĐỂ QUÉT (chưa push)'
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          # Rỗng với mọi hàng trừ `migrator` — buildx hiểu chuỗi rỗng là "dùng
          # stage cuối", đúng hành vi cũ của bốn hàng còn lại.
          target: ${{ matrix.target }}
          push: false
          # `load: true` đưa image vào docker cục bộ của runner để Trivy quét
          # được. Tag CỤC BỘ, không mang tên registry: một tag `ghcr.io/…` nằm
          # trong docker cục bộ trông hệt tag đã push, và người đọc log sau này
          # không phân biệt được hai thứ.
          load: true
          tags: ${{ matrix.image }}:scan
          labels: ${{ steps.meta.outputs.labels }}
          # Cache layer giữa các run — không có nó thì mỗi lần push main là build
          # lại `pnpm install` + `next build` từ số 0. `cache-to` nằm ở lượt NÀY
          # để lượt push bên dưới là một cache hit thuần.
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,scope=${{ matrix.name }},mode=max
          # ⛔ KHÔNG `sbom`/`provenance` ở đây: docker exporter (thứ `load: true`
          # dùng) không nhận attestation và buildx sẽ đỏ. Chúng thuộc lượt push.

      # HAI bước Trivy, có chủ ý — một để ĐỌC, một để CHẶN.
      #
      # Gộp làm một thì phải chọn: `severity: CRITICAL` là mất hẳn danh sách HIGH
      # khỏi log, còn `severity: HIGH,CRITICAL` + `exit-code: 1` là chặn cả HIGH.
      # Mà 3 CVE HIGH còn lại do next@15.5.23 ghim (postcss, sharp) — mình KHÔNG
      # tự vá được, nên chặn ở HIGH là main đỏ dài hạn vì lỗi thượng nguồn, và
      # đó là cách nhanh nhất để tập cho người ta phớt lơ màu đỏ.
      - name: 'Trivy — báo cáo HIGH + CRITICAL (không chặn)'
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          # ⛔ Quét TAG CỤC BỘ, không phải digest registry. Bản trước dùng
          # `…@${{ steps.build.outputs.digest }}`; với `push: false` thì digest
          # ấy CHƯA TỒN TẠI, nên để nguyên là bước quét trỏ vào một tham chiếu
          # rỗng — đúng ca "xanh mà chưa quét gì".
          image-ref: ${{ matrix.image }}:scan
          # `table` ra thẳng log, KHÔNG PHẢI `sarif` + upload-sarif. Nộp SARIF
          # đòi code scanning, thứ cần GitHub Advanced Security trên repo private
          # — bản trước dùng SARIF và sẽ đỏ ngay lần merge đầu vào main (job này
          # bị skip trên PR nên lỗi đó không lộ ra ở PR).
          format: table
          exit-code: '0'
          severity: 'HIGH,CRITICAL'
          timeout: '15m'

      # `continue-on-error` + `outcome` ở bước kế: cùng lý lẽ với job
      # `sandbox-image` — cổng vẫn chặn, nhưng bảng CVE phải được IN ra.
      - name: 'Trivy — CỔNG CHẶN ở CRITICAL (TRƯỚC push)'
        id: trivy-critical-push
        continue-on-error: true
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ matrix.image }}:scan
          format: table
          output: trivy-critical.txt
          exit-code: '1'
          severity: 'CRITICAL'
          timeout: '15m'
          # `ignore-unfixed: false` (mặc định) giữ nguyên: một CRITICAL chưa có
          # bản vá vẫn là thứ phải BIẾT và quyết định có ship hay không, không
          # phải thứ tự động bỏ qua. Cần bỏ qua một CVE cụ thể thì thêm vào
          # .trivyignore kèm lý do và ngày rà lại — không nới cả ngưỡng.

      # ⛔ `--exit-code 1` trả 0 KHÔNG có nghĩa "0 CRITICAL": Trivy FATAL khi
      # không tải được DB lỗ hổng, và một cổng đọc mỗi mã trả về sẽ cho qua đúng
      # lượt chưa quét được gì. Khuôn này chép từ job `sandbox-image`.
      - name: 'Khẳng định lượt quét ĐÃ THẬT SỰ chạy'
        run: |
          test -s trivy-critical.txt || {
            echo "::error::Trivy không sinh báo cáo — nhiều khả năng FATAL trước khi quét"; exit 1; }
          grep -qiE 'Report Summary|Total:|no vulnerabilities|Legend' trivy-critical.txt || {
            echo "::error::báo cáo Trivy không có dấu hiệu của một lượt quét hoàn tất"; cat trivy-critical.txt; exit 1; }
          cat trivy-critical.txt
          [ "${{ steps.trivy-critical-push.outcome }}" = success ] || {
            echo "::error::Trivy tìm thấy CRITICAL — bảng ở ngay trên. Bump phiên bản, hoặc thêm CVE vào .trivyignore KÈM lý do + ngày rà lại."; exit 1; }
          echo "lượt quét hoàn tất, 0 CRITICAL."

      # Cổng đã xanh — giờ mới publish. Lượt này là cache hit thuần từ `cache-from`
      # ở trên, nên chi phí gần như chỉ là thời gian export + upload layer.
      - id: push
        name: 'Push lên ghcr (chỉ khi cổng CRITICAL xanh)'
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          target: ${{ matrix.target }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.name }}
          # SBOM + provenance (SLSA) đính kèm image: trả lời được "image này chứa
          # package gì, sinh ra từ commit nào, bằng workflow nào" mà không phải
          # tin vào trí nhớ. Bắt buộc khi tới lúc phải rà một CVE mới công bố.
          sbom: true
          provenance: mode=max

      # ⚠ RỦI RO TỒN DƯ, nói thẳng thay vì để người đọc tưởng cổng này kín:
      # tách làm hai lượt build nghĩa là thứ được push không được CHỨNG MINH là
      # bit-identical với thứ vừa quét. Trên thực tế hai lượt chạy trong cùng một
      # job, từ cùng một checkout, và lượt sau là cache hit thuần từ `cache-from`
      # — nên khả năng lệch là lý thuyết, không phải vận hành.
      #
      # Đã cân nhắc và LOẠI một phép so `imageid` giữa hai lượt: với `load: true`
      # thì `imageid` là config ID của docker, còn với `push: true` kèm
      # `provenance`/`sbom` thì iidfile chứa digest của MANIFEST LIST. Hai đại
      # lượng khác loại, nên phép so sẽ đỏ ở mọi lượt chạy đúng — và vì job này
      # chỉ chạy trên `main`, cái đỏ đó không lộ ra ở PR nào cả. Một cổng luôn
      # đỏ vì lý do sai còn tệ hơn không có cổng.
      #
      # Muốn khử hẳn phần tồn dư này thì đường đúng là `push-by-digest` rồi mới
      # gắn tag sau khi quét — đắt hơn và thuộc P3, không thuộc chặng kế toán này.
