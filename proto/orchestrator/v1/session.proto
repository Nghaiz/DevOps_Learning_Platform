syntax = "proto3";

// Contract SSOT giữa apps/web (BFF tRPC) và services/orchestrator (Go).
// Không đầu nào được tự chế shape — sửa ở đây rồi `make proto`.
// Ranh giới tRPC / gRPC / OpenAPI: xem proto/README.md.
package orchestrator.v1;

import "google/protobuf/timestamp.proto";

option go_package = "github.com/Nghaiz/DevOps_Learning_Platform/proto/gen/go/orchestrator/v1;orchestratorv1";

// SandboxTier chọn mức cô lập của pod lab (design §5).
// Tier1 = Sysbox (unprivileged user-ns). Tier2 = gVisor/Kata cho lab CTF.
//
// FAIL-CLOSED: server PHẢI từ chối UNSPECIFIED bằng InvalidArgument, KHÔNG được
// suy ra tier mặc định. Đây là field chọn mức cô lập — client quên set mà server
// đoán hộ nghĩa là âm thầm chạy lab ở mức yếu hơn ý định của người gọi.
enum SandboxTier {
  SANDBOX_TIER_UNSPECIFIED = 0;
  SANDBOX_TIER_SYSBOX = 1;
  SANDBOX_TIER_GVISOR = 2;
  SANDBOX_TIER_KATA = 3;
}

// SessionStatus là vòng đời của một session lab.
// PENDING → WARM (pool) → CLAIMED → RUNNING → EXPIRED → REAPED. FAILED là nhánh lỗi.
enum SessionStatus {
  SESSION_STATUS_UNSPECIFIED = 0;
  SESSION_STATUS_PENDING = 1;
  SESSION_STATUS_WARM = 2;
  SESSION_STATUS_CLAIMED = 3;
  SESSION_STATUS_RUNNING = 4;
  SESSION_STATUS_EXPIRED = 5;
  SESSION_STATUS_REAPED = 6;
  SESSION_STATUS_FAILED = 7;
}

// Session là trạng thái quyền uy của một pod lab.
// SSOT của session sống ở Redis (`session:{id}`), KHÔNG nhân bản sang Postgres
// (plan.md §4 "SSOT & no-derived-fields"). Postgres chỉ giữ audit trail.
message Session {
  string id = 1;
  string user_id = 2;
  SessionStatus status = 3;
  // Rỗng khi status = PENDING (pod chưa được cấp).
  string pod_name = 4;
  string namespace = 5;
  // Rỗng cho đến khi session được claim; TTL bắt đầu đếm từ lúc claim.
  google.protobuf.Timestamp expires_at = 6;
  SandboxTier tier = 7;
  google.protobuf.Timestamp created_at = 8;

  // Bộ đếm tăng đơn điệu, +1 mỗi lần server ghi session. Dùng cho optimistic
  // locking: mọi cập nhật trên một session đang chạy là read-modify-write từ
  // MỘT tiến trình KHÁC với tiến trình đã tạo nó (gateway gia hạn TTL trong khi
  // reaper của orchestrator có thể đang reap cùng session). Không có revision
  // thì cập nhật cuối thắng một cách im lặng — gateway có thể hồi sinh một
  // session vừa bị reap.
  //
  // Server-side là INCR của Redis trên chính hash session, đọc ra cùng lượt với
  // các field khác nên không phải derived field.
  int64 revision = 9;

  // Profile resources CÓ TÊN của pod (P7 7.C — ví dụ "k8s" cho lab
  // Kubernetes-trong-pod cần nhiều RAM hơn LimitRange mặc định). RỖNG = profile
  // MẶC ĐỊNH: pod không mang resources tường minh, LimitRange của namespace là
  // nơi DUY NHẤT quyết định requests/limits — y hệt hành vi trước P7 7.C.
  string profile = 10;
}

message CreateSessionRequest {
  string user_id = 1;
  // UNSPECIFIED bị từ chối (InvalidArgument) — xem SandboxTier.
  SandboxTier tier = 2;
  // Thời gian sống mong muốn. 0 = dùng mặc định của server. Âm → InvalidArgument.
  int32 ttl_seconds = 3;

  // Khoá chống trùng, do client sinh. BẮT BUỘC.
  //
  // Không có nó thì gRPC retry hoặc user bấm F5 sẽ tạo HAI pod cho một ý định —
  // pod sandbox tốn tiền thật và ăn quota. Server dedupe qua Redis SETNX và trả
  // lại đúng session cũ khi thấy key đã tồn tại.
  string idempotency_key = 4;

  // Profile resources CÓ TÊN cho pod (P7 7.C). RỖNG = profile MẶC ĐỊNH — pod
  // đi qua warm-pool y hệt hôm nay, không mang resources tường minh.
  //
  // FAIL-CLOSED, CÙNG NGUYÊN TẮC VỚI SandboxTier: một tên KHÔNG khớp bất kỳ
  // profile nào server biết (`SANDBOX_PROFILES`) bị từ chối bằng InvalidArgument
  // — server KHÔNG BAO GIỜ tự rơi về profile mặc định. Client đánh máy sai tên
  // profile mà server âm thầm cấp profile mặc định nghĩa là một bài K8s-trong-pod
  // (cần ~2Gi) nhận đúng 1Gi LimitRange mặc định rồi OOM giữa chừng, và không
  // lỗi nào ở phía client nói vì sao.
  string profile = 5;
}

message CreateSessionResponse {
  Session session = 1;
}

// ClaimSession gắn một session WARM trong pool cho user. Phải atomic —
// hai request đồng thời không được claim cùng một pod (risk score 16, plan.md §5).
message ClaimSessionRequest {
  string session_id = 1;
  string user_id = 2;
}

message ClaimSessionResponse {
  Session session = 1;
}

message GetSessionRequest {
  string session_id = 1;
  // Bắt buộc: server kiểm object-level authz (luật 1) chứ không tin client.
  string user_id = 2;
}

message GetSessionResponse {
  Session session = 1;
}

// ReapSession phải idempotent — gọi lại trên session đã reap vẫn trả OK.
message ReapSessionRequest {
  string session_id = 1;
  string reason = 2;

  // Ai yêu cầu reap. BẮT BUỘC — không set thì server trả InvalidArgument.
  //
  // session_id KHÔNG phải secret (nó nằm trong URL /ws/session/{id}), nên nếu
  // thiếu field này thì "biết id = xoá được session của người khác". Các RPC
  // khác đều mang user_id để kiểm object-level authz (luật 1); reap không được
  // là ngoại lệ im lặng.
  oneof actor {
    // User tự kết thúc session — server kiểm session.user_id khớp.
    string user_id = 3;
    // Tiến trình nội bộ (reaper TTL, drain node). Chỉ chấp nhận trên đường
    // trong cluster, không expose ra ingress.
    string system_component = 4;
  }
}

message ReapSessionResponse {
  Session session = 1;
}

// ExtendSession đẩy idle-deadline của một session đang chạy về phía trước.
//
// TỒN TẠI ĐỂ GIỮ CONTRACT KÍN. terminal-gateway phải báo "phiên này còn người
// dùng" cho reaper, nếu không learner đang gõ lệnh ở phút 59 sẽ bị reap giữa
// chừng. Không có RPC này thì việc gia hạn buộc phải chui qua đường WS hoặc ghi
// thẳng Redis từ gateway — cả hai đều là kênh thứ hai giữa Next/gateway và
// orchestrator mà contract không mô tả, đúng thứ file này tồn tại để chặn.
//
// HAI ĐỒNG HỒ, KHÔNG PHẢI MỘT:
//   - idle deadline — gia hạn được, mỗi lần WS còn traffic.
//   - hard cap (tính từ created_at, cấu hình phía server) — KHÔNG gia hạn được.
// Server ép `expires_at` mới = min(now + extend_seconds, created_at + hard_cap).
// Vì thế RPC này KHÔNG BAO GIỜ là đường giữ pod sống vĩnh viễn: một client bị
// chiếm quyền spam heartbeat cũng chỉ giữ được tới trần cứng.
message ExtendSessionRequest {
  string session_id = 1;
  // Bắt buộc — object-level authz (luật 1), y như GetSession/ClaimSession.
  // Gateway điền từ `sub` của token đã verify, KHÔNG lấy từ input client.
  string user_id = 2;
  // Số giây muốn đẩy thêm kể từ NOW. 0 = dùng idle-window mặc định của server.
  // Âm → InvalidArgument.
  int32 extend_seconds = 3;
  // Revision client tin là mình đang thấy (Session.revision). 0 = bỏ qua kiểm.
  // Khác revision hiện tại → FailedPrecondition, client đọc lại rồi thử lại.
  // Đây là thứ chặn gateway hồi sinh một session mà reaper vừa chuyển sang
  // EXPIRED giữa lúc gateway đang đọc-rồi-ghi.
  int64 expected_revision = 4;
}

message ExtendSessionResponse {
  Session session = 1;
  // true khi expires_at đã bị hard cap cắt, tức lần gia hạn sau sẽ không đẩy
  // thêm được nữa. Cho FE báo trước "phiên sắp hết hạn" thay vì để terminal
  // chết đột ngột.
  bool hard_cap_reached = 2;
}

// GetCapacity trả sức chứa nền tảng NGAY LÚC GỌI — không cache, không lưu lại
// phía server. Sẵn cho MỌI user đã đăng nhập (không cần quyền admin) — xem
// contract phase-13 §2 C3.
message GetCapacityRequest {}
message GetCapacityResponse {
  int32 active_sessions = 1; // len(pool:claimed) — cùng nguồn với dlp_pool_claimed_size
  int32 soft_capacity = 2; // env CAPACITY_SOFT_LIMIT (Helm: orchestrator.env.capacitySoftLimit = 20)
  int32 pool_free = 3;
  int32 pool_quarantine = 4;
}

// ListSessions liệt kê session ĐANG SỐNG (status < EXPIRED), lọc theo user_id.
//
// ⛔ KHÔNG CÓ INDEX RIÊNG THEO user_id — docs/redis-key-namespace.md chốt SSOT
// của session là hash `session:{id}`, không có secondary index nào khác. Server
// quét toàn bộ `session:*` bằng SCAN (cùng cơ chế reaper.sweepGhostSessions
// đang dùng), lọc + sắp theo id tăng dần trong bộ nhớ rồi phân trang bằng
// cursor = id cuối trang trước. Ở quy mô hiện tại (trần vài chục session đồng
// thời, D16) đây là lựa chọn ĐÚNG — dựng thêm một index Redis cho vài chục
// phần tử là phức tạp hoá đổi lấy thứ chưa cần.
//
// Authz: RPC này TIN user_id do caller gửi, giống mọi RPC khác của contract
// này (GetSession, ClaimSession, ExtendSession, …) — orchestrator không tự xác
// thực người dùng cuối, nó tin BFF (apps/web) đã làm việc đó trước khi gọi tới
// đây. Quyết định "ai được gửi user_id RỖNG (mọi user) hay user_id của người
// KHÁC mình" thuộc về tầng BFF (adminProcedure vs protected — xem phase-13 §2
// C4), KHÔNG phải orchestrator: message này không mang field vai trò nào để tự
// kiểm, và thêm field đó là phá tính additive của C3 — orchestrator không được
// tự vẽ thêm shape ngoài hợp đồng đã chốt.
message ListSessionsRequest {
  string user_id = 1; // rỗng = mọi user (chỉ admin); khác rỗng = phải trùng caller trừ khi admin
  int32 limit = 2; // 1..100, 0 = 20
  string cursor = 3; // session id cuối trang trước; rỗng = từ đầu
}
message ListSessionsResponse {
  repeated Session sessions = 1; // chỉ phiên KHÔNG ở trạng thái terminal (status < EXPIRED)
  string next_cursor = 2; // rỗng = hết
}

service SessionService {
  rpc CreateSession(CreateSessionRequest) returns (CreateSessionResponse);
  rpc ClaimSession(ClaimSessionRequest) returns (ClaimSessionResponse);
  rpc GetSession(GetSessionRequest) returns (GetSessionResponse);
  rpc ExtendSession(ExtendSessionRequest) returns (ExtendSessionResponse);
  rpc ReapSession(ReapSessionRequest) returns (ReapSessionResponse);
  rpc GetCapacity(GetCapacityRequest) returns (GetCapacityResponse);
  rpc ListSessions(ListSessionsRequest) returns (ListSessionsResponse);
}
