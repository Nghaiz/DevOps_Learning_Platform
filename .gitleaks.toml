# Cấu hình gitleaks. Kế thừa toàn bộ rule mặc định rồi CHỈ thêm allowlist.
#
# Nguyên tắc của file này: allowlist theo ĐƯỜNG DẪN + NỘI DUNG CỤ THỂ, không bao
# giờ theo rule. Tắt cả một rule (vd `generic-api-key`) để im một dương tính giả
# là tắt luôn khả năng bắt cái thật cùng loại — đúng cách để một secret thật lọt
# qua mà không ai biết.
title = "DevOps Learning Platform"

[extend]
useDefault = true

[allowlist]
description = "Placeholder và credential dùng-một-lần-trong-runner"

paths = [
  # File .env.example chỉ chứa placeholder ("đổi-cái-này", "placeholder-...").
  # Giá trị THẬT nằm ở .env, vốn bị .gitignore chặn — nếu .env lọt vào git thì
  # gitleaks vẫn phải quét nó, nên KHÔNG allowlist theo pattern `.env` chung chung.
  '''(^|/)\.env\.example$''',
  '''(^|/)\.env\..*\.example$''',

  # Credential GIẢ của runner CI. Xem phần đầu file đó để biết vì sao nó có
  # trong git. Cả hai mật khẩu chỉ mở khoá container sống vài phút rồi bị xoá.
  '''^\.github/ci\.env$''',

  # Template secret của Helm — chỉ có tên khoá và hướng dẫn, không có giá trị.
  '''^infra/helm/platform/values-secrets\.example\.yaml$''',

  # Bộ kịch bản pentest của competitor dùng để đối chiếu ở P3 — chứa credential
  # mẫu trong tài liệu của họ, không phải của hệ này. Thư mục đã gitignore.
  '''^secure-test-devops/''',
]

regexes = [
  # Chuỗi mà chính CI đặt ra, nhìn giống secret với rule generic. Neo theo giá
  # trị chính xác, không theo tiền tố lỏng lẻo.
  '''ci-only-password''',
  '''ci-only-secret-khong-dung-o-bat-ky-dau-khac''',
  '''ci-only-not-a-real-secret''',

  # Nonce MẪU của RFC 6455 §1.3 ("the sample nonce" base64) dùng trong lệnh curl
  # tái hiện handshake WebSocket ở tài liệu. Sec-WebSocket-Key không phải khoá bí
  # mật — nó là giá trị ngẫu nhiên client tự sinh mỗi lần bắt tay. Neo theo đúng
  # giá trị trong RFC, không nới ra cả header.
  '''dGhlIHNhbXBsZSBub25jZQ==''',

  # ───────────────────────────────────────────────────────────────────────────
  # DANH SÁCH ĐÓNG — 4 fixture của commit 451a595, thêm 2026-09-14.
  #
  # ⛔ ĐỪNG THÊM DÒNG NÀO VÀO KHỐI NÀY. Nó tồn tại để dọn một commit đã nằm sẵn
  #    trong lịch sử, KHÔNG phải để làm chỗ đổ cho fixture mới. Fixture mới phải
  #    đặt tên theo quy ước `ci-only-*` ở ba dòng đầu allowlist này — một dòng
  #    đã có sẵn sẽ phủ, và danh sách không dài thêm. Khối này chỉ được co lại,
  #    không bao giờ nở ra.
  #
  # Chúng là gì: 3 mật khẩu và 1 token GIẢ trong test đặt lại mật khẩu, do
  # `generic-api-key` bắt vì hình dạng chữ-số. Không giá trị nào mở được gì:
  # chúng chỉ chạy trong Postgres/SMTP dựng tạm của runner rồi biến mất cùng
  # container. Đọc thẳng từ commit 2026-09-14:
  #
  #   apps/web/src/security/password-reset.integration.test.ts:43  OLD_PASSWORD
  #   apps/web/src/security/password-reset.integration.test.ts:44  NEW_PASSWORD
  #   apps/web/src/security/password-reset.integration.test.ts:219 newPassword
  #   apps/web/src/server/auth/mail.test.ts:137                    fakeToken
  #
  # Bán kính đã ĐO, không suy đoán: `git log --all -S<giá trị>` cho ĐÚNG MỘT
  # commit (451a595) cho cả bốn, và `git grep` trong cây làm việc cho 0 kết quả.
  # Nên bốn dòng dưới không che được gì ngoài chính commit đó.
  #
  # ─── NỬA CHỐNG-ÔI: khi nào bốn dòng này thành rác, và ai xoá ───────────────
  #
  # Chúng chỉ còn đáng giữ chừng nào 451a595 còn được tham chiếu tới. Kiểm bằng
  # một lệnh, mất một giây:
  #
  #     git branch -a --contains 451a595
  #
  #   · CÓ ra ref  ⇒ còn cần, giữ nguyên.
  #   · KHÔNG ra gì ⇒ bốn dòng này đã thành rác, XOÁ CẢ KHỐI ngay trong lượt đó.
  #
  # Ai xoá: người gỡ nhánh `lane/p16d-auth` (đó là ref duy nhất còn giữ commit
  # này — cả bản local lẫn bản trên origin). Gộp nhánh KHÔNG tự làm khối này
  # hết hạn: squash-merge giữ nguyên ref của lane, nên commit vẫn được quét.
  #
  # Cách đóng lại cho đẹp, nếu có ai đụng vào lane này lần nữa: đổi tên bốn
  # fixture sang quy ước `ci-only-*` ngay trong lượt đó, rồi xoá khối này — chứ
  # không phải viết thêm ngoại lệ. Không làm ở đây được vì việc đó cần viết lại
  # lịch sử một nhánh đã push.
  '''MatKhauCu-12345''',
  '''MatKhauMoi-67890''',
  '''MotMatKhauDaiHon-1''',
  '''tokAbc123XYZ''',
]
