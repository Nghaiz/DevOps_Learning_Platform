apiVersion: v1
kind: Pod
metadata:
  name: ide-verify
  namespace: default
spec:
  runtimeClassName: sysbox-runc
  hostUsers: false
  restartPolicy: Never
  containers:
    - name: sandbox
      image: ghcr.io/nghaiz/dlp-sandbox-base:ide-probe
      imagePullPolicy: Never
      resources:
        requests: {cpu: "250m", memory: "256Mi"}
        limits:   {cpu: "2",    memory: "1Gi"}
