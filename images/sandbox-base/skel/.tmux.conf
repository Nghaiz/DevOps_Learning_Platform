# .tmux.conf — E4 / D17.
#
# tmux ở đây KHÔNG phải công cụ cho sinh viên dùng, nó là CƠ CHẾ RECONNECT (D3):
# gateway exec vào `tmux new-session -A -s dlp`, nên mất mạng rồi vào lại là
# attach lại đúng session cũ thay vì sinh một shell trắng.

# ⛔ BẮT BUỘC — D17/E4. Status bar ăn ĐÚNG một dòng: client 200×50 cho window
# 200×49, nên `stty size` trong pod luôn lệch 1 so với `rows` mà FE gửi, và AC
# resize sẽ phải mang một số magic "trừ 1" — thứ không ai nhớ được vì sao. Tắt
# đi thì kích thước khớp tuyệt đối. Sinh viên cũng không cần status bar.
set -g status off

# Shell mặc định là zsh (E4) mà KHÔNG cần `chsh`: tmux là đường vào duy nhất
# nên đặt ở đây là đủ, và không phải sửa /etc/passwd trong image.
set -g default-shell /usr/bin/zsh

# Truecolor bên trong tmux. `tmux-256color` cần terminfo entry cùng tên — đó là
# lý do Dockerfile cài `ncurses-term`. `*:RGB` là cách hiện hành để khai màu
# 24-bit (thay cho `Tc` của bản cũ).
set -g default-terminal "tmux-256color"
set -ga terminal-overrides ",*256col*:RGB"

# ⛔ mouse TẮT có chủ ý. Bật `mouse on` là tmux CHIẾM sự kiện chuột: trong
# xterm.js, kéo chuột để bôi đen output sẽ vào copy-mode của tmux thay vì tạo
# selection của trình duyệt ⇒ sinh viên KHÔNG copy được output bằng chuột (phải
# giữ Shift, thứ không ai tự đoán ra). Trên nền tảng học DevOps, copy output là
# thao tác thường xuyên nhất — đắt hơn nhiều so với tiện ích cuộn bằng chuột.
# Xem lại khi 1.F đo thật hành vi chuột trong xterm.js.
set -g mouse off
set -g history-limit 50000

# Escape ngắn: mặc định 500ms làm phím Esc trong vim trễ thấy rõ qua WS.
set -sg escape-time 10

# Đánh số từ 1: phím số trên bàn phím bắt đầu từ 1, không phải 0.
set -g base-index 1
setw -g pane-base-index 1
