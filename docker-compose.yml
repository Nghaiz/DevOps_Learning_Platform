# Hạ tầng dữ liệu cho DEV. Prod dùng Helm chart ở infra/helm/platform.
#
# Named volume bắt buộc (rules/docker-volume-discipline.md): anonymous volume của
# image postgres/redis trông y hệt rác prune được, `docker volume prune` là mất data.
#
# BIND 127.0.0.1, KHÔNG PHẢI 0.0.0.0. Máy dev thường nằm trên LAN cùng host lab;
# Redis publish ra 0.0.0.0 nghĩa là bất kỳ ai cùng mạng cũng ghi đè được
# `session:{id}:pod` — mà đó chính là SSOT ánh xạ session → pod, nên ở P1 nó
# thành đường nối user A vào pod của user B. Đổi POSTGRES_HOST/REDIS_HOST nếu
# thật sự cần expose (và lúc đó phải có mật khẩu thật).

services:
  postgres:
    image: postgres:16-alpine
    container_name: dlp-postgres
    # KHÔNG `unless-stopped`: stack dev không nên tự bật lại mỗi lần boot máy.
    restart: 'no'
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-dlp}
      # `:?` chứ không phải `:-`: thiếu env là DỪNG, không im lặng dùng mật khẩu
      # nằm sẵn trong git. .env ở root (gitignored) giữ giá trị dev.
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD chưa đặt — copy .env.example sang .env}
      POSTGRES_DB: ${POSTGRES_DB:-dlp}
    ports:
      - '${POSTGRES_HOST:-127.0.0.1}:${POSTGRES_PORT:-5432}:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-dlp} -d ${POSTGRES_DB:-dlp}']
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: dlp-redis
    restart: 'no'
    # appendonly: warm-pool và session→pod map sống ở Redis. Mất RAM mà không có
    # AOF nghĩa là mất toàn bộ session đang chạy.
    # notify-keyspace-events PHẢI khớp bản in-cluster
    # (infra/helm/platform/templates/datastore-redis.yaml). Redis MẶC ĐỊNH TẮT
    # keyspace notification, và khi tắt thì `SUBSCRIBE __keyevent@0__:expired`
    # vẫn THÀNH CÔNG — chỉ là không bao giờ có event nào tới. Reaper tầng 1 sẽ
    # chạy, log sạch, và không dọn gì cả. Thiếu cờ này ở dev nghĩa là reaper
    # chạy đúng trên cluster nhưng "hỏng" trên máy dev theo kiểu không có triệu
    # chứng nào — loại lệch dev/prod đắt nhất để chẩn đoán.
    # `E` = keyevent, `x` = expired.
    command:
      [
        'redis-server',
        '--appendonly',
        'yes',
        '--notify-keyspace-events',
        'Ex',
        '--requirepass',
        '${REDIS_PASSWORD:?REDIS_PASSWORD chưa đặt — copy .env.example sang .env}',
      ]
    ports:
      - '${REDIS_HOST:-127.0.0.1}:${REDIS_PORT:-6379}:6379'
    volumes:
      - redis_data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', '-a', '${REDIS_PASSWORD}', 'ping']
      interval: 5s
      timeout: 5s
      retries: 10

  # Gộp origin web ↔ terminal-gateway cho DEV (phase-1 1.B0.4). Không phải tiện
  # nghi: cookie dlp_sandbox là host-only + SameSite=Strict, nên Next ở :3000 và
  # gateway ở :8082 là hai origin và cookie KHÔNG BAO GIỜ tới gateway. Chi tiết
  # + thứ tự route: infra/dev/Caddyfile.
  #
  # `profiles` — KHÔNG chạy theo `docker compose up -d` mặc định. Proxy chỉ có
  # ích khi web và gateway đang chạy trên host; bật nó cùng Postgres/Redis sẽ
  # dựng một cổng 8080 trả 502 và làm người mới tưởng hạ tầng hỏng. Bật khi cần:
  #   docker compose --profile proxy up -d
  proxy:
    image: caddy:2-alpine
    container_name: dlp-proxy
    restart: 'no'
    profiles: ['proxy']
    ports:
      - '${PROXY_HOST:-127.0.0.1}:${PROXY_PORT:-8080}:8080'
    volumes:
      - ./infra/dev/Caddyfile:/etc/caddy/Caddyfile:ro
    # host.docker.internal có sẵn trên Docker Desktop (Windows/macOS) nhưng KHÔNG
    # có trên Docker Engine Linux — dòng này thêm nó vào /etc/hosts của container.
    # Vô hại trên Desktop, bắt buộc trên Linux; thiếu nó thì proxy trả 502 với lý
    # do "no such host" mà Caddyfile trông vẫn hoàn toàn đúng.
    extra_hosts:
      - 'host.docker.internal:host-gateway'

  # Controlled local delivery: docker compose --profile mail up -d mailpit.
  # No relay is configured; this inbox cannot deliver to real recipients.
  mailpit:
    image: axllent/mailpit:v1.29.4
    container_name: dlp-mailpit
    restart: 'no'
    profiles: ['mail']
    ports:
      - '127.0.0.1:1025:1025'
      - '127.0.0.1:8025:8025'

volumes:
  postgres_data:
  redis_data:
